name: Debian Package

# Baut das LoxPanel-Server .deb bei jedem v*-Tag (und manuell) und haengt es an
# den GitHub-Release. Das Paket ist Architecture: all — Python 3.12 + venv werden
# beim Installieren per uv eingerichtet, daher kein Cross-Compile noetig.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .deb bauen
        run: sh packaging/deb/build.sh

      - name: An den Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: loxpanel-server_*_all.deb

      - name: Als Artefakt (auch ohne Tag)
        uses: actions/upload-artifact@v4
        with:
          name: loxpanel-server-deb
          path: loxpanel-server_*_all.deb
