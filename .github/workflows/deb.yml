name: Debian Package

# Baut das LoxPanel-Server .deb bei jedem v*-Tag (und manuell) und haengt es an
# den GitHub-Release. Das Paket ist Architecture: all — Python 3.12 + venv werden
# beim Installieren per uv eingerichtet, daher kein Cross-Compile noetig.
# Die Version kommt aus loxberry-plugin/plugin.cfg (wie bei der APK).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur Projektversion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION=//p' loxberry-plugin/plugin.cfg | tr -d '\r')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu loxberry-plugin/plugin.cfg (VERSION=$v)"
            exit 1
          fi

      - name: .deb bauen
        env:
          # Commit fuer bin/version.json (Anzeige im Konfigurator)
          LOXPANEL_COMMIT: ${{ github.sha }}
        run: sh packaging/deb/build.sh

      - name: An den Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: loxpanel-server_*_all.deb

      - name: Als Artefakt (auch ohne Tag)
        uses: actions/upload-artifact@v4
        with:
          name: loxpanel-server-deb
          path: loxpanel-server_*_all.deb
