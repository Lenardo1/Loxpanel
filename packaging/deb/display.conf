# LoxPanel Display-Abschaltung - wird vom Dienst loxpanel-display eingelesen.
# Sekunden ohne Eingabe, bis das Display abschaltet (Bildsignal + Backlight).
# 0 = nie abschalten. Antippen weckt sofort. Nach Aenderung:
#   systemctl restart loxpanel-display
DPMS_OFF=180
# Optionale feste Ein-Helligkeit (1..max, meist 255). Leer = aktueller Wert/Maximum.
BL_ON=
# X-Sitzung wird normal automatisch erkannt (lightdm bzw. /home/*/.Xauthority).
# Nur bei Bedarf fest vorgeben:
#XUSER=linaro
#DISPLAY=:0
#XAUTHORITY=/home/linaro/.Xauthority
