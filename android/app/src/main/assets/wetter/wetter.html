<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0e0e0e;color:#fff;font-family:sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .ico{display:inline-block;color:#fff}
  .ico svg{width:100%;height:100%}
  #kurz{display:inline-flex;align-items:center;height:100vh;padding:0 14px;box-sizing:border-box;gap:12px}
  #kurz .ico{width:36px;height:36px;flex:none}
  #kurz .t{font-size:26px;font-weight:600;letter-spacing:-.5px}
  #kurz .z{display:flex;flex-direction:column;line-height:1.2}
  #kurz .a{font-size:14px;color:#ddd;white-space:nowrap}
  #kurz .b{font-size:13px;color:#8a8a8a;white-space:nowrap}
  #lang{display:none;height:100vh;box-sizing:border-box;padding:18px 20px;border-radius:0 0 16px 16px}
  body.offen #kurz{display:none} body.offen #lang{display:block}
  #lang h1{margin:0 0 4px;font-size:15px;font-weight:600;color:#8a8a8a;text-transform:uppercase;letter-spacing:1px}
  #lang .jetzt{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  #lang .jetzt .ico{width:56px;height:56px}
  #lang .jetzt .t{font-size:44px;font-weight:600}
  #lang .jetzt .z{font-size:15px;color:#ddd;line-height:1.4}
  #tage{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px}
  .tag{background:#1c1c1c;border-radius:12px;padding:12px 8px;text-align:center}
  .tag .n{font-size:14px;color:#8a8a8a;margin-bottom:6px}
  .tag .ico{width:44px;height:44px}
  .tag .mm{font-size:18px;font-weight:600;margin-top:6px}
  .tag .mm span{color:#8a8a8a;font-weight:400}
  .tag .d{font-size:12px;color:#bbb;margin-top:4px;min-height:30px}
  .tag .r{font-size:12px;color:#6fa8dc;margin-top:2px}
</style></head>
<body>
<div id="kurz"><span class="ico" id="ki"></span><span class="t" id="kt">…</span>
  <span class="z"><span class="a" id="ka"></span><span class="b" id="kb"></span></span></div>
<div id="lang"><h1>Wetter</h1>
  <div class="jetzt"><span class="ico" id="li"></span><span class="t" id="lt"></span><span class="z" id="lz"></span></div>
  <div id="tage"></div></div>
<script>
function e(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ico(d,k){return (d.icons&&d.icons[k])||'';}
function zeigen(d){
  const c=d.cur||{};
  document.getElementById('ki').innerHTML=ico(d,c.icon);
  document.getElementById('kt').textContent=c.t||'';
  document.getElementById('ka').textContent=c.desc||'';
  document.getElementById('kb').textContent=c.mm||'';
  document.getElementById('li').innerHTML=ico(d,c.icon);
  document.getElementById('lt').textContent=c.t||'';
  document.getElementById('lz').innerHTML=e(c.desc)+'<br>'+e(c.extra||'');
  document.getElementById('tage').style.setProperty('--n',Math.max(1,(d.days||[]).length));
  document.getElementById('tage').innerHTML=(d.days||[]).map(t=>
    '<div class="tag"><div class="n">'+e(t.name)+'</div><div class="ico">'+ico(d,t.icon)+'</div>'+
    '<div class="mm">'+e(t.max)+' <span>'+e(t.min)+'</span></div><div class="d">'+e(t.desc)+'</div>'+
    (t.pop!=null?'<div class="r">'+e(t.pop)+' % Regen</div>':'')+'</div>').join('');
  requestAnimationFrame(messen);
}
function messen(){ const k=document.getElementById('kurz');
  if(window.LoxWetter && k && !document.body.classList.contains('offen')) LoxWetter.breite(Math.ceil(k.getBoundingClientRect().width)); }
function offen(o){document.body.classList.toggle('offen',!!o);}
document.body.addEventListener('click',()=>{ if(window.LoxWetter) LoxWetter.umschalten(); });
</script></body></html>
