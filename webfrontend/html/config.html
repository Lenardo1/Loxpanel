<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoxPanel — Konfiguration</title>
<style>
  :root{
    --bg:#16181c; --panel:#1c1f24; --panel2:#212530; --line:#2a2e35;
    --fg:#e7e9ec; --muted:#9aa0a8; --accent:#e0a24d; --good:#52b881; --crit:#e2695f;
    --radius:12px;
    --font:"Inter","Roboto","Segoe UI Variable Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;}
  a{color:var(--accent);text-decoration:none;}
  .wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
  /* Sidebar */
  .side{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
  .brand{font-size:20px;font-weight:600;letter-spacing:.2px;}
  .brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}
  .plist{display:flex;flex-direction:column;gap:6px;}
  .pitem{display:flex;flex-direction:column;gap:1px;padding:9px 11px;border-radius:10px;border:1px solid transparent;cursor:pointer;}
  .pitem:hover{background:var(--panel2);}
  .pitem.active{background:var(--panel2);border-color:var(--accent);}
  .pitem .pn{font-weight:550;}
  .pitem .pid{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;}
  .addbtn{margin-top:2px;background:transparent;color:var(--accent);border:1px dashed #3a3f49;border-radius:10px;padding:9px;cursor:pointer;font:inherit;}
  .addbtn:hover{border-color:var(--accent);}
  .hint{margin-top:auto;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px;}
  .hint code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:12px;}
  /* Main */
  .main{padding:26px 30px;overflow-y:auto;max-height:100vh;}
  .ehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .ehead h2{margin:0;font-size:22px;font-weight:600;}
  .badge{font-family:ui-monospace,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:999px;}
  .url{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .url code{color:var(--fg);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600;}
  .card .note{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .field{display:flex;flex-direction:column;gap:6px;max-width:420px;}
  label.lbl{font-size:13px;color:var(--muted);}
  input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font:inherit;}
  input:focus{outline:none;border-color:var(--accent);}
  .sizes{display:flex;gap:16px;flex-wrap:wrap;}
  .sizes .field{max-width:120px;}
  /* chips (tabs) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;user-select:none;font-size:14px;}
  .chip.on{background:rgba(224,162,77,.14);border-color:var(--accent);color:var(--fg);}
  .chip.dis{opacity:.4;cursor:not-allowed;}
  .chip.cat{border-style:dashed;}
  .chip .star{color:var(--accent);font-size:11px;margin-left:6px;}
  .chip .chic{width:15px;height:15px;object-fit:contain;vertical-align:-2px;margin-right:6px;}
  #tabcount{margin-left:6px;color:var(--muted);font-size:12.5px;}
  #tabcount.full{color:var(--accent);}
  /* checklist */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .count{color:var(--muted);font-size:13px;}
  .count b{color:var(--fg);}
  .minibtn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;}
  .minibtn:hover{border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
  .opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;user-select:none;}
  .opt:hover{border-color:#3a3f49;}
  .opt.on{border-color:var(--accent);background:rgba(224,162,77,.08);}
  .opt .box{width:18px;height:18px;border-radius:5px;border:1.5px solid #454b55;display:grid;place-items:center;flex:none;color:var(--bg);font-size:12px;font-weight:700;}
  .opt.on .box{background:var(--accent);border-color:var(--accent);}
  .opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* footer actions */
  .actions{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;padding:16px 0 6px;background:linear-gradient(transparent,var(--bg) 40%);}
  .btn{border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;}
  .btn.save{background:var(--accent);color:#1a1205;}
  .btn.save:hover{filter:brightness(1.06);}
  .btn.del{background:transparent;color:var(--crit);border:1px solid #45343a;}
  .btn.del:hover{border-color:var(--crit);}
  .toast{margin-left:auto;color:var(--good);font-size:14px;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .toast.err{color:var(--crit);}
  .empty{color:var(--muted);padding:40px 0;}
  /* Kachel-Liste */
  .tlist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;}
  .trow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
  .trow:hover{background:var(--panel2);}
  .trow.active{background:var(--panel2);border-color:var(--accent);}
  .trow .tico{width:22px;height:22px;background:var(--muted);flex:none;-webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .trow .tico.gen{background:#3a3f49;border-radius:5px;-webkit-mask:none;mask:none;}
  .trow .tnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trow .trm{color:var(--muted);font-size:12px;}
  .trow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
  .trow .eye{flex:none;width:30px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted);cursor:pointer;}
  .trow .eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .trow .eye:hover{background:var(--bg);color:var(--fg);}
  .trow .eye.off{color:var(--crit);}
  .trow.hidden .tico{opacity:.4;} .trow.hidden .tnm{opacity:.5;text-decoration:line-through;} .trow.hidden .trm{opacity:.5;}
  .thidden{color:var(--crit);}
  /* Kachel-Editor */
  .tedit{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;}
  .tprev{width:150px;height:110px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;justify-content:space-between;padding:12px;overflow:hidden;}
  .tprev .pico{width:34px;height:34px;color:var(--accent);}
  .tprev .pico svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tprev .pico.img{display:inline-block;width:34px;height:34px;background:var(--accent);-webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .tprev .pnm{font-weight:550;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tctrl{flex:1;min-width:280px;display:flex;flex-direction:column;gap:9px;}
  .crow{display:flex;align-items:center;gap:10px;}
  .crow .lbl{width:92px;flex:none;}
  .crow input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;}
  .crow .cval{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);flex:1;}
  .frow{display:flex;align-items:center;gap:10px;}
  .frow .lbl{width:92px;flex:none;}
  .itabs{display:flex;gap:6px;flex-wrap:wrap;}
  .itab{padding:5px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted);}
  .itab.on{border-color:var(--accent);color:var(--fg);background:rgba(224,162,77,.14);}
  .itab.dis{opacity:.45;cursor:default;}
  .ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;}
  .iopt{display:grid;place-items:center;height:38px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--fg);}
  .iopt:hover{border-color:var(--accent);}
  .iopt.sel{border-color:var(--accent);background:rgba(224,162,77,.14);}
  .iopt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .iopt .loxi{width:24px;height:24px;background:var(--fg);-webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .iopt.clear{font-size:20px;color:var(--muted);}
  .tgl{display:inline-grid;place-items:center;width:34px;height:32px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;user-select:none;}
  .tgl.it{font-style:italic;font-family:Georgia,serif;font-weight:600;}
  .tgl.on{border-color:var(--accent);color:var(--fg);background:rgba(224,162,77,.14);}
  select{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 10px;font:inherit;max-width:220px;}
  select:focus{outline:none;border-color:var(--accent);}
  .muted{color:var(--muted);padding:12px;}
  /* Aktiv-Overlay-Editor */
  .ovwrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .ovctrl{flex:1;min-width:250px;display:flex;flex-direction:column;gap:9px;}
  .ovctrl .frow{display:flex;align-items:center;gap:10px;}
  .ovctrl .frow input[type=range]{flex:1;accent-color:var(--accent);}
  .ovctrl .cval{min-width:44px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
  .ovprev{flex:none;display:grid;place-items:center;}
  .ovtile{--on-rgb:224,162,77;width:132px;height:88px;border-radius:14px;display:grid;place-items:center;
    color:var(--fg);font-size:13px;font-weight:500;
    background:rgba(var(--on-rgb),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--on-rgb),var(--ov-bord,.55));}
  .ovtile.g{--on-rgb:82,184,129;} .ovtile.c{--on-rgb:226,107,95;}
  @media(max-width:720px){ .wrap{grid-template-columns:1fr;} .side{border-right:none;border-bottom:1px solid var(--line);} .main{max-height:none;} }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">LoxPanel<small>Konfiguration</small></div>
    <div class="plist" id="plist"></div>
    <button class="addbtn" id="addBtn">＋ Neues Panel</button>
    <div class="hint">Auf jedem Wandpanel die Visu mit <code>?panel=&lt;id&gt;</code> öffnen.
      <br><br><a href="/settings">⚙ Einstellungen (Miniserver / Intercom)</a>
      <br><a href="/" target="_blank" id="openVisu">↗ Visu öffnen</a></div>
  </aside>
  <main class="main" id="main"><div class="empty">lädt …</div></main>
</div>
<script>
const $ = (s,r=document)=>r.querySelector(s);
let META=null, PANELS={}, cur=null, dirty=false, tileSel=null;
function svg(inner){return '<svg viewBox="0 0 24 24">'+inner+'</svg>';}
const BICONS = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bulb:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.4 1 2.5h6c0-1.1.3-1.7 1-2.5A6 6 0 0 0 12 3Z"/>',
  switch:'<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="8" cy="12" r="2.5"/>',
  mood:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  central:'<path d="M3 11 12 4l9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  blind:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h16M4 13h16M4 17h16"/>',
  up:'<path d="m6 15 6-6 6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 0 1 0 8"/>',
  prev:'<path d="M6 6h2v12H6zM20 6v12l-9-6z"/>', next:'<path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/>',
  play:'<path d="M8 5v14l11-7z"/>', pause:'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
  alarm:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  gate:'<path d="M3 10 12 4l9 6v11H3z"/><path d="M6 21v-7h12v7"/><path d="M6 17.5h12"/>',
  thermo:'<path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z"/>',
  cam:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/>',
};
const FONTS = [
  {label:'Standard (global)', v:''},
  {label:'Inter', v:'Inter, sans-serif'},
  {label:'Roboto', v:'Roboto, sans-serif'},
  {label:'System (Sans)', v:'system-ui, sans-serif'},
  {label:'Arial', v:'Arial, Helvetica, sans-serif'},
  {label:'Verdana', v:'Verdana, Geneva, sans-serif'},
  {label:'Tahoma', v:'Tahoma, sans-serif'},
  {label:'Trebuchet MS', v:'"Trebuchet MS", sans-serif'},
  {label:'Georgia (Serif)', v:'Georgia, serif'},
  {label:'Times (Serif)', v:'"Times New Roman", Times, serif'},
  {label:'Monospace', v:'ui-monospace, "Courier New", monospace'},
];
const sameFont=(f,v)=>((f||'')===(v||''));
const customFont=(f)=>!!f && !FONTS.some(x=>x.v===f);

async function load(){
  const r = await fetch('/api/meta'); META = await r.json();
  PANELS = JSON.parse(JSON.stringify(META.panels||{}));
  if(!PANELS.default) PANELS.default = {title:'LoxPanel', tabs:META.tabs.map(t=>t.tab), rooms:[], cats:[], ui:{}, states:{}};
  // Virtuelles Global-Profil: bearbeitet theme.json (gilt fuer alle Panels)
  PANELS.__global__ = {title:'Global (alle Panels)', ui: JSON.parse(JSON.stringify((META.theme||{}).ui||{})), __global:true};
  cur = PANELS.default ? 'default' : Object.keys(PANELS)[0];
  renderList(); renderEditor();
}

function renderList(){
  const box=$('#plist'); box.innerHTML='';
  if(PANELS.__global__){
    const g=document.createElement('div');
    g.className='pitem'+('__global__'===cur?' active':'');
    g.innerHTML='<span class="pn">🌐 Global</span><span class="pid">alle Panels</span>';
    g.onclick=()=>{ cur='__global__'; tileSel=null; renderList(); renderEditor(); };
    box.appendChild(g);
  }
  for(const id of Object.keys(PANELS)){
    if(id==='__global__') continue;
    const p=PANELS[id];
    const d=document.createElement('div');
    d.className='pitem'+(id===cur?' active':'');
    d.innerHTML='<span class="pn">'+esc(p.title||id)+'</span><span class="pid">?panel='+esc(id)+'</span>';
    d.onclick=()=>{ cur=id; tileSel=null; renderList(); renderEditor(); };
    box.appendChild(d);
  }
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- Aktiv-Overlay (Rahmen/Füllung/Deckkraft) ----
const OV_DEF={mode:'both',fill:16,bord:55,bw:1};   // = bisheriges Aussehen
function ovVal(ov,k){ return (ov&&ov[k]!=null)?ov[k]:OV_DEF[k]; }
function pruneOverlay(host){ if(host&&host.overlay&&!Object.keys(host.overlay).length) delete host.overlay; }
function overlayFields(ov,pfx){
  const m=ovVal(ov,'mode'),fi=ovVal(ov,'fill'),bo=ovVal(ov,'bord'),bw=ovVal(ov,'bw');
  const opt=(v,t)=>'<option value="'+v+'"'+(m===v?' selected':'')+'>'+t+'</option>';
  return '<div class="frow"><label class="lbl">Darstellung</label><select id="'+pfx+'mode">'+
      opt('both','Rahmen + Füllung')+opt('border','Nur Rahmen')+opt('fill','Nur Füllung')+'</select></div>'+
    '<div class="frow"><label class="lbl">Füllung</label>'+
      '<input type="range" id="'+pfx+'fill" min="0" max="100" step="5" value="'+fi+'">'+
      '<span class="cval" id="'+pfx+'fillv">'+fi+' %</span></div>'+
    '<div class="frow"><label class="lbl">Rahmen</label>'+
      '<input type="range" id="'+pfx+'bord" min="0" max="100" step="5" value="'+bo+'">'+
      '<span class="cval" id="'+pfx+'bordv">'+bo+' %</span></div>'+
    '<div class="frow"><label class="lbl">Rahmenbreite</label><select id="'+pfx+'bw">'+
      [1,2,3,4].map(n=>'<option value="'+n+'"'+(bw===n?' selected':'')+'>'+n+' px</option>').join('')+'</select></div>';
}
function bindOverlay(pfx,getOv,onChange){
  const m=$('#'+pfx+'mode'),fi=$('#'+pfx+'fill'),bo=$('#'+pfx+'bord'),bw=$('#'+pfx+'bw'),
        fiv=$('#'+pfx+'fillv'),bov=$('#'+pfx+'bordv');
  const set=(k,v)=>{ getOv()[k]=v; onChange(); };
  if(m) m.onchange=()=>set('mode',m.value);
  if(fi) fi.oninput=()=>{ fiv.textContent=fi.value+' %'; set('fill',Number(fi.value)); };
  if(bo) bo.oninput=()=>{ bov.textContent=bo.value+' %'; set('bord',Number(bo.value)); };
  if(bw) bw.onchange=()=>set('bw',Number(bw.value));
}
function ovPreview(elId,ov){
  const el=$('#'+elId); if(!el) return;
  const m=ovVal(ov,'mode'); let fill=ovVal(ov,'fill')/100, bord=ovVal(ov,'bord')/100;
  if(m==='border') fill=0; if(m==='fill') bord=0;
  el.style.setProperty('--ov-fill',fill);
  el.style.setProperty('--ov-bord',bord);
  el.style.setProperty('--ov-bw',ovVal(ov,'bw')+'px');
}

function bindAppearance(p){
  // Handler fuer die gemeinsamen Darstellungs-Felder (Panel- + Global-Editor)
  document.querySelectorAll('input[data-ui]').forEach(inp=>{
    inp.oninput=()=>{ p.ui=p.ui||{}; const k=inp.dataset.ui;
      if(inp.value==='') delete p.ui[k]; else p.ui[k]=Number(inp.value); markDirty(); }; });
  { const fs=$('#fFontSel'), fc=$('#fFontCustom');
    if(fs) fs.onchange=()=>{ p.ui=p.ui||{};
      if(fs.value==='__custom'){ fc.style.display=''; const v=fc.value.trim(); v?p.ui.font=v:delete p.ui.font; }
      else { fc.style.display='none'; fs.value?p.ui.font=fs.value:delete p.ui.font; } markDirty(); };
    if(fc) fc.oninput=()=>{ p.ui=p.ui||{}; const v=fc.value.trim(); v?p.ui.font=v:delete p.ui.font; markDirty(); }; }
  { const ci=$('#fTextColor'), cc=$('#fTextColorClr'), cv=$('#fTextColorVal');
    if(ci) ci.oninput=()=>{ p.ui=p.ui||{}; p.ui.textColor=ci.value; if(cv)cv.textContent=ci.value; markDirty(); };
    if(cc) cc.onclick=()=>{ if(p.ui) delete p.ui.textColor; if(cv)cv.textContent='Standard'; markDirty(); }; }
  { const b=$('#fBold'); if(b) b.onchange=e=>{ p.ui=p.ui||{}; e.target.value?p.ui.bold=true:delete p.ui.bold; markDirty(); }; }
}
function appearanceFields(ui){
  ui=ui||{};
  return sizeField('Icon-Größe','iconSize',ui)+sizeField('Name-Größe','nameSize',ui)+sizeField('Sub-Größe','subSize',ui)+
    '<div class="field" style="max-width:220px"><label class="lbl">Schriftart</label>'+
      '<select id="fFontSel">'+FONTS.map(f=>'<option value="'+esc(f.v)+'"'+(sameFont(ui.font,f.v)?' selected':'')+'>'+esc(f.label)+'</option>').join('')+

function sizeField(label,key,ui){

function renderChips(p){
  const box=$('#chips'); box.innerHTML='';
  const full = p.tabs.length>=4;
  META.tabs.forEach(t=>{
    const on=p.tabs.includes(t.tab);
    const first = p.tabs.length && p.tabs.indexOf(t.tab)===firstTabIndex(p);
    const c=document.createElement('div');
    c.className='chip'+(on?' on':'')+(!on&&full?' dis':'')+(t.cat?' cat':'');
    c.innerHTML=(t.iconUrl?'<img class="chic" src="'+esc(t.iconUrl)+'">':'')+
      esc(t.label)+(on&&first?'<span class="star">★ Start</span>':'');
    c.onclick=()=>{ toggleTab(p,t.tab); renderChips(p); markDirty(); };
    box.appendChild(c);
  });
  const tc=$('#tabcount'); if(tc){ tc.textContent=p.tabs.length+'/4 gewählt'+(full?' (voll)':''); tc.className=full?'full':''; }
  // Größen-Inputs binden
  document.querySelectorAll('input[data-ui]').forEach(inp=>{
    inp.oninput=()=>{ p.ui=p.ui||{}; const k=inp.dataset.ui;
      if(inp.value==='') delete p.ui[k]; else p.ui[k]=Number(inp.value); markDirty(); };
  });
}
function firstTabIndex(p){ // kleinster Index in kanonischer Reihenfolge
  const order=META.tabs.map(t=>t.tab);
  let best=99,bt=null; p.tabs.forEach(tb=>{const i=order.indexOf(tb); if(i>-1&&i<best){best=i;bt=tb;}});
  return p.tabs.indexOf(bt);
}
function toggleTab(p,tab){
  const i=p.tabs.indexOf(tab);
  if(i>-1){ if(p.tabs.length>1) p.tabs.splice(i,1); }   // mind. 1 Tab behalten
  else {
    if(p.tabs.length>=4) return;   // max. 4 Buttons
    // in kanonischer Reihenfolge einsortieren
    const order=META.tabs.map(t=>t.tab);
    p.tabs.push(tab); p.tabs.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  }
}

function renderChecklist(p,kind){
  const list=META[kind]||[], sel=p[kind]||[];
  const box=$('#'+kind); box.innerHTML='';
  list.forEach(o=>{
    const on=sel.includes(o.uuid);
    const d=document.createElement('div');
    d.className='opt'+(on?' on':'');
    d.innerHTML='<span class="box">'+(on?'✓':'')+'</span><span class="nm">'+esc(o.name)+'</span>';
    d.onclick=()=>{ const i=p[kind].indexOf(o.uuid); if(i>-1)p[kind].splice(i,1); else p[kind].push(o.uuid);
      renderChecklist(p,kind); markDirty(); };
    box.appendChild(d);
  });
  const cnt=$('#'+(kind==='rooms'?'cntRooms':'cntCats'));
  if(cnt) cnt.innerHTML = sel.length? ('<b>'+sel.length+'</b> von '+list.length+' ausgewählt')
                                    : ('<b>alle</b> '+list.length+' sichtbar');
}

function markDirty(){ dirty=true; const t=$('#toast'); if(t){ t.className='toast'; t.textContent=''; } renderList(); }

async function save(){
  const t=$('#toast');
  try{
    const r=await fetch('/api/panels',{method:'POST',headers:{'Content-Type':'application/json'},
                          body:JSON.stringify({panels:PANELS})});
    const j=await r.json();
    if(j.ok){ dirty=false; t.className='toast show'; t.textContent='✓ Gespeichert ('+j.count+' Profile) — Panels neu laden zum Übernehmen'; }
    else { t.className='toast show err'; t.textContent='Fehler: '+(j.error||'?'); }
  }catch(e){ t.className='toast show err'; t.textContent='Fehler: '+e; }
  setTimeout(()=>{ if(t) t.classList.remove('show'); }, 4000);
}

  const ov=((PANELS[cur].tiles||{})[tileSel])||{}, cic=ov.icon||{};
  const clr=document.createElement('span'); clr.className='iopt clear'+(!ov.icon?' sel':''); clr.title='Standard-Icon'; clr.textContent='✕';
  clr.onclick=()=>{ setTileIcon(null); renderIconPick(src); }; box.appendChild(clr);
  if(src==='builtin'){
    Object.keys(BICONS).forEach(id=>{
      const b=document.createElement('span'); b.className='iopt'+(cic.src==='builtin'&&cic.id===id?' sel':''); b.title=id;
      b.innerHTML=svg(BICONS[id]);
      b.onclick=()=>{ setTileIcon({src:'builtin',id}); renderIconPick(src); }; box.appendChild(b);
    });
  } else if(src==='loxone'){
    ((((META.icons||{}).loxone))||[]).forEach(p=>{
      const b=document.createElement('span'); b.className='iopt'+(cic.src==='loxone'&&cic.p===p?' sel':''); b.title=p;
      b.innerHTML='<span class="loxi" style="--u:url(\'/icon?p='+encodeURIComponent(p)+'\')"></span>';
      b.onclick=()=>{ setTileIcon({src:'loxone',p}); renderIconPick(src); }; box.appendChild(b);
    });
  }
}

$('#addBtn').onclick=()=>{
  let id=prompt('ID des neuen Panels (klein, ohne Leerzeichen), z. B. wohnzimmer:');
  if(!id) return; id=id.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  if(!id){ alert('Ungültige ID.'); return; }
  if(PANELS[id]){ alert('Panel „'+id+'" gibt es schon.'); return; }
  PANELS[id]={title:id.charAt(0).toUpperCase()+id.slice(1), tabs:META.tabs.map(t=>t.tab), rooms:[], cats:[], ui:{}, states:{}, tiles:{}};
  cur=id; tileSel=null; renderList(); renderEditor(); markDirty();
};

window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
load().catch(e=>{ $('#main').innerHTML='<div class="empty">Konnte Daten nicht laden: '+esc(e)+'</div>'; });
</script>
</body>
</html>
