  if(d.calColors===false || cals.length<2) return '';
  return '<div class="fp-leg">'+cals.map(c=>
    '<span><i style="background:'+esc(c.color||'')+'"></i>'+esc(c.name||'')+'</span>').join('')+'</div>';
}
function fmtTemp(t){ if(t==null||isNaN(t)) return '–'; return Number(t).toLocaleString(LANG,{minimumFractionDigits:1,maximumFractionDigits:1}); }
function tdeg(v){ return v==null?'–':(Math.round(v)+'°'); }
function renderFront(){
  const wxEl=el('svWx'); if(!wxEl) return;   // die zweite Spalte prueft renderSvSide selbst
  const d=frontData||{}, w=d.weather;
  if(w){
    const fc=Array.isArray(w.forecast)?w.forecast:[];
    wxEl.style.setProperty('--fc', Math.max(1,Math.min(7,fc.length))||4);
    let html='<div class="now"><span class="ico '+esc(w.icon||'cloud')+'">'+wxSvg(w.icon)+'</span>'+
      '<span class="t">'+fmtTemp(w.temp)+'°</span>'+
      '<span class="meta"><span class="cond">'+esc(w.cond||'')+'</span>';
    if(w.hi!=null||w.lo!=null) html+='<span class="hl">Heute '+tdeg(w.hi)+' / '+tdeg(w.lo)+'</span>';
    html+='</span></div>';
    if(fc.length) html+='<div class="fore">'+fc.map(f=>
      '<div class="fc"><span class="d">'+esc(f.day||'')+'</span>'+
      '<span class="ico '+esc(f.icon||'cloud')+'">'+wxSvg(f.icon)+'</span>'+
      '<span class="tt"><span class="mx">'+tdeg(f.hi)+'</span> <span class="mn">'+tdeg(f.lo)+'</span></span></div>').join('')+'</div>';
    wxEl.innerHTML=html; wxEl.hidden=false;
  } else { wxEl.hidden=true; wxEl.innerHTML=''; }
  // Wie viele Termine auf die Uhr-Seite passen, sagt die Einstellung — mit
  // mehreren Kalendern sind drei schnell zu wenig, um den Tag zu sehen.
  const evs=(Array.isArray(d.events)?d.events:[]).slice(0,svCount(d));
  const zweite=renderSvSide(evs);   // Termine, Wetter, Energie, Kamera oder Werte
  // Kompakt-Layout aktivieren, sobald Wetter oder eine zweite Spalte da ist.
  const wrap=document.querySelector('.sv-wrap');
  if(wrap){ wrap.classList.toggle('rich', !!w || zweite);
    wrap.classList.toggle('solo', !zweite);
    // Energiefluss/Kamera rechts: Uhr nach links, Grafik bekommt die volle Hoehe.
    const box=el('svBox');
    wrap.classList.toggle('tall', !!box && !box.hidden && box.classList.contains('solo'));
    wrap.classList.toggle('verlauf', wrap.classList.contains('tall') && svKind(svSideRaw())==='chart'); }
  svFit();
}
// ---- Rechte Spalte der Uhr-Seite ----
// Was dort steht, sagt die Einstellung je Panel (svPaneCfg, vom Server):
// "" = Automatik (Termine, und sobald keine anstehen die Wetter-Details),
// "off" = keine zweite Spalte, sonst "calendar" | "weather" | "energy:<uuid>"
// | "camera:<uuid>" | "status:<uuid>,...".
// Sie greift NUR im geteilten Screensaver (quer rechts, hochkant unten, s.
// applySaverSplit) — einspaltig (4"-Panel) gibt es keine Flaeche, die
// ungenutzt bliebe, dort bleibt es bei Wetter/Uhr/Terminen.
function svKind(v){ const i=v.indexOf(':'); return i>0?v.slice(0,i):v; }
// Kamera-Widget: "camera:<uuid>|<uuid>,<uuid>" - Bild-UUID vor, Werte hinter dem Strich
function camPaneUuid(arg){ return (arg||'').split('|')[0]; }
function camPaneWerte(arg){ const i=(arg||'').indexOf('|'); return i<0?'':arg.slice(i+1); }
function svArg(v){ const i=v.indexOf(':'); return i>0?v.slice(i+1):''; }
function svSideOn(){ const s=el('saver');   // Nacht-Uhr: die zweite Spalte ruht (keine Kamera die ganze Nacht)
  return !!s && !s.classList.contains('hidden') && s.classList.contains('split') && !s.classList.contains('nacht'); }
function svSideRaw(){ return svSideOn() ? (svPaneCfg||'') : ''; }
// Terminliste — aus renderFront herausgeloest, seit sie nicht mehr die einzige
// moegliche Fuellung der Spalte ist.
function svCalHTML(d,evs){
  return '<div class="lbl">Nächste Termine</div>'+evs.map(e=>{
    const tag=evTag(d,e);
    return '<div class="sv-ev"><span class="when"><span class="day">'+esc(e.day||'')+'</span>'+
    '<span class="tm">'+esc(e.time||'')+'</span></span>'+
    '<span class="ttl">'+calDot(d,e)+esc(e.title||'')+'</span>'+
    (tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</div>'; }).join('');
}
// Wetter fuer die zweite Spalte: Stundenverlauf und die Detailwerte. Bewusst
// NICHT noch einmal die Tagesvorschau — die steht schon in der linken Spalte.
function svWeatherHTML(w){
  if(!w) return '';
  const hh=Array.isArray(w.hourly)?w.hourly:[];
  const kurve=(hh.length>=2)?'<div class="fp-curve">'+fpCurve(hh)+'</div>':'';
  const det=fpWeatherDetailHTML(w);
  return (kurve||det) ? '<div class="lbl">Wetter</div>'+kurve+det : '';
}
// Frei gewaehlte Bausteine: Name, Raum, Wert — nur lesen. Die Kacheln baut der
// Server ueber dieselbe Kette wie jede andere Kachel (status_blocks).
function renderSvStatus(box){ box.innerHTML='<div class="lbl">Werte</div>'+svStatusZeilen(); }
// Werte als Pane 2: gerahmt wie die anderen Widgets, die Zeilen teilen sich die
// Hoehe. Sind es wenige, wachsen Symbol und Schrift mit (--zh = Zeilenhoehe,
// werteEinpassen); reicht die Hoehe nicht, scrollt die Pane wie bisher.
function renderWertePane(box){
  box.innerHTML='<div class="fp-page werte"><div class="fp-h">Werte</div>'+svStatusZeilen()+'</div>';
  werteEinpassen(box);
}
// Werte: ab dieser Zeilenhoehe (px) duerfen lange Namen umbrechen
const WERTE_HOCH = 80;
function werteEinpassen(box){
  const s=box && (box.classList.contains('werte') ? box : box.querySelector('.werte')); if(!s || !s.clientHeight) return;
  const z=s.querySelector('.sv-st');
  if(z){ s.style.removeProperty('--zh'); s.classList.remove('hoch');
    const zh=z.offsetHeight; s.style.setProperty('--zh', zh+'px'); s.classList.toggle('hoch', zh>=WERTE_HOCH); }
}
// Zeilen der gewaehlten Werte (Uhr-Seite und Pane 2), ohne Werte ein Hinweis.
function svStatusZeilen(){
  const items=Array.isArray(svStatusData)?svStatusData:[];
  if(!items.length)
    return '<div class="fp-empty">'+(svStatusData===null?'Werte werden geladen …':'Keine Werte gewählt.')+'</div>';
  return items.map(it=>{
    const ton=(it.tone==='good')?' good':((it.tone==='crit')?' crit':(it.on?' on':''));
    const ico = it.iconImg ? '<span class="ico"><img src="'+esc(it.iconImg)+'" alt=""></span>'
      : it.iconUrl ? '<span class="ico img" style="--u:url(\''+esc(it.iconUrl)+'\')"></span>'
      : '<span class="ico">'+svg(ICONS[it.icon]||ICONS.info)+'</span>';
    return '<div class="sv-st'+ton+'"'+(it.color?' style="--ico:'+esc(it.color)+'"':'')+'>'+ico+
      '<span class="nm">'+esc(it.label||'')+
      (it.room?'<span class="rm">'+esc(it.room)+'</span>':'')+'</span>'+
      '<span class="vl">'+esc(it.sublabel||'')+'</span></div>'; }).join('');
}
// Audio als zweite Uhr-Spalte: passive "Now Playing"-Karte (Cover, Titel,
// Interpret) — ohne Transport/Lautstaerke, die Uhr-Seite ist zum Ansehen da.
function renderSvPlayer(box){
  const b=Array.isArray(playerData)?playerData:[];
  const title=b.find(x=>x.k==='title'), cover=b.find(x=>x.k==='cover');
  const hasT=title&&(title.text||title.sub);
  if(!b.length || !hasT){
    box.innerHTML='<div class="lbl">Audio</div><div class="fp-empty">'+
      (playerData===null?'Wird geladen …':'Nichts gewählt oder keine Wiedergabe.')+'</div>';
    return;
  }
  const src=(cover&&cover.src)||'';
  box.innerHTML='<div class="fp-page solo svplayer">'+
    '<div class="svp-cover">'+(src?'<img src="'+esc(src)+'" alt="">':'<span class="coverph">'+svg(ICONS.music)+'</span>')+'</div>'+
    '<div class="svp-title">'+esc(title.text||'')+'</div>'+
    '<div class="svp-sub">'+esc(title.sub||'')+'</div></div>';
}
// Liefert true, wenn rechts (bzw. einspaltig: unten) ueberhaupt etwas steht.
function renderSvSide(evs){
  const cal=el('svCal'), box=el('svBox');
  if(!cal||!box) return false;
  const d=frontData||{}, zwei=svSideOn(), raw=svSideRaw(), k=svKind(raw);
  // Termine: einspaltig wie bisher unter der Uhr, zweispaltig bei "calendar"
  // und in der Automatik — solange ueberhaupt welche anstehen.
  const zeigeCal = evs.length>0 && (!zwei || k==='calendar' || k==='');
  if(zeigeCal){ cal.innerHTML=svCalHTML(d,evs); cal.hidden=false; }
  else { cal.hidden=true; cal.innerHTML=''; }
  // Ist die Kamera nicht (mehr) gemeint, muss ihr <img> weg — es haengt direkt
  // an /mjpeg und streamt sonst weiter, auch unsichtbar.
  if(k!=='camera' && box.dataset.cam!==undefined){
    box.innerHTML=''; delete box.dataset.cam; delete box.dataset.camsig; }
  let inhalt=false;
  if(zwei && k!=='off' && k!=='calendar'){
    if(k==='energy'){ renderEnergyPane(box); inhalt=true; }
    else if(k==='camera'){ renderCameraPane(box); inhalt=true; }
    else if(k==='chart'){ renderChartPane(box); inhalt=true; }
    else if(k==='status'){ renderSvStatus(box); inhalt=true; }
    else if(k==='player'){ renderSvPlayer(box); inhalt=true; }
    else if(k==='weather' || (k==='' && !zeigeCal)){
      // Automatik: sobald die Termine die Spalte nicht fuellen, uebernimmt das
      // Wetter sie — sonst bliebe die halbe Flaeche leer.
      const h=svWeatherHTML(d.weather);
      if(h){ box.innerHTML=h; inhalt=true; }
    }
  }
  if(!inhalt && k!=='camera') box.innerHTML='';
  // Energiefluss und Kamera fuellen eine Seite und brauchen die Hoehengrenze
  // oben; Termine, Wetter und Werte sind Listen und duerfen wachsen (svFit
  // nimmt ihnen notfalls die unterste Zeile).
  box.classList.toggle('solo', inhalt && (k==='energy'||k==='camera'||k==='chart'||k==='player'));
  box.hidden=!inhalt;
  return zeigeCal || inhalt;
}
// ---- Ausfuehrliche "Wetter & Kalender"-Ansicht (fuer eigene Seite / Split-Pane) ----
// Zeichnet den Stunden-Temperaturverlauf als Inline-SVG (Regenband + Kurve),
// Vorschaukarten mit Regenwahrscheinlichkeit und die Termine als Tages-Agenda.
// W x H: Groesse der Zeichnung. Ohne Angabe 700 x 150, die das SVG auf seine
// Breite skaliert (Uhr-Seite, Wetter-Tab). Pane 2 zeichnet in der Groesse
// ihres Platzes, dann sind die Zahlen echte 11 px (wetterEinpassen).
function fpCurve(hourly, W=700, H=150){
  const pts=hourly.filter(h=>h && h.temp!=null);
  if(pts.length<2) return '';
  const padT=24,padB=32,padX=12,n=pts.length;
  const temps=pts.map(p=>p.temp);
  let mn=Math.min(...temps), mx=Math.max(...temps);
  if(mx-mn<4){ const c=(mx+mn)/2; mn=c-2; mx=c+2; }
  const X=i=> padX + i*(W-2*padX)/(n-1);
  const Y=t=> padT + (mx-t)*(H-padT-padB)/(mx-mn);
  const barW=Math.max(3,(W-2*padX)/n*0.55);
  // Beschriftet ist jeder dritte Punkt, auf schmaler Zeichnung seltener: eine
  // Zahl braucht gut 26 px. Der letzte Punkt nur, wenn er so weit vom vorigen
  // beschrifteten entfernt ist.
  const dx=(W-2*padX)/(n-1), jede=Math.max(3, Math.ceil(26/dx));
  const bars=pts.map((p,i)=>{ if(p.pop==null||p.pop<=0) return '';
    const bh=(p.pop/100)*(H-padB-padT)*0.55;
    return '<rect x="'+(X(i)-barW/2).toFixed(1)+'" y="'+(H-padB-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="#7fb2e6" opacity=".2"/>'; }).join('');
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.temp).toFixed(1)).join(' ');
  const area=X(0).toFixed(1)+','+(H-padB)+' '+line+' '+X(n-1).toFixed(1)+','+(H-padB);
  let lbl='';
  pts.forEach((p,i)=>{ if(i%jede===0 || (i===n-1 && (i%jede)*dx>=26)){
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="fpx">'+p.h+'</text>';
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.temp)-9).toFixed(1)+'" text-anchor="middle" class="fpt">'+p.temp+'°</text>'; }});
  return '<svg viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="fpgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
    bars+
    '<polygon points="'+area+'" fill="url(#fpgrad)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(0).toFixed(1)+'" cy="'+Y(pts[0].temp).toFixed(1)+'" r="4" fill="currentColor"/>'+
    lbl+'</svg>';
}
// Windeinheit: der Server schickt sie mit (Open-Meteo km/h, der Loxone-
// Wetterserver das, was die Anlage in ihren Formatstrings fuehrt).
function wUnit(w){ return (w&&w.wind_unit)?w.wind_unit:'km/h'; }
function windDir(deg){ const C=['N','NO','O','SO','S','SW','W','NW']; return (deg==null)?'':(C[Math.round(deg/45)%8]||''); }
// Seite 1 (fuellt die 2x2-Kachelhoehe): Aktuell + Kurve + Vorschau.
function fpWeatherMainHTML(w){
  if(!w) return '';
  return '<div class="fp-h" data-i18n>Wetter</div>'+fpNowHTML(w)+fpCurveHTML(w)+fpForeHTML(w);
}
// Teile der Wetteransicht: Pane und Screensaver setzen sie untereinander, die
// Wetter-Seite (renderFrontTab) auf zwei Spalten verteilt.
function fpNowHTML(w){
  return '<div class="fp-now"><span class="ico '+esc(w.icon||'cloud')+'">'+wxSvg(w.icon)+'</span>'+
    '<span class="t">'+fmtTemp(w.temp)+'°</span><span class="meta">'+
    '<span class="cond">'+esc(w.cond||'')+'</span>'+
    '<span class="sub">'+(w.feels!=null?'Gefühlt '+tdeg(w.feels):'')+(w.wind!=null?' · Wind '+w.wind+' '+wUnit(w):'')+'</span>'+
    '<span class="sub heute">Heute '+tdeg(w.hi)+' / '+tdeg(w.lo)+'</span></span></div>';
}
function fpCurveHTML(w){
  const hh=Array.isArray(w.hourly)?w.hourly:[];
  return hh.length>=2 ? '<div class="fp-curve">'+fpCurve(hh)+'</div>' : '';
}
function fpForeHTML(w){
  const fc=Array.isArray(w.forecast)?w.forecast:[];
  return fc.length ? '<div class="fp-fore" style="--fc:'+Math.max(1,Math.min(7,fc.length))+'">'+fc.map(f=>
    '<div class="fp-fc"><span class="d">'+esc(f.day||'')+'</span>'+
    '<span class="ico '+esc(f.icon||'cloud')+'">'+wxSvg(f.icon)+'</span>'+
    '<span class="tt"><span class="mx">'+tdeg(f.hi)+'</span> <span class="mn">'+tdeg(f.lo)+'</span></span>'+
    (f.pop!=null?'<span class="pop">'+f.pop+'%</span>':'')+'</div>').join('')+'</div>' : '';
}
// Seite 2: Detailkacheln (nur vorhandene Werte).
function fpWeatherDetailHTML(w){
  if(!w) return '';
  const det=[];
  if(w.humidity!=null) det.push(['Luftfeuchte', w.humidity+' %']);
  if(w.wind!=null) det.push(['Wind', w.wind+' '+wUnit(w)+(w.wind_dir!=null?' '+windDir(w.wind_dir):'')]);
  if(w.sunrise&&w.sunset) det.push(['Sonne', w.sunrise+' – '+w.sunset]);
  if(w.uv!=null) det.push(['UV-Index', String(w.uv)]);
  if(w.precip_sum!=null) det.push(['Niederschlag', String(w.precip_sum).replace('.',',')+' mm']);
  if(w.pressure!=null) det.push(['Luftdruck', w.pressure+' hPa']);
  return det.length ? '<div class="fp-det">'+det.map(x=>'<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('')+'</div>' : '';
}
function fpWeatherHTML(w){ if(!w) return ''; return fpWeatherMainHTML(w)+fpWeatherDetailHTML(w);
}
let calMonthOff=0, calSel='';   // Kalender-Pane: Monatsverschiebung + gewaehlter Tag (ISO)
function isoDay(dt){ const p=n=>String(n).padStart(2,'0'); return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()); }
function evRow(d,e){
  // Sind die Farben abgeschaltet, sagt sonst nichts mehr, aus welchem Kalender
  // der Termin kommt — dann traegt die Zeile den Namen, wie es die Einstellung
  // ankuendigt ("nur der Kalendername steht daneben").
  const n=(Array.isArray(d.cals)?d.cals.length:0);
  const nam=(d.calColors===false && n>1 && e.cal)
    ? '<span class="cal">'+esc(e.cal)+'</span>' : '';
  return '<div class="fp-ev"><span class="tm'+(e.allday?' all':'')+'">'+esc(e.time||'')+'</span>'+
    '<span class="ttl">'+calDot(d,e)+esc(e.title||'')+nam+
    (e.note?'<span class="note">'+esc(e.note)+'</span>':'')+'</span></div>'; }
// legende=false: die Legende steht schon unter dem Monat (Kalender in Pane 2)
function fpCalHTML(d, legende=true){
  const evs=Array.isArray(d.events)?d.events:[], hol=d.holidays||{};
  if(calSel){   // ein Tag gewaehlt -> nur dessen Termine (+ Feiertag)
    let dt; try{ dt=new Date(calSel+'T00:00'); }catch(e){ dt=new Date(); }
    const lbl=dt.toLocaleDateString(LANG,{weekday:'long',day:'numeric',month:'long'});
    let html='<div class="fp-h"><span>'+esc(lbl)+'</span><button class="fp-allbtn" data-calall="1">Alle ›</button></div>';
    if(hol[calSel]) html+='<div class="fp-ev holi"><span class="tm all">Feiertag</span><span class="ttl">'+esc(hol[calSel])+'</span></div>';
    const day=evs.filter(e=>e.date===calSel);
    if(day.length) html+=day.map(e=>evRow(d,e)).join('');
    else if(!hol[calSel]) html+='<div class="fp-empty">Keine Termine an diesem Tag.</div>';
    return html;
  }
  let html='<div class="fp-h">'+esc(d.calName||'Termine')+'</div>'+(legende?fpLegendHTML(d):'');
  if(evs.length){
    html+='<div class="fp-cal">'; let curDay=null;
    evs.forEach(e=>{ if(e.day!==curDay){ curDay=e.day; html+='<div class="fp-day">'+esc(e.day||'')+'</div>'; } html+=evRow(d,e); });
    html+='</div>';
  } else { html+='<div class="fp-empty" data-i18n>Keine Termine.</div>'; }
  return html;
}
// Vollseite (Test ?front=1): Wetter + Kalender kombiniert.
function renderFrontRich(elc){ if(!elc) return; const d=frontData||{}; elc.innerHTML=fpWeatherHTML(d.weather)+fpCalHTML(d); }
// Split-Panes: je eine eigene Pane.
// Energiefluss-Pane (Radial, Loxone-Standard): Daten vom Server ({t:'energy'});
// das Panel zeichnet Knoten + animierte Fluss-Punkte. Zahlen deutsch, W/kW auto.
function fmtPower(w){ if(w==null) return '–'; const a=Math.abs(w);
  return a<1000 ? Math.round(w)+' W' : (w/1000).toFixed(1).replace('.',',')+' kW'; }
const EICONS={
  pv:'<circle cx="12" cy="8" r="3.2"/><path d="M12 1.6v1.6M6.7 3.3l1 1M17.3 3.3l-1 1M4.5 8h1.4M18.1 8h1.4"/><path d="M6 14l1.6 6.4h8.8L18 14z"/><path d="M7.4 17.2h9.2M11 14v6.4"/>',
  grid:'<path d="M12 2 5.5 22M12 2l6.5 20M8 15h8M9.3 9h5.4"/>',
  battery:'<rect x="2" y="7" width="16" height="11" rx="2.4"/><path d="M21 11v3"/>',
  load:'<path d="M13 2 4 14h7l-1 8 10-12h-7z"/>'
};
// Knoten-Icon: echtes Loxone-Icon (in Flussfarbe eingefaerbt), sonst das
// eingebaute Symbol als Fallback. So gibt der Miniserver Icon UND Name vor
// (siehe energy_blocks/_node_icon_url im Server).
// Einfaerben rein in SVG: das Bild ist Alpha-Maske eines Rechtecks in
// Rollenfarbe. KEIN foreignObject mit CSS-mask: WebKit (Safari, iPad,
// Panel-WebViews) legt HTML mit eigener Render-Ebene im foreignObject ohne
// die translate() der Knotengruppe ab -> alle Icons landeten oben links.
// Masken-IDs sind dokumentweit eindeutig (Pane, Detailansicht und
// Screensaver koennen das Radial gleichzeitig zeigen).
let eMaskSeq=0;
function eIconMarkup(n,cls,i){
  const tag='data-ic="'+i+'"';
  if(n && n.iconUrl){
    const u=esc(String(n.iconUrl)), id='emk'+(++eMaskSeq);
    return '<mask id="'+id+'" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" '+
      'x="-13" y="-13" width="26" height="26" style="mask-type:alpha">'+
      '<image href="'+u+'" xlink:href="'+u+'" x="-13" y="-13" width="26" height="26" preserveAspectRatio="xMidYMid meet"/></mask>'+
      '<rect '+tag+' class="emask '+cls+'" x="-13" y="-13" width="26" height="26" mask="url(#'+id+')"/>';
  }
  const icon=EICONS[n&&n.icon]||EICONS.load;
  return '<g '+tag+' class="eic '+cls+'" transform="translate(-12,-12)">'+icon+'</g>';
}
// Farbe nach ROLLE (kind vom Server): prod=Quelle gruen, grid=Netzbezug ROT,
// load=Verbraucher orange, idle=0 W grau. (Fallback aus flow, falls kein kind.)
function eColorCls(n){ const k=n.kind||(n.flow==='out'?'load':(n.flow==='in'?'prod':'idle'));
  return k==='grid'?'grid':(k==='load'?'cons':(k==='prod'?'prod':'idle')); }
// Animationsrichtung nach ECHTEM Fluss (flow), entkoppelt von der Farbe:
// in = zur Mitte, out = nach aussen (in den Knoten, z.B. Einspeisung).
function eDirCls(n){ return n.flow==='in'?' fin':(n.flow==='out'?' fout':''); }
function nodeLabel(n){ return (n.name||'')+(n.soc!=null?' · '+Math.round(n.soc)+' %':''); }
// Nur Werte, die der Server kennt: unbekannter Verbrauch (null) fehlt, statt "0 W".
function efooter(tt){ const t=[];
  if(tt.prod!=null) t.push('Erzeugung <b>'+esc(fmtPower(tt.prod))+'</b>');
  if(tt.cons!=null) t.push('Verbrauch <b>'+esc(fmtPower(tt.cons))+'</b>');
  return t.join(' · '); }
// Baut das Radial als HTML-String (fuer Pane UND Detailansicht). Knoten tragen
// data-Attribute, damit updateEnergyPane() nur Werte/Farben aendert und die
// Fluss-Punkte NICHT neu erzeugt werden (Animation laeuft sonst nie durch).
function energyInner(d){
  d=d||{};
  const nodes=(d.nodes||[]).slice(0,9), N=nodes.length;
  if(!N) return '<div class="epane"><div class="ebot">Energiefluss lädt …</div></div>';
  const C=240,R=140,rn=(N>6?34:40), spokes=[],dots=[],ng=[],txts=[];   // C=240 in 480er-viewBox -> Rand fuer Beschriftung ausserhalb der Ringe
  nodes.forEach((n,i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/N, nx=C+R*Math.cos(ang), ny=C+R*Math.sin(ang);
    const col=eColorCls(n), dir=eDirCls(n), tx=nx.toFixed(1), ty=ny.toFixed(1);
    spokes.push('<line class="spoke" x1="'+C+'" y1="'+C+'" x2="'+tx+'" y2="'+ty+'"/>');
    const dx=((nx-C)*0.72).toFixed(1), dy=((ny-C)*0.72).toFixed(1);
    for(let k=0;k<2;k++) dots.push('<circle data-nd="'+i+'-'+k+'" class="edot '+col+dir+'" cx="'+C+'" cy="'+C+'" r="4.5" style="--dx:'+dx+'px;--dy:'+dy+'px;animation-delay:'+(k*1.3)+'s'+(n.flow?'':';display:none')+'"/>');
    ng.push('<g transform="translate('+tx+','+ty+')"><circle class="ering '+col+'" data-ri="'+i+'" r="'+rn+'"/>'+eIconMarkup(n,col,i)+'</g>');
    const above=ny<C-4, nm=esc(nodeLabel(n));
    const val=esc(n.flow?fmtPower(n.w):'0 W'), vcls='enval'+(col==='idle'?' idle':'');
    txts.push(above
      ? '<text class="'+vcls+'" data-vv="'+i+'" x="'+tx+'" y="'+(ny-74).toFixed(1)+'">'+val+'</text><text class="enlab" data-vl="'+i+'" x="'+tx+'" y="'+(ny-56).toFixed(1)+'">'+nm+'</text>'
      : '<text class="enlab" data-vl="'+i+'" x="'+tx+'" y="'+(ny+56).toFixed(1)+'">'+nm+'</text><text class="'+vcls+'" data-vv="'+i+'" x="'+tx+'" y="'+(ny+76).toFixed(1)+'">'+val+'</text>');
  });
  // "dicht": ab sieben Knoten stehen die Ringe so eng (rn 34 statt 40), dass
  // die Beschriftungen der Seitenknoten schon jetzt in die Nachbarringe laufen.
  // Wer die Schrift vergroessert (Screensaver), muss diesen Fall aussparen.
  return '<div class="epane'+(N>6?' dicht':'')+'"><div class="etop"><span class="ettl">'+esc(d.name||'Energiefluss')+'</span></div>'+
    '<div class="ewrap"><svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid meet">'+
    spokes.join('')+dots.join('')+'<circle class="ehub" cx="'+C+'" cy="'+C+'" r="13"/>'+ng.join('')+txts.join('')+
    '</svg></div><div class="ebot">'+efooter(d.totals||{})+'</div></div>';
}
// Struktur-Signatur: nur bei Aenderung (Knotensatz/Icons) neu zeichnen.
function energySig(d){ return ((d.nodes||[]).map(n=>(n.name||'')+'§'+(n.icon||'')+'§'+(n.iconUrl||'')).join('¦'))+'#'+((d.nodes||[]).length); }
function updateEnergyPane(elc,d){
  (d.nodes||[]).slice(0,9).forEach((n,i)=>{
    const col=eColorCls(n), dir=eDirCls(n);
    const ring=elc.querySelector('.ering[data-ri="'+i+'"]'); if(ring){ const w='ering '+col; if(ring.getAttribute('class')!==w) ring.setAttribute('class',w); }
    const ic=elc.querySelector('[data-ic="'+i+'"]'); if(ic){ const base=ic.classList.contains('emask')?'emask':'eic'; const w=base+' '+col; if(ic.getAttribute('class')!==w) ic.setAttribute('class',w); }
    const vv=elc.querySelector('[data-vv="'+i+'"]'); if(vv){ const t=n.flow?fmtPower(n.w):'0 W'; if(vv.textContent!==t) vv.textContent=t; const w='enval'+(col==='idle'?' idle':''); if(vv.getAttribute('class')!==w) vv.setAttribute('class',w); }
    const vl=elc.querySelector('[data-vl="'+i+'"]'); if(vl){ const t=nodeLabel(n); if(vl.textContent!==t) vl.textContent=t; }
    for(let k=0;k<2;k++){ const dot=elc.querySelector('.edot[data-nd="'+i+'-'+k+'"]'); if(dot){ const w='edot '+col+dir; if(dot.getAttribute('class')!==w) dot.setAttribute('class',w); const disp=n.flow?'':'none'; if(dot.style.display!==disp) dot.style.display=disp; } }
  });
  const bot=elc.querySelector('.ebot'); if(bot){ const h=efooter(d.totals||{}); if(bot.innerHTML!==h) bot.innerHTML=h; }
}
// Zeichnet in elc: nur bei Strukturaenderung Neuaufbau, sonst in-place -> Punkte laufen weiter.
function paintEnergy(elc,d){
  d=d||{};
  const sig=energySig(d);
  if(elc._esig===sig && elc.querySelector('.ewrap svg')){ updateEnergyPane(elc,d); return; }
  elc._esig=sig;
  elc.innerHTML=energyInner(d);
}
function renderEnergyPane(elc){ if(!elc) return;
  // Energiefluss in denselben gerahmten .fp-page-Block wie Wetter/Kalender (eine Seite).
  let page=elc.querySelector('.fp-page.epage');
  if(!page){ elc.innerHTML='<div class="fp-page epage solo"></div>'; page=elc.querySelector('.fp-page.epage'); }
  paintEnergy(page, energyData||{}); }

// Kamera-Pane: VOLLE Intercom-Ansicht (Klingel-Banner + Video + Tür-/Ausgang-Buttons),
// gleiche Blöcke wie der Baustein (kommen per {t:'camera'}-Push vom Server). Das Video
// wird wie beim Baustein direkt geladen (kein onload-Gate -> zeigt auch in Browsern, die
// ein nacktes MJPEG-<img> nicht rendern). Struktur nur bei Änderung neu bauen, sonst nur
// Buttons/Klingel in-place aktualisieren -> der Video-Stream läuft ununterbrochen weiter.
function renderCameraPane(elc){ if(!elc) return;
  const blocks=cameraData&&cameraData.blocks ? intercomBlocks(cameraData.blocks) : null;
  if(blocks===null){   // Push noch nicht da -> Platzhalter
    if(elc.dataset.cam!=='wait'){ elc.dataset.cam='wait'; delete elc.dataset.camsig;
      elc.innerHTML='<div class="fp-page solo campage"><div class="camwait">'+svg(ICONS.cam)+'<span>Kamera lädt …</span></div></div>'; }
    return;
  }
  const video=blocks.find(b=>b.k==='video'), row=blocks.find(b=>b.k==='row');
  const bell=blocks.find(b=>b.k==='astat'), nostat=blocks.find(b=>b.k==='status');
  const talk=blocks.find(b=>b.k==='intercom-talk');
  const baseSig=(video?'v':'')+'|'+(row?row.cells.length:0)+'|'+(nostat?nostat.text:'')+'|'+(camPaneWerte(qargCamNow())?'w':'')+'|';
  const sig=baseSig+(talk?talk.uuid:'');
  if(talk && elc.dataset.camsig===baseSig){   // Gegensprechen kommt dazu: vor die Werte unter dem Bild
    const page=elc.querySelector('.campage'), werte=page&&page.querySelector('.camwerte');
    if(page){ if(werte) werte.insertAdjacentHTML('beforebegin',intercomTalkHtml(talk));
      else page.insertAdjacentHTML('beforeend',intercomTalkHtml(talk));
      page.classList.add('intercom-page'); elc.dataset.camsig=sig; }
  }
  if(elc.dataset.camsig!==sig){          // Struktur -> Neuaufbau
    elc.dataset.camsig=sig; elc.dataset.cam='1';
    let html='<div class="cambell astat crit" hidden></div>';
    html+= video ? '<div class="video"><img alt=""></div>'
                 : '<div class="status">'+esc(nostat?nostat.text:'Kein Video')+'</div>';
    if(row) html+='<div class="brow'+(row.wrap?' wraprow':'')+'">'+row.cells.map(cellHtml).join('')+'</div>';
    if(talk) html+=intercomTalkHtml(talk);
    if(camPaneWerte(qargCamNow())) html+='<div class="camwerte werte"></div>';   // Werte unter dem Bild
    elc.innerHTML='<div class="fp-page solo campage'+(talk?' intercom-page':'')+'">'+html+'</div>';
    renderCameraWerte(elc);
    const vimg=elc.querySelector('.video img'); if(vimg&&video) vimg.src=video.src;   // direkt, KEIN onload-Gate
    if(row){ const btns=elc.querySelectorAll('.brow [data-c]');
      row.cells.forEach((c,i)=>{ const btn=btns[i]; if(!btn)return;
        btn.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(c.cmd) sendCmd(c.cmd.uuid,c.cmd.cmd,!!(cameraData&&cameraData.secured)); }); }); }
  } else {                                // gleiche Struktur -> nur Buttons und Werte aktualisieren (Video unangetastet)
    if(row){ const btns=elc.querySelectorAll('.brow [data-c]');
      row.cells.forEach((c,i)=>{ const btn=btns[i]; if(btn){ btn.textContent=c.label||''; btn.className='btn'+(c.on?' on':''); } }); }
    // Werte unter dem Bild: auch hier nachziehen - auf der Uhr-Seite kommt ein
    // Werte-Push ueber renderFront() hier an, nicht ueber renderCameraWerte()
    renderCameraWerte(elc);
  }
  const be=elc.querySelector('.cambell'); if(be){ if(bell){ be.textContent=bell.text||''; be.hidden=false; } else be.hidden=true; }
  intercomBind(elc);
}
// Der Kamera-Wert der aktiven Pane (Tab-Pane oder Widget-Seite), ohne "camera:"
// Kamera-Angabe der gerade gezeichneten Pane: auf der Uhr-Seite die des
// Screensavers (svPane), sonst die des Tabs - wie die Anmeldung in applyPane()
function qargCamNow(){ const raw=(svSideOn() ? svSideRaw() : paneRawNow())||''; return raw.indexOf('camera:')===0 ? raw.slice(7) : ''; }
// Werte unter dem Kamerabild: nur dieser Block wird neu gezeichnet (bei jedem
// {t:'svstatus'}-Push), das Video und die Tasten bleiben stehen.
function renderCameraWerte(elc){
  const box=elc && elc.querySelector('.campage .camwerte'); if(!box) return;
  box.innerHTML=svStatusZeilen();
  werteEinpassen(box);
}
function renderWeatherPane(elc){ if(!elc) return; const d=frontData||{}, w=d.weather;
  if(!w){ elc.innerHTML='<div class="fp-empty">Kein Wetter konfiguriert.</div>'; return; }
  // Seite 1 = Aktuell, Kurve, Vorschau und die Details, so hoch wie die Flaeche.
  // Passen die Details nicht mit darauf, haengt wetterEinpassen sie auf Seite 2.
  const det=fpWeatherDetailHTML(w);
  elc.innerHTML='<div class="fp-page wx">'+fpWeatherMainHTML(w)+det+'</div>'
    +(det?'<div class="fp-page wxdet" hidden></div>':'');
  wetterEinpassen(elc); }
// ---- Pane 2 nutzt ihre Flaeche (Wetter, Kalender, Werte) ----
// Wie gross die Flaeche ist, steht erst nach dem Layout fest (Split, Raster,
// Drehen). Darum misst die Visu nach dem Zeichnen und bei jeder
// Groessenaenderung von #frontpane nach und setzt Stufen, wie fitTile() bei
// den Kacheln. Container-Queries kaemen ohne JS aus, aber erst ab Chrome 105.
// Breiter als hoch um diesen Faktor: Lage und Kurve nebeneinander (Wetter),
// Monat und Termine nebeneinander (Kalender).
const PANE_BREIT = 1.45;
// Wetter: schmaler als das (px), steht die Beschreibung unter der Temperatur
// und die Vorschau laesst sich seitlich wischen, statt sich zu quetschen.
const WX_SCHMAL = 380;
// Wetter: so hoch (px) soll die Kurve mindestens werden. Fehlt der Platz,
// wandern erst die Details auf Seite 2, dann rueckt der Rest zusammen ("eng").
const WX_KURVE_MIN = 96, WX_KURVE_KNAPP = 64;
// Kalender: so hoch (px) soll die Terminliste unter dem Monat mindestens werden
// (gut drei Termine), so breit eine Spalte, wenn Monat und Termine
// nebeneinander stehen.
const KAL_LISTE_MIN = 160, KAL_SPALTE_MIN = 220;
function inhaltsBox(e){ const cs=getComputedStyle(e);
  return { w: e.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
           h: e.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom) }; }
// eng: Datum der Vorschau, das nicht in seine Zelle passt, genau so weit
// verkleinern, wie die Zelle verlangt (die Breite haengt am Panel, ein festes
// Mass passt nicht ueberall). Ohne eng gilt wieder die Schrift aus dem CSS.
function vorschauDatumEinpassen(s){
  const eng=s.classList.contains('eng');
  s.querySelectorAll('.fp-fc .d').forEach(d=>{ d.style.fontSize='';
    if(!eng || d.scrollWidth<=d.clientWidth) return;
    const fs=parseFloat(getComputedStyle(d).fontSize);
    d.style.fontSize=Math.floor(fs*d.clientWidth/d.scrollWidth*10)/10+'px'; });
}
function wetterEinpassen(elc){
  const s=elc && elc.querySelector('.fp-page.wx'), w=(frontData||{}).weather;
  if(!s || !w || !s.clientHeight) return;    // nicht zu sehen: beim Einblenden (ResizeObserver)
  const box=inhaltsBox(s), kurve=s.querySelector('.fp-curve'), det=elc.querySelector('.fp-det');
  const s2=elc.querySelector('.fp-page.wxdet');
  s.classList.toggle('breit', box.w > box.h*PANE_BREIT);
  s.classList.toggle('schmal', box.w < WX_SCHMAL);
  s.classList.remove('eng');
  // Platz fuer die Kurve: sie nimmt, was die anderen Teile uebrig lassen
  const frei=()=> kurve ? kurve.clientHeight : Infinity;
  // passt: nichts ragt aus der Seite und kein Teil aus seinem Feld (nebeneinander
  // hat die Lage ein festes Feld, ein Ueberlauf laege mitten in der Seite)
  const passt=()=> s.scrollHeight <= s.clientHeight
    && ![...s.children].some(k=>!k.hidden && k.scrollHeight > k.clientHeight+1);
  // Die Details stehen einmal: unter der Vorschau, wenn die Kurve dann noch
  // genug Platz hat, sonst auf Seite 2.
  if(det){ s.appendChild(det); if(s2 && (frei()<WX_KURVE_MIN || !passt())) s2.appendChild(det); }
  if(s2) s2.hidden=!s2.children.length;
  if(frei()<WX_KURVE_KNAPP || !passt()) s.classList.add('eng');
  vorschauDatumEinpassen(s);
  if(kurve){ const hh=Array.isArray(w.hourly)?w.hourly:[];
    kurve.innerHTML=fpCurve(hh, kurve.clientWidth, kurve.clientHeight); }
}
function fpMonthHTML(events, holidays, colors){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+calMonthOff);
  const y=base.getFullYear(), m=base.getMonth();
  const startDow=(new Date(y,m,1).getDay()+6)%7;    // 0 = Montag
  const dim=new Date(y,m+1,0).getDate();
  // Je Tag die Farben der Kalender sammeln, aus denen an ihm etwas ansteht —
  // jede Farbe nur einmal, damit fuenf Termine aus einem Abo nicht fuenf
  // gleiche Punkte ergeben.
  const evd=new Map();
  (events||[]).forEach(e=>{ if(!e||!e.date) return;
    const f=evd.get(e.date)||[]; if(e.color&&f.indexOf(e.color)<0) f.push(e.color);
    evd.set(e.date,f); });
  const hol=holidays||{}, todayISO=isoDay(new Date());
  const pad=n=>String(n).padStart(2,'0');
  const mn=new Date(y,m,1).toLocaleDateString(LANG,{month:'long',year:'numeric'});
  let html='<div class="fp-mon"><div class="fp-mon-h">'+
    '<span class="fp-mnav" data-mnav="-1">‹</span>'+
    '<span class="fp-mtitle">'+esc(mn)+'</span>'+
    '<span class="fp-mnav" data-mnav="1">›</span></div><div class="fp-mon-g">';
  html+=['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>'<div class="fp-mon-wd'+(i===6?' sun':'')+'">'+d+'</div>').join('');
  for(let i=0;i<startDow;i++) html+='<div class="fp-mon-c empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad(m+1)+'-'+pad(d);
    const dow=(startDow+d-1)%7;                     // 5=Sa, 6=So
    const isHol=!!hol[iso];
    const farben=(colors!==false ? (evd.get(iso)||[]) : []).slice(0,3);
    const cls='fp-mon-c'+(dow===5?' sat':'')+((dow===6||isHol)?' sun':'')+(isHol?' holi':'')+
      (iso===todayISO?' today':'')+(evd.has(iso)?' ev':'')+(farben.length?' dots':'')+
      (iso===calSel?' sel':'');
    const punkte=farben.length
      ? '<span class="mdots">'+farben.map(c=>'<i style="background:'+esc(c)+'"></i>').join('')+'</span>' : '';
    html+='<div class="'+cls+'" data-day="'+iso+'"'+(isHol?(' title="'+esc(hol[iso])+'"'):'')+'>'+d+punkte+'</div>';
  }
  return html+'</div></div>';
}
function renderCalendarPane(elc, nachOben){ if(!elc) return; const d=frontData||{};
  // Eine Seite so hoch wie die Flaeche: oben der Monat, darunter die Termine,
  // die den Rest fuellen und fuer sich scrollen. Ein Tipp auf einen Tag zeigt
  // dessen Termine gleich darunter. Auf breiter Flaeche stehen Monat und
  // Termine nebeneinander (kalenderEinpassen). Die Legende steht unter dem
  // Monat: dort sind die Farbpunkte, die sie erklaert.
  // Die Liste behaelt ihre Stelle (neue Daten, anderer Monat - sie zeigt alle
  // kommenden Termine); ein gewaehlter Tag oder "Alle" beginnt oben.
  const alt=elc.querySelector('.kal-liste'), oben=(alt && !nachOben) ? alt.scrollTop : 0;
  elc.innerHTML='<div class="fp-page kal"><div class="kal-monat">'+fpMonthHTML(d.events, d.holidays, d.calColors)
      +fpLegendHTML(d)+'</div><div class="kal-liste">'+fpCalHTML(d, false)+'</div></div>';
  elc.querySelectorAll('[data-mnav]').forEach(b=>b.onclick=()=>{ calMonthOff+=parseInt(b.dataset.mnav)||0; renderCalendarPane(elc); });
  elc.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{ calSel=(calSel===c.dataset.day?'':c.dataset.day); renderCalendarPane(elc, true); });
  elc.querySelectorAll('[data-calall]').forEach(b=>b.onclick=()=>{ calSel=''; renderCalendarPane(elc, true); });
  kalenderEinpassen(elc);
  const liste=elc.querySelector('.kal-liste'); if(liste && oben) liste.scrollTop=oben;
}
function kalenderEinpassen(elc){
  const s=elc && elc.querySelector('.fp-page.kal'); if(!s || !s.clientHeight) return;
  const box=inhaltsBox(s), liste=s.querySelector('.kal-liste'), monat=s.querySelector('.kal-monat');
  s.classList.remove('breit','eng','eng2');
  // Der Monat passt, wenn er weder aus der Seite noch aus seinem Feld ragt
  // (nebeneinander hat er ein festes Feld). Die Liste scrollt fuer sich.
  const passt=()=> s.scrollHeight <= s.clientHeight && monat.scrollHeight <= monat.clientHeight+1;
  // Nebeneinander, wenn die Flaeche breit ist oder unter dem Monat kaum Platz
  // fuer Termine bliebe - sofern zwei Spalten hineinpassen.
  if(box.w >= 2*KAL_SPALTE_MIN && (box.w > box.h*PANE_BREIT || liste.clientHeight < KAL_LISTE_MIN)) s.classList.add('breit');
  // Passt der Monat nicht oder bleibt untereinander zu wenig fuer die Termine,
  // ruecken die Tage zusammen, wenn noetig in zwei Stufen.
  const zuWenig=()=> !s.classList.contains('breit') && liste.clientHeight < KAL_LISTE_MIN;
  if(!passt() || zuWenig()) s.classList.add('eng');
  if(!passt() || zuWenig()) s.classList.add('eng2');
}
// Kalender-/Wetter-Seite (Tab "kalender"/"wetter", view.front): dieselben
// Bausteine wie die Split-Pane, aber auf der ganzen Kachelflaeche. Quer zwei
// Spalten, die je fuer sich scrollen (Kalender: Monat | alle Termine; Wetter:
// Lage, Kurve, Vorschau | Details), hoch/quadratisch untereinander.
function renderFrontTab(){
  const g=el('grid'), d=frontData||{}, art=view.front;
  const liste=g.querySelector('.ft-b'), oben=(g.classList.contains('fronttab') && liste) ? liste.scrollTop : 0;
  g.classList.remove('list','snapy','chartpage','lx','hpages','punkte','fuss','haus');
  g.classList.add('fronttab');
  if(art==='calendar'){
    g.innerHTML='<div class="ft ft-cal"><div class="ft-a">'+fpMonthHTML(d.events, d.holidays, d.calColors)
      +fpLegendHTML(d)+'</div><div class="ft-b">'+fpCalHTML(d)+'</div></div>';
    g.querySelectorAll('[data-mnav]').forEach(b=>b.onclick=()=>{ calMonthOff+=parseInt(b.dataset.mnav)||0; renderFrontTab(); });
    g.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{ calSel=(calSel===c.dataset.day?'':c.dataset.day); renderFrontTab();
      const b=g.querySelector('.ft-b'); if(b) b.scrollTop=0; });
    g.querySelectorAll('[data-calall]').forEach(b=>b.onclick=()=>{ calSel=''; renderFrontTab(); });
  } else {
    const w=d.weather;
    g.innerHTML = w
      ? '<div class="ft ft-wx"><div class="ft-a"><div class="fp-h" data-i18n>Wetter</div>'+fpNowHTML(w)
        +fpWeatherDetailHTML(w)+'</div><div class="ft-b">'+fpCurveHTML(w)+fpForeHTML(w)+'</div></div>'
      : '<div class="ft ft-leer"><div class="fp-empty">Kein Wetter eingerichtet (Konfigurator → Einstellungen → Kalender &amp; Wetter).</div></div>';
  }
  const b=g.querySelector('.ft-b'); if(b && oben) b.scrollTop=oben;
  renderTabs();
}
// ---- Hausuebersicht (Tab "haus", Server: _view_haus) ----
// Die Seite besteht aus benannten Bloecken (data-hb: Kopf, Zeile, je
// aktivem Geraet, je Raum, Spieler). renderHaus baut alles; kommt dieselbe
// Seite mit neuen Zustaenden, ersetzt updateHaus nur die Bloecke, deren HTML
// sich geaendert hat - solange Lage und Blockfolge (Signatur) gleich bleiben.
// Bedient wird ueber einen Klick-Verteiler am Raster (hausKlick), deshalb
// brauchen ersetzte Bloecke keine eigenen Handler.
const HS_PFEIL='<path d="m9 6 6 6-6 6"/>', HS_ZURUECK='<path d="M15 5l-7 7 7 7"/>';
const HS_LEISER='<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 12h5"/>';
const HS_LAUTER='<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 12h5M18.5 9.5v5"/>';
const HS_ENERGIE='<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', HS_RUHIG='<path d="M5 12.5l4.5 4.5L19 7.5"/>';
const HS_TASTE={prev:'Zurück', play:'Wiedergabe', pause:'Pause', next:'Weiter'};
const HS_ZENTRAL_ICO={licht:'bulb', audio:'music'};
// Mindestbreite einer Karte unter "Gerade aktiv" und einer Raumkarte, die
// Hoehe, ab der Raumkarten scrollen statt schrumpfen, und das Seitenverhaeltnis,
// das die Spaltenzahl der Raeume anstrebt (alles bei --hk 1)
const HS_AKTIV_MIN=260, HS_RAUM_MIN=200, HS_RAUM_HOCH=150, HS_RAUM_SEITE=1.4;
function hsIco(s, extra){
  const k='hs-i'+(extra?' '+extra:'');
  if(s.iconImg) return '<span class="'+k+'"><img src="'+esc(s.iconImg)+'" alt=""></span>';
  if(s.iconUrl) return '<span class="'+k+' img" style="--u:url(\''+esc(s.iconUrl)+'\')"></span>';
  return '<span class="'+k+'">'+svg(ICONS[s.icon]||ICONS.info)+'</span>';
}
function hsWo(a){ return a.label && a.label!==a.raum ? a.label+' · '+a.raum : (a.raum||a.label||''); }
// Masse der Flaeche: Massstab --hk aus der kleineren Seite (iPad quer 1, das
// grosse Display mehr, das 4"-Panel weniger), dazu die Lage: Spieler als
// Spalte rechts, wenn die Flaeche breit genug und quer ist, sonst als Leiste.
function hausLage(v){
  const g=el('grid'), cs=getComputedStyle(g);
  const w=g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const hk=Math.max(.7, Math.min(1.5, Math.min(w,h)/740)), gap=12*hk;
  const spalte=!!v.spieler && w>=860 && w>h*1.1;
  const mainW=spalte ? w-280*hk-16*hk : w;
  const zeile=!!(v.aktiv.length || v.zentral.length) && !v.liste;
  const sp=Math.max(1, Math.floor((mainW+gap)/(HS_AKTIV_MIN*hk+gap)));
  // Hoehe fuer die Raumkarten: Flaeche minus Kopf, Zeile "Gerade aktiv" und
  // (hochkant) die Spieler-Leiste
  const tH=Math.max(44,56*hk), abst=14*hk;
  let raumH=h-72*hk-abst;
  if(zeile) raumH-=Math.max(44,48*hk)+10*hk+Math.max(64,80*hk)+abst;
  if(v.spieler && !spalte) raumH-=28*hk+64*hk+12*hk+tH+abst;
  // Spalten der Raeume: die, deren Karten dem Seitenverhaeltnis am naechsten
  // kommen, ohne zu scrollen; scrollt jede Wahl, die mit den meisten Spalten
  // ueber der Mindestbreite und feste Kartenhoehe
  const n=Math.max(1, v.raeume.length);
  let best=null;
  for(let c=1;c<=4;c++){
    const cw=(mainW-(c-1)*gap)/c; if(c>1 && cw<HS_RAUM_MIN*hk) break;
    const rows=Math.ceil(n/c), ch=(raumH-(rows-1)*gap)/rows;
    const scroll=ch<HS_RAUM_HOCH*hk;
    const wert=(scroll?10:0)+Math.abs(Math.log((cw/Math.max(1,ch))/HS_RAUM_SEITE));
    if(!best || wert<best.wert) best={c, wert, scroll};
  }
  return {hk, spalte, sp, rc:best.c, rh:best.scroll ? Math.round(HS_RAUM_HOCH*1.15*hk)+'px' : '', zeile};
}
function hausBloecke(v, L){
  const B=[], d=frontData||{}, w=d.weather, ev=(Array.isArray(d.events)?d.events:[])[0];
  let kopf='<div class="hs-kopf" data-hb="kopf"><div class="hs-uhr"><span class="t" id="hsTime">--:--</span><span class="d" id="hsDate"></span></div>';
  // zweite Zeile: die Vorschau fuer morgen, ohne sie Lage und Hoch/Tief von heute
  const mo=(Array.isArray(w&&w.forecast)?w.forecast:[])[1];
  if(w) kopf+='<div class="hs-c hs-k">'+'<span class="hs-i wx">'+wxSvg(w.icon)+'</span><span class="tx"><span class="z">'+tdeg(w.temp)+'</span>'+
    '<span class="w">'+esc(mo ? [mo.day, tdeg(mo.hi)+' / '+tdeg(mo.lo)].filter(Boolean).join(' ')
      : [w.cond, (w.hi!=null||w.lo!=null) ? tdeg(w.hi)+' / '+tdeg(w.lo) : ''].filter(Boolean).join(' · '))+'</span></span></div>';
  if(ev) kopf+='<div class="hs-c hs-k"><span class="tx"><span class="w">'+esc([ev.day, ev.time].filter(Boolean).join(', '))+'</span>'+
    '<span class="z">'+esc(ev.title||'')+'</span></span></div>';
  const e=v.energie, summen=e && e.cons!=null;
  if(e) kopf+='<button type="button" class="hs-c hs-k" data-hs="energie" aria-label="'+esc(e.label)+'">'+
    '<span class="hs-i">'+svg(HS_ENERGIE)+'</span><span class="tx"><span class="z">'+esc(summen ? fmtPower(e.cons) : (e.wert||e.label))+'</span>'+
    '<span class="w">'+esc(summen ? 'Verbrauch'+(e.prod!=null ? ' · PV '+fmtPower(e.prod) : '') : e.label)+'</span></span></button>';
  B.push(['kopf','main',kopf+'</div>']);
  const zentral=v.zentral.map(z=>'<button type="button" class="btn hs-b" data-hs="zentral" data-art="'+esc(z.art)+'">'+
    svg(ICONS[HS_ZENTRAL_ICO[z.art]]||ICONS.switch)+esc(z.label)+'</button>').join('');
  const anzahl=v.aktiv.length===1 ? '1 Gerät' : v.aktiv.length+' Geräte';
  const karte=(a,i)=>'<div class="hs-c hs-a on" data-hb="a:'+esc(a.id)+'">'+hsIco(a)+
    '<span class="tx"><span class="z">'+esc(a.zustand||a.label)+'</span><span class="w">'+esc(hsWo(a))+'</span></span>'+
    '<button type="button" class="btn hs-b" data-hs="aus" data-i="'+i+'" aria-label="'+esc(a.taste+': '+hsWo(a))+'">'+esc(a.taste)+'</button></div>';
  if(v.liste){
    B.push(['lkopf','main','<div class="hs-zeile" data-hb="lkopf"><button type="button" class="btn hs-b hs-rund" data-hs="zurueck" aria-label="Zurück">'+
      svg(HS_ZURUECK)+'</button><h2>Gerade aktiv</h2><span class="n">'+anzahl+'</span>'+
      (zentral?'<span class="rechts">'+zentral+'</span>':'')+'</div>']);
    v.aktiv.forEach((a,i)=>B.push(['a:'+a.id,'liste',karte(a,i)]));
  } else {
    if(L.zeile){
      B.push(['akopf','main','<div class="hs-zeile" data-hb="akopf"><h2>Gerade aktiv</h2><span class="n">'+anzahl+'</span>'+
        (zentral?'<span class="rechts">'+zentral+'</span>':'')+'</div>']);
      // So viele Karten wie Spalten; mehr -> die letzte Stelle wird "+n weitere"
      const zeigen = v.aktiv.length>L.sp ? L.sp-1 : v.aktiv.length;
      v.aktiv.slice(0,zeigen).forEach((a,i)=>B.push(['a:'+a.id,'aktiv',karte(a,i)]));
      if(v.aktiv.length>zeigen) B.push(['mehr','aktiv','<button type="button" class="hs-c hs-a hs-mehr" data-hb="mehr" data-hs="mehr" '+
        'aria-label="Alle '+v.aktiv.length+' aktiven Geräte zeigen">+'+(v.aktiv.length-zeigen)+' weitere'+svg(HS_PFEIL)+'</button>']);
      if(!v.aktiv.length) B.push(['ruhig','aktiv','<div class="hs-c hs-a" data-hb="ruhig"><span class="hs-i ok">'+svg(HS_RUHIG)+'</span>'+
        '<span class="tx"><span class="z">Alles ruhig</span><span class="w">Kein Licht an, keine Musik</span></span></div>']);
    }
    v.raeume.forEach((r,i)=>{
      const sym=r.symbole.map(s=>'<span class="s'+(s.on?' on':'')+'">'+hsIco(s)+'</span>').join('');
      B.push(['r:'+r.id,'raeume','<button type="button" class="hs-c hs-r" data-hb="r:'+esc(r.id)+'" data-hs="raum" data-i="'+i+'" aria-label="'+esc('Raum '+r.name+' öffnen')+'">'+
        '<span class="kopf"><span class="nm">'+esc(r.name)+'</span><span class="chev'+(L.spalte?'':' rund')+'">'+svg(HS_PFEIL)+'</span></span>'+
        '<span class="wt'+((r.wert||'').length>8?' lang':'')+'">'+esc(r.wert||'')+'</span>'+
        '<span class="sb">'+esc(r.sub || (r.anzahl===1 ? '1 Baustein' : r.anzahl+' Bausteine'))+'</span>'+
        '<span class="sym">'+sym+(r.an?'<span class="an">'+r.an+' an</span>':'')+'</span></button>']);
    });
  }
  const sp=v.spieler;
  if(sp){
    const cover=sp.cover ? '<img class="hs-cov" src="'+esc(sp.cover)+'" alt="">' : '<span class="hs-cov">'+svg(ICONS.music)+'</span>';
    const zustand=sp.sub || (sp.spielt ? 'Spielt' : 'Pausiert');
    const tasten='<div class="hs-tasten">'+sp.tasten.map((t,i)=>'<button type="button" class="btn hs-b" data-hs="sp" data-i="'+i+'" aria-label="'+
      esc(HS_TASTE[t.icon]||t.icon)+'">'+svgF(ICONS[t.icon]||ICONS.info)+'</button>').join('')+'</div>';
    const l=sp.laut, pct=l ? Math.round(100*(l.wert-l.min)/Math.max(1,l.max-l.min)) : 0;
    const laut=l ? '<div class="hs-laut"><button type="button" class="btn hs-b" data-hs="laut" data-d="-1" aria-label="Leiser">'+svg(HS_LEISER)+'</button>'+
      '<span class="v"><span>'+l.wert+'</span><span class="bar"><i style="width:'+pct+'%"></i></span></span>'+
      '<button type="button" class="btn hs-b" data-hs="laut" data-d="1" aria-label="Lauter">'+svg(HS_LAUTER)+'</button></div>' : '';
    const kl=' class="hs-c hs-sp'+(sp.spielt?' spielt':'')+(L.spalte?'':' leiste'+(sp.spielt?' on':''))+'" data-hb="sp"';
    if(L.spalte){
      const zonen=sp.zonen.length>1 ? '<div class="hs-zonen"><span class="lbl">Zonen</span>'+sp.zonen.map(z=>
        '<button type="button" class="btn hs-b hs-zone'+(z.id===sp.zone?' akt':'')+'" data-hs="zone" data-id="'+esc(z.id)+'" aria-pressed="'+(z.id===sp.zone)+'">'+
        '<span class="hs-i'+(z.spielt?' wx':'')+'">'+svg(ICONS.music)+'</span><span class="tx"><span class="z">'+esc(z.name)+'</span>'+
        '<span class="w">'+esc(z.spielt ? ['Spielt', z.titel].filter(Boolean).join(' · ') : 'Aus')+'</span></span></button>').join('')+'</div>' : '';
      B.push(['sp','seite','<div'+kl+'><div class="hs-spk"><b>Audio</b><span>'+esc(sp.name)+'</span></div>'+
        '<div class="hs-cv">'+cover+'<span class="ti">'+esc(sp.titel)+'</span><span class="w st">'+esc(zustand)+'</span></div>'+
        tasten+laut+zonen+'</div>']);
    } else {
      const i=sp.zonen.findIndex(z=>z.id===sp.zone), weiter=sp.zonen[(i+1)%sp.zonen.length];
      const zw=sp.zonen.length>1 ? '<button type="button" class="btn hs-b hs-zw" data-hs="zone" data-id="'+esc(weiter.id)+'" aria-label="'+
        esc('Zone wechseln, jetzt '+sp.name+', weiter zu '+weiter.name)+'">'+svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>')+'<span>'+esc(sp.name)+'</span></button>' : '';
      B.push(['sp','unten','<div'+kl+'><div class="r1">'+cover+'<span class="tx"><span class="ti">'+esc(sp.titel)+'</span>'+
        '<span class="w st">'+esc(zustand+(sp.zonen.length>1?'':' · '+sp.name))+'</span></span>'+zw+'</div>'+
        '<div class="r2">'+tasten+laut+'</div></div>']);
    }
  }
  return B;
}
// Signatur: Lage und Blockfolge. Gleich -> updateHaus darf Bloecke tauschen.
function hausSig(L, B){ return JSON.stringify([L.spalte, L.sp, L.rc, L.rh, L.zeile, B.map(b=>b[0])]); }
// Masse der Lage als CSS-Variablen; auch bei gleicher Signatur, denn --hk (Schrift-
// Skalierung) waechst und schrumpft mit dem Fenster, ohne dass die Lage kippt
function hausMasse(g, L){
  g.style.setProperty('--hk', L.hk.toFixed(3));
  g.style.setProperty('--hs-sp', L.sp);
  g.style.setProperty('--hs-rc', L.rc);
  if(L.rh) g.style.setProperty('--hs-rh', L.rh); else g.style.removeProperty('--hs-rh');
}
// Raumkarten, die ihren Inhalt nicht fassen (zweizeiliger Name, langer
// Zustand): die Reihen so hoch, wie die hoechste Karte braucht - dann
// scrollt die Liste senkrecht, statt dass eine Zeile abgeschnitten wird.
// Nach hausMasse, das --hs-rh auf die gerechnete Hoehe zuruecksetzt
function hausReihen(g){
  const karten=[...g.querySelectorAll('.hs-r')];
  if(karten.some(k=>k.scrollHeight>k.clientHeight+1))
    g.style.setProperty('--hs-rh', Math.ceil(Math.max(...karten.map(k=>k.scrollHeight)))+'px');
}
function renderHaus(){
  const g=el('grid'), v=view;
  g.classList.remove('list','snapy','lx','hpages','punkte','fuss','panel','bigpage','anchorbot','scheme','fronttab','chartpage');
  g.classList.add('haus');
  // Unterseite "Gerade aktiv", aber nichts mehr an: zurueck zur Uebersicht
  if(v.liste && !v.aktiv.length){ if(stack.length>1) back(); }
  const L=hausLage(v);
  hausMasse(g, L);
  const B=hausBloecke(v, L), teil=o=>B.filter(b=>b[1]===o).map(b=>b[2]).join('');
  let main=teil('main');
  if(v.liste) main+='<div class="hs-liste">'+teil('liste')+'</div>';
  else { main+=(L.zeile?'<div class="hs-aktiv">'+teil('aktiv')+'</div>':'')+'<div class="hs-raeume">'+teil('raeume')+'</div>'; }
  main+=teil('unten');
  g.innerHTML='<div class="hs'+(L.spalte?' spalte':'')+'"><div class="hs-main">'+main+'</div>'+teil('seite')+'</div>';
  B.forEach(b=>{ const n=g.querySelector('[data-hb="'+CSS.escape(b[0])+'"]'); if(n) n._h=b[2]; });
  hausReihen(g);
  g._hsSig=hausSig(L, B);
  if(!g._hsKlick){ g._hsKlick=true; g.addEventListener('click', hausKlick); }
  tickClock();
  renderTabs();
}
// Gleiche Seite, neue Zustaende: nur geaenderte Bloecke tauschen. false ->
// Lage oder Blockfolge anders, renderHaus baut neu.
function updateHaus(){
  const g=el('grid'), v=view;
  if(!v || v.layout!=='haus' || !g.classList.contains('haus')) return false;
  if(v.liste && !v.aktiv.length) return false;
  const L=hausLage(v), B=hausBloecke(v, L);
  if(g._hsSig!==hausSig(L, B)) return false;
  hausMasse(g, L);
  B.forEach(([k,,h])=>{
    const n=g.querySelector('[data-hb="'+CSS.escape(k)+'"]');
    if(!n || n._h===h) return;
    const t=document.createElement('template'); t.innerHTML=h;
    const m=t.content.firstElementChild; m._h=h; n.replaceWith(m);
  });
  hausReihen(g);
  tickClock();
  return true;
}
function hausZone(id){
  const r=Object.assign({}, view.route, {zone:id});
  stack[stack.length-1]=r; send({t:'nav', route:r});
}
function hausKlick(e){
  const v=view; if(!v || v.layout!=='haus') return;
  const b=e.target.closest('[data-hs]'); if(!b) return;
  const art=b.dataset.hs, i=+b.dataset.i, sp=v.spieler;
  if(art==='raum'){ const r=v.raeume[i]; if(r) nav(r.nav); }
  else if(art==='aus'){ const a=v.aktiv[i]; if(a) sendCmd(a.aus.uuid, a.aus.cmd, a.secured); }
  else if(art==='zentral'){ if(verbindungGesperrt()) verbindungZeigen(true); else send({t:'hausaus', art:b.dataset.art}); }
  else if(art==='mehr') nav(Object.assign({}, v.route, {liste:'aktiv'}));
  else if(art==='zurueck') back();
  else if(art==='energie'){ if(v.energie) nav(v.energie.nav); }
  else if(art==='sp'){ const t=sp && sp.tasten[i]; if(t) sendCmd(t.cmd.uuid, t.cmd.cmd, sp.secured); }
  else if(art==='laut' && sp && sp.laut){
    const l=sp.laut, neu=Math.max(l.min, Math.min(l.max, l.wert+(+b.dataset.d)*l.schritt));
    if(neu!==l.wert) sendCmd(l.cmd.uuid, l.cmd.tmpl.replace('{v}', neu), sp.secured); }
  else if(art==='zone' && b.dataset.id) hausZone(b.dataset.id);
}
// Test-/Vorschau-Schalter: ?front=1 zeigt die ausfuehrliche Ansicht als Vollseite.
const FRONT_TEST=new URLSearchParams(location.search).has('front');
if(FRONT_TEST){ const fp=el('frontPage'); if(fp) fp.classList.remove('hidden'); }
function saverOn(){ return !el('saver').classList.contains('hidden'); }
// Screensaver zweispaltig im Querformat (breites 2-Pane-Tablet, z.B. Shelly
// X2) – gleiches Kriterium wie das Kachel-Grid (s. render()). Hochkant liegt
// die zweite Flaeche UNTER Uhr und Wetter (Klasse "hoch"), sobald der Kasten
// deutlich hoeher als breit ist (mind. Wurzel 2, wie bei der Verdopplung nach
// unten) - gemessen am Kasten, denn in ihm liegt der Screensaver. Das
// quadratische 4"-Panel bleibt einspaltig (Wetter oben, Uhr, Termine
// untereinander).
// WICHTIG: Die Entscheidung haengt an der aktuellen Fenster- und Kastengroesse,
// die beim Kiosk-Start / nach dem Auto-Reload (Speichern) kurz falsch sein
// kann, bevor die echte Flaeche steht. Darum gekapselt und bei jedem resize und
// jeder Groessenaenderung des Kastens neu getroffen – sonst bleibt die Anzeige
// in der beim Start zufaellig gemessenen Spaltigkeit haengen (2-spaltig direkt
// nach dem Speichern, erst spaeter wieder einspaltig).
function applySaverSplit(){
  const s=el('saver'), sc=document.querySelector('.screen');
  const vp=vpSize(), quer=vp.w > vp.h;
  const hoch=!!themeSplit && !quer && !!sc && sc.offsetHeight >= sc.offsetWidth*Math.SQRT2;
  s.classList.toggle('split', (!!themeSplit && quer) || hoch);
  s.classList.toggle('hoch', hoch);
}
function showSaver(){
  pinVergessen();   // Uhr-Seite: gemerkte PIN weg
  gestenHilfeWeg(); // ... und die Hilfe der Gesten
  // Native Kiosk-App (LoxPanel): nur EIN sichtbarer Screensaver — diese Uhr.
  // Der App sagen, dass ihr Saver läuft; sie dunkelt nur noch das Backlight
  // (nach dpmsOff) und weckt per Annäherung/Berührung auf den 1. Tab.
  try{ if(window.LoxKiosk && LoxKiosk.setSaver) LoxKiosk.setSaver(true); }catch(e){}
  tickClock();
  applySaverSplit();
  el('saver').classList.remove('hidden');
  // Reihenfolge zaehlt: erst sichtbar schalten (svSideOn() gilt), dann die
  // Energie-/Kamera-Kachel auf die Wahl des Screensavers umstellen, dann
  // zeichnen — jetzt hat er auch eine Hoehe, an der sich svFit ausrichtet.
  applyPane();
  renderFront(); }
function hideSaver(){ try{ if(window.LoxKiosk && LoxKiosk.setSaver) LoxKiosk.setSaver(false); }catch(e){}
  el('saver').classList.add('hidden');
  // Zweite Spalte abraeumen: ein Kamerabild dort haelt sonst seine Verbindung
  // zur Tuerstation offen, obwohl die Uhr-Seite gar nicht mehr zu sehen ist.
  const b=el('svBox');
  if(b){ b.innerHTML=''; b.hidden=true; delete b.dataset.cam; delete b.dataset.camsig; }
  applyPane(); }
// Einrichtungshinweis vom Server (t:'einrichtung'): solange er keine Struktur
// vom Miniserver hat, steht hier, wo der Konfigurator zu oeffnen ist. Die
// Adresse ist die, ueber die das Panel die Visu geladen hat - ausser bei
// 127.0.0.1 (die App auf dem Panel selbst), dann die des Servers im Netz.
function einrichtungsUrls(loc, msg){
  const pfad=msg.pfad||'/config';
  const h=(loc.hostname||'').replace(/^\[|\]$/g,'');
  if(!(h==='localhost' || h==='::1' || /^127\./.test(h))) return [loc.protocol+'//'+loc.host+pfad];
  const port=loc.port ? ':'+loc.port : '';
  return (msg.adressen||[]).map(a=>loc.protocol+'//'+a+port+pfad);
}
// Kopplungscode vom Server (t:'kopplung'): ein Browser ohne Geraetekennung
// bekommt beim Verbinden einen Code, merkt ihn sich (localStorage) und schickt
// ihn beim naechsten Verbinden zurueck, damit er gleich bleibt. Ohne ?panel=
// zeigt die Karte "Dieses Geraet einrichten" den Code und die Adresse des
// Konfigurators; unter Displays steht derselbe Code, "Namen vergeben" dort
// schickt setdevice an genau dieses Geraet. Ein Tipp blendet die Karte bis
// zum naechsten Laden aus.
let KOPPLUNG='';
try{ KOPPLUNG=localStorage.getItem('lp_kopplung')||''; }catch(e){}
let _kopplungWeg=false;
function zeigeKopplung(msg){
  const k=el('kopplung'); if(!k) return;
  if(msg.code){ KOPPLUNG=msg.code; try{ localStorage.setItem('lp_kopplung', msg.code); }catch(e){} }
  k.textContent='';
  if(!msg.karte || _kopplungWeg || DEVICE_ID){ k.classList.add('hidden'); return; }
  const zeile=(cls, text)=>{ const d=document.createElement('div'); d.className=cls; d.textContent=text||''; k.appendChild(d); };
  zeile('ei-titel', msg.titel); zeile('ei-code', msg.code); zeile('ei-hinweis', msg.hinweis);
  const urls=einrichtungsUrls(location, msg);
  if(urls.length) urls.forEach(u=>zeile('ei-url', u)); else zeile('ei-grund', msg.unbekannt);
  zeile('ei-weg', msg.weg);
  k.onclick=()=>{ _kopplungWeg=true; k.classList.add('hidden'); };
  k.classList.remove('hidden');
}
function kopplungVergessen(){
  KOPPLUNG=''; try{ localStorage.removeItem('lp_kopplung'); }catch(e){}
  const k=el('kopplung'); if(k) k.classList.add('hidden');
}
function zeigeEinrichtung(msg){
  const k=el('einrichtung'); if(!k) return;
  k.textContent='';
  if(!msg.aktiv){ k.classList.add('hidden'); return; }
  const zeile=(cls, text)=>{ const d=document.createElement('div'); d.className=cls; d.textContent=text||''; k.appendChild(d); };
  zeile('ei-titel', msg.titel); zeile('ei-grund', msg.grund); zeile('ei-hinweis', msg.hinweis);
  const urls=einrichtungsUrls(location, msg);
  if(urls.length) urls.forEach(u=>zeile('ei-url', u)); else zeile('ei-grund', msg.unbekannt);
  k.classList.remove('hidden');
}
// Kurze Nachricht/Banner vom Server (t:'notify') oben im Panel einblenden.
function showNotify(text, level, secs){
  if(!text) return;
  const s=document.querySelector('.screen'); if(!s) return;
  let n=s.querySelector('.lpnotify');
  if(!n){ n=document.createElement('div'); n.className='lpnotify';
    n.style.cssText='position:absolute;left:10px;right:10px;top:10px;z-index:50;padding:12px 14px;'+
      'border-radius:12px;font-size:15px;font-weight:600;line-height:1.25;text-align:center;'+
      'box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;word-break:break-word;';
    s.appendChild(n); }
  const col = level==='crit' ? '226,107,95' : (level==='warn' ? '224,162,77' : '82,184,129');
  n.style.background='rgba('+col+',.96)'; n.style.color='#10140f';
  n.textContent=text; hideSaver();
  clearTimeout(n._t);
  n._t=setTimeout(()=>{ if(n&&n.parentNode) n.parentNode.removeChild(n); }, Math.max(1,(secs||5))*1000);
}
// Fester Player im Split-Layout (linke Spalte). Baut das Grundgeruest einmal
// auf und aktualisiert danach nur Cover/Titel/Transport/Lautstaerke in-place
// (kein Neu-Rendern bei jedem 0.3s-Update -> kein Cover-Flackern).
function renderPlayer(blocks){
  const pane=el('playerpane'); if(!pane||!Array.isArray(blocks)) return;
  const cover=blocks.find(b=>b.k==='cover');
  const title=blocks.find(b=>b.k==='title');
  const row=blocks.find(b=>b.k==='row');
  const sl=blocks.find(b=>b.k==='slider');
  if(!_playerBuilt){
    pane.innerHTML=
      '<div class="fp-page solo pppage">'+
      '<div class="ppcover"><div class="coverph">'+svg(ICONS.music)+'</div><img id="ppimg" alt=""></div>'+
      '<div class="pptitle" id="pptitle"></div>'+
      '<div class="ppsub" id="ppsub"></div>'+
      '<div class="pptrans" id="pptrans"></div>'+
      '<div class="ppvol"><span class="sico">'+svg(ICONS.vol)+'</span>'+
        '<button type="button" class="sbtn" data-sd="dn">−</button>'+
        '<input type="range" class="sld" id="ppsld" min="0" max="100" value="0">'+
        '<button type="button" class="sbtn" data-sd="up">+</button><span class="sval" id="ppsldv">0</span></div>'+
      '</div>';
    const s=el('ppsld'), zurueck=()=>renderPlayer(playerData);   // PIN abgebrochen: Stand des Servers
    pane.querySelector('.ppvol .sbtn[data-sd="dn"]').addEventListener('pointerdown',ev=>{ ev.preventDefault(); nudgeSld(s,-SLD_STEP,el('ppsldv'),playerSecured,zurueck); });
    pane.querySelector('.ppvol .sbtn[data-sd="up"]').addEventListener('pointerdown',ev=>{ ev.preventDefault(); nudgeSld(s,SLD_STEP,el('ppsldv'),playerSecured,zurueck); });
    s.addEventListener('input',()=>{ _playerVolDrag=true; sldFill(s); el('ppsldv').textContent=s.value; });
    s.addEventListener('change',()=>{ _playerVolDrag=false;
      if(s._uuid&&s._tmpl) sendCmd(s._uuid,s._tmpl.replace('{v}',s.value),playerSecured,{abbruch:zurueck}); });
    _playerBuilt=true;
  }
  // Cover nur bei Aenderung neu laden (sonst Flackern)
  const img=el('ppimg');
  if(img){ if(cover&&cover.src){ if(img.getAttribute('src')!==cover.src){
        img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=cover.src; } }
    else { img.removeAttribute('src'); img.style.opacity='0'; } }
  el('pptitle').textContent=title?(title.text||''):'';
  el('ppsub').textContent=title?(title.sub||''):'';
  // Transport-Buttons: einmal bauen, dann Icon+cmd in-place aktualisieren
  const tr=el('pptrans'), cells=(row&&row.cells)||[];
  if(tr){
    if(tr.children.length!==cells.length){
      tr.innerHTML=cells.map((c,i)=>'<div class="btn'+(c.icon?' icon':'')+(c.big?' big':'')+'" data-c="'+i+'"></div>').join('');
      tr.querySelectorAll('[data-c]').forEach(n=>n.addEventListener('pointerdown',ev=>{ ev.preventDefault();
        if(n._cmd) sendCmd(n._cmd.uuid,n._cmd.cmd,playerSecured); }));
    }
    cells.forEach((c,i)=>{ const n=tr.querySelector('[data-c="'+i+'"]'); if(!n)return;
      n._cmd=c.cmd||null;
      n.innerHTML=c.icon?svgF(ICONS[c.icon]||ICONS.info):esc(c.label||'');
      n.className='btn'+(c.icon?' icon':'')+(c.big?' big':''); });
  }
  if(sl){ const s=el('ppsld'); if(s&&sl.cmd){ s._uuid=sl.cmd.uuid; s._tmpl=sl.cmd.tmpl; }
    if(s&&!_playerVolDrag){ s.value=sl.value; sldFill(s); el('ppsldv').textContent=sl.value; } }
}
// Nach Ruhe zurueck zur Startseite und zur Uhr. Ein gesetzter Filter der
// Sprungmarken faellt dabei weg, sonst zeigte das Wandpanel dauerhaft nur
// eine Gruppe.
function nachRuhe(){ katFilter=null; goTab(tabsCfg[0]||'favoriten'); showSaver(); }
function resetIdle(){ clearTimeout(idleTimer);
  idleTimer=setTimeout(nachRuhe, SAVER_IDLE_MS);
  armDpms(); }
// Der Finger, der die Uhr-Seite wegtippt, darf darunter nichts ausloesen. Sie
// verschwindet schon beim Aufsetzen; Loslassen, click und Langdruck derselben
// Beruehrung landen sonst auf der Kachel, die jetzt unter dem Finger liegt
// (Safari laesst den click durch, sobald der Finger kurz liegen bleibt). Die
// Beruehrung endet nicht an einer festen Zeit, darum gilt die Sperre bis zur
// naechsten: deren pointerdown (Capture, vor allen anderen) hebt sie auf.
let saverGeste=false;
window.addEventListener('pointerdown', ()=>{ saverGeste=false; }, true);
window.addEventListener('keydown', ()=>{ saverGeste=false; }, true);
['pointerup','click','dblclick','contextmenu'].forEach(ev=>window.addEventListener(ev, e=>{
  if(!saverGeste) return; e.preventDefault(); e.stopImmediatePropagation(); }, true));
el('saver').addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation();
  const wecken=()=>{ saverGeste=true; nightWake(); hideSaver(); resetIdle(); };
  if(gestenImDunkeln(e)) weckenAufschieben(wecken); else wecken(); });   // zwei Finger: Geste im Dunkeln
// input: Android-Tastaturen melden nicht jedes Zeichen als keydown (Name einer Weckzeit)
// Nachts abgedunkelt: das Aufhellen wartet wie das Wecken, ob ein zweiter Finger kommt
['pointerdown','keydown','input','wheel'].forEach(ev=>document.addEventListener(ev, e=>{
  if(ev==='pointerdown' && gestenImDunkeln(e)) weckenAufschieben(nightWake); else nightWake();
  if(!saverOn()) resetIdle(); }, {passive:true}));
// ---- Nachtmodus: Panel abdunkeln ----
// Tag/Nacht meldet der Server ({t:"night"}), Staerke und Aufhelldauer kommen je
// Panel im theme. Gedimmt wird ueber eine schwarze Auflage statt per CSS-Filter:
// ein Filter auf dem Seitenrumpf zerschiesst die Positionierung von
// position:fixed-Elementen, und die Auflage wirkt wie heruntergeregelte
// Hintergrundbeleuchtung (Weiss wird grau, nicht nur dunkler).
// hell: nach einer Beruehrung aufgehellt; uhr/uhrHell: Nacht-Uhr und ihre Helligkeit in %
const NIGHT = { on:false, dim:0, wake:20, hell:false, uhr:false, uhrHell:0 };
let nightEl=null, nightWakeTimer=null;
function nightLayer(){
  if(!nightEl){
    nightEl=document.createElement('div'); nightEl.id='nightdim';
    nightEl.style.cssText='position:fixed;inset:0;background:#000;opacity:0;'+
      'pointer-events:none;z-index:100000;transition:opacity .8s ease';
    document.body.appendChild(nightEl);
  }
  return nightEl;
}
// LoxPanel-App: Dort senkt die App statt der Auflage die echte Helligkeit
// (LoxKiosk.setDisplayBrightness, Prozent der eingestellten Helligkeit). Die
// Auflage wirkt auf die Farbwerte, die Leuchtdichte faellt also mit der Potenz
// 2,2 (sRGB): 70 % abdunkeln liess etwa 7 % Leuchtdichte uebrig. Dieselbe
// Einstellung ergibt in der App dieselbe Leuchtdichte. Lehnt die App ab
// (automatische Helligkeit am Geraet) oder kennt sie die Funktion nicht (aeltere
// App), dunkelt wie bisher die Auflage ab.
function appHelligkeit(dim){
  const prozent = dim>0 ? Math.max(1, Math.round(100*Math.pow(1-dim/100, 2.2))) : 100;
  try{ return !!(window.LoxKiosk && typeof LoxKiosk.setDisplayBrightness==='function'
                 && LoxKiosk.setDisplayBrightness(prozent)); }catch(e){ return false; } }
function applyNight(awake){
  NIGHT.hell=!!awake;
  const dim = (NIGHT.on && NIGHT.dim>0 && !awake) ? Math.min(90,NIGHT.dim) : 0;
  nightLayer().style.opacity = appHelligkeit(dim) ? 0 : dim/100;
}
function setNight(on){ const vorher=NIGHT.on; NIGHT.on=!!on; clearTimeout(nightWakeTimer); applyNight(false);
  if(NIGHT.on && !vorher) pinVergessen();   // Nacht beginnt: gemerkte PIN weg
  nachtUhrSetzen(); }
// ---- Nacht-Uhr ----
// Nachts zeigt die Uhr-Seite auf Wunsch nur die Uhrzeit, gedimmt auf Schwarz
// (night.uhr, Helligkeit night.uhrHell in Prozent, vom Server je Panel), wie die
// Nachtanzeige der Loxone-Taster. Oben stehen, wenn Gesten an sind, die Symbole
// ihrer Spalten (links Beschattung, Mitte Licht, rechts Musik), genau ueber der
// Mitte jeder Spalte (GESTE_SPALTEN). Wetter, Termine und die zweite Spalte
// ruhen dann: keine Kamera laeuft die ganze Nacht. "Nachts abdunkeln" wirkt
// zusaetzlich wie auf jeder Seite.
function nachtUhrAn(){ return NIGHT.on && NIGHT.uhr; }
function nachtUhrSetzen(){
  const s=el('saver'), n=el('svNacht'); if(!s || !n) return;
  const an=nachtUhrAn(), vorher=s.classList.contains('nacht');
  s.classList.toggle('nacht', an); n.hidden=!an;
  s.style.setProperty('--nu-hell', String(Math.max(0, Math.min(100, NIGHT.uhrHell))/100));
  const z=el('nuZonen');
  if(z){ const grenzen=[0, ...GESTE_SPALTEN, 1];
    z.innerHTML=gestenAn ? GESTE_ARTEN.map((a, i)=>'<span style="left:'+((grenzen[i]+grenzen[i+1])/2*100)+'%">'+
      svg(ICONS[a.ico])+'</span>').join('') : ''; }
  tickClock();
  // Wechsel, waehrend die Uhr-Seite steht: zweite Spalte an- oder abmelden, neu zeichnen
  if(an!==vorher && saverOn()){ applySaverSplit(); applyPane(); renderFront(); }
}
// Nachts abgedunkelt und nicht gerade aufgehellt (Gesten im Dunkeln)
function nachtGedimmt(){ return NIGHT.on && NIGHT.dim>0 && !NIGHT.hell; }
function nightWake(){          // Beruehrung -> kurz voll aufhellen, dann zurueck
  if(!NIGHT.on || NIGHT.dim<=0 || NIGHT.wake<=0) return;
  clearTimeout(nightWakeTimer);
  applyNight(true);
  nightWakeTimer=setTimeout(()=>applyNight(false), NIGHT.wake*1000);
}
// ---- Display ohne Agent: Kiosk-App-Anbindung (Android) ----
// Auf einem Linux-Panel schaltet der Agent das Display (Server meldet agent:true,
// die Seite haelt sich dann raus). Ohne Agent uebernimmt die Seite: nach dpmsOff
// Sekunden Inaktivitaet Display aus ueber die JS-Schnittstelle der Kiosk-App,
// bei Klingel / Wecker / Notify / Goto wieder an. Erkannt werden Fully Kiosk
// Browser (window.fully; dort "Enable JavaScript Interface" einschalten) und die
// LoxPanel-App fuer Android (window.LoxKiosk); beide haben dieselbe Schnittstelle.
// Neu laden gegen Einfrieren erledigt die Seite ohne Agent selbst (s. neuladenFaellig).
// Hat das Geraet einen Praesenzmelder (Displays -> Display-Steuerung), meldet der
// Server, solange er jemanden sieht (presence): dann bleibt das Display an, der
// Leerlauf schaltet nicht ab. Wird der Raum leer, schaltet der Server es aus.
const DISP = { dpmsOff: 0, reloadHours: 0, reloadAt: null, agent: false, presence: false };
let dpmsTimer=null;
// Kiosk-Apps: Kennung (meldet die Seite dem Server -> Typ in der Geraeteliste)
// -> Name ihrer JS-Schnittstelle im window.
const KIOSK_APPS = { fully: 'fully', loxpanel: 'LoxKiosk' };
function kioskKind(){
  for(const k in KIOSK_APPS){ const f=window[KIOSK_APPS[k]];
    if(f && typeof f.turnScreenOff==='function' && typeof f.turnScreenOn==='function') return k; }
  return '';
}
function kiosk(){ const k=kioskKind(); return k ? window[KIOSK_APPS[k]] : null; }
function screenOff(){ const f=kiosk(); if(!f) return; try{ f.turnScreenOff(); }catch(e){} }
function screenOn(){ const f=kiosk(); if(!f) return;
  try{ if(typeof f.isScreenOn!=='function' || !f.isScreenOn()) f.turnScreenOn(); }catch(e){} }
// LoxPanel-App: Ihr eigener Bildschirmschoner kommt nach dpmsOff Sekunden.
// Solange der Praesenzmelder des Geraets jemanden sieht, setzt er aus (0) -
// sonst dunkelte die App trotz Anwesenheit ab.
function appLeerlauf(){
  try{ if(window.LoxKiosk && LoxKiosk.setDisplayOff) LoxKiosk.setDisplayOff(DISP.presence ? 0 : DISP.dpmsOff); }catch(e){} }
function armDpms(){ clearTimeout(dpmsTimer);
  if(window.LoxKiosk) return;   // native LoxPanel-Kiosk-App schaltet selbst ab (eigener Screensaver)
  // Mit Agent schaltet X (xset dpms) nach dpmsOff Sekunden ohne Eingabe ab, auch
  // bei Anwesenheit (dort wirkt der Praesenzmelder nicht), und die Seite erfaehrt
  // nichts davon: Sie vergisst die gemerkte PIN zur selben Zeit. Die LoxPanel-App
  // braucht das nicht, sie dunkelt erst dpmsOff nach der Uhr-Seite ab (setSaver),
  // und die vergisst die PIN schon.
  if(DISP.agent && DISP.dpmsOff>0){ dpmsTimer=setTimeout(pinVergessen, DISP.dpmsOff*1000); return; }
  if(DISP.agent || DISP.presence || !(DISP.dpmsOff>0)) return;
  // Mit Kiosk-JS (Fully) direkt abschalten; sonst dem Server Leerlauf melden,
  // der schaltet ueber den Display-Treiber des Geraets (Fully REST / WallPanel).
  dpmsTimer=setTimeout(()=>{ pinVergessen(); if(kiosk()) screenOff(); else send({t:'idle'}); }, DISP.dpmsOff*1000); }
// ---- Skalierung ("scale" aus Profil oder Geraet, vom Server) ----
// Die Visu rechnet mit festen 240er Kacheln; ein groesseres Display zeigte den
// Kasten bisher mit Rand (1280x800: 55 % des Schirms ungenutzt). "auto"
// vergroessert ihn gleichmaessig, bis er an Breite oder Hoehe anstoesst - ohne
// Verzerrung, Schrift und Icons wachsen mit. Eine Zahl ist ein fester Faktor,
// aber nie groesser, als der Schirm hergibt (sonst waere ein Teil
// abgeschnitten). "off" = feste Groesse wie bisher. Unter "Bildschirm fuellen"
// ist der Kasten schon so gross wie der Schirm, dort ergibt sich von selbst 1.
let uiScaleCfg='off', uiScaleEff=1;
function scaleCfg(v){ return (v==='auto' || (typeof v==='number' && v>0)) ? v : 'off'; }
function applyScale(){
  const s=document.querySelector('.screen'); if(!s) return;
  const w=s.offsetWidth, h=s.offsetHeight;          // Layout-Groesse, vom transform unberuehrt
  const vp=vpSize();
  const passt=(w&&h) ? Math.min(vp.w/w, vp.h/h) : 1;
  let k=1;
  if(gridAuto) k=1;                                  // automatisches Raster: Kacheln haben ihre Groesse, der Kasten ist der Schirm
  else if(uiScaleCfg==='auto') k=Math.max(1,passt); // nur vergroessern: kleiner rechnet das Layout selbst
  else if(typeof uiScaleCfg==='number') k=Math.min(uiScaleCfg,passt);
  k=Math.round(k*1000)/1000;
  if(k!==uiScaleEff || s.style.getPropertyValue('--ui-scale')===''){
    uiScaleEff=k;
    s.style.setProperty('--ui-scale', String(k));
    document.documentElement.classList.toggle('scaled', k!==1);
  }
  reportScreen();
}
// Groesse an den Server melden (Anzeige unter Settings -> Panels). Entprellt:
// beim Drehen oder Kiosk-Start feuert resize mehrfach hintereinander. Nur
// senden, was sich geaendert hat.
let _screenTimer=null, _screenSent='';
function reportScreen(){
  clearTimeout(_screenTimer);
  _screenTimer=setTimeout(()=>{
    const s=document.querySelector('.screen'), sc=window.screen||{};
    const m={t:'screen', vw:innerWidth, vh:innerHeight, sw:sc.width||0, sh:sc.height||0,
      dpr:window.devicePixelRatio||1, bw:s?s.offsetWidth:0, bh:s?s.offsetHeight:0, k:uiScaleEff,
      rc:gridCols, rr:gridRows};   // Raster der Kachelansicht (zeigt, was "Automatisch" ergibt)
    const sig=JSON.stringify(m);
    if(sig===_screenSent) return;
    try{ send(m); _screenSent=sig; }catch(e){}
  },400);
}
// Aendert sich die Layout-Groesse des Kastens (Split an/aus beim Tab-Wechsel,
// Layout, "Bildschirm fuellen") oder des Fensters, muss der Faktor neu. Der
// transform selbst aendert die Layout-Groesse nicht - kein Rueckkopplungskreis.
window.addEventListener('resize', applyScale);
// Der Screensaver liegt im Kasten: waechst dieser (etwa beim Start, sobald die
// erste Ansicht das Raster hochkant verdoppelt), muss auch er seine Aufteilung
// neu waehlen und neu einpassen (svFit kuerzt sonst Termine, die jetzt passen).
function onScreenResize(){
  applyScale();
  faktorNachziehen();   // Split an/aus, Kopfzeile: andere Kachelbreite
  if(saverOn()){ const vorher=el('saver').className; applySaverSplit();
    if(el('saver').className!==vorher){ applyPane(); }
    renderFront(); }
}
if(window.ResizeObserver){ const _s=document.querySelector('.screen'); if(_s) new ResizeObserver(onScreenResize).observe(_s); }
// Pane 2 passt ihren Inhalt an, sobald sich ihre Groesse aendert: Drehen, Split
// an/aus, automatisches Raster, Einblenden nach der Uhr-Seite.
function paneEinpassen(){ const fp=el('frontpane'); if(!fp || fp.hidden) return;
  wetterEinpassen(fp); kalenderEinpassen(fp); werteEinpassen(fp); }
if(window.ResizeObserver){ const _fp=el('frontpane'); if(_fp) new ResizeObserver(paneEinpassen).observe(_fp); }
function applyDisplayCfg(msg){
  DISP.dpmsOff = (typeof msg.dpmsOff==='number' && msg.dpmsOff>0) ? msg.dpmsOff : 0;
  DISP.presence = !!msg.presence;   // jemand im Raum -> Display bleibt an (auch nach Neuladen)
  // Native LoxPanel-Kiosk-App: konfigurierte Display-aus-Zeit an ihren Screensaver
  // geben, bei Anwesenheit 0.
  appLeerlauf();
  // Neu laden: null = nicht eingestellt (nachts um reloadAt Uhr), sonst Stunden, 0 = aus
  DISP.reloadHours = (typeof msg.reloadHours==='number') ? Math.max(0, msg.reloadHours) : null;
  DISP.reloadAt = (typeof msg.reloadAt==='number') ? msg.reloadAt : null;
  DISP.agent = !!msg.agent;
  armDpms();
}
// Neu laden gegen Einfrieren, nur ohne Agent (der startet den Browser selbst
// neu). reloadHours nicht eingestellt: einmal je Nacht, sobald es nach dem
// Laden der Seite reloadAt Uhr geworden ist; eine Zahl: so viele Stunden nach
// dem Laden; 0: nie. Bis die Einstellungen vom Server da sind, gilt 0. Geladen
// wird nur, waehrend die Uhr-Seite steht, nie unter den Fingern; ein Display
// im Schoner bleibt dabei dunkel (die Seite startet mit der Uhr, ohne zu wecken).
const SEITE_GELADEN = Date.now();
function neuladenFaellig(jetzt){
  if(DISP.agent) return false;
  if(DISP.reloadHours===null){
    if(DISP.reloadAt===null) return false;
    const nacht=new Date(SEITE_GELADEN); nacht.setHours(DISP.reloadAt,0,0,0);
    if(nacht.getTime()<=SEITE_GELADEN) nacht.setDate(nacht.getDate()+1);
    return jetzt>=nacht.getTime();
  }
  return DISP.reloadHours>0 && jetzt-SEITE_GELADEN >= DISP.reloadHours*3600*1000;
}
function neuladenPruefen(){ if(saverOn() && neuladenFaellig(Date.now())) location.reload(); }
setInterval(neuladenPruefen, 60*1000);
// Server-Ereignis, das Aufmerksamkeit braucht: Display an, Uhr weg, Timer neu.
function wake(){ screenOn(); nightWake(); hideSaver(); resetIdle(); }
setInterval(tickClock, 1000);
showSaver();     // Startseite = Uhr
resetIdle();

connect();
</script>
