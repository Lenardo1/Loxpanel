<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LoxPanel</title>
<style>
  :root{
    --bg:#0d120e; --screen:#0f1512; --line:rgba(255,255,255,.08);
    --ink:#e7ede7; --muted:#9fb0a4; --glow:#e0a24d; --accent:#52b881;
    --good:#52b881; --crit:#e2695f;
    --tile:rgba(255,255,255,.045);
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --nudge-x:0px;    /* Feinversatz der ganzen Visu; live via ?x=-6 (negativ=links) */
  }
  *{box-sizing:border-box;}
  /* Touch-Panel (Wandpanel/Tablet): keinen Mauszeiger anzeigen — auch nicht die
     pointer-Hand ueber Kacheln. Am Desktop (echte Maus) bleibt der Cursor.
     Zwei Trigger: Media-Query (Touch-Geraet) + .touch-Klasse (erste Beruehrung). */
  @media (hover:none),(pointer:coarse){ *{cursor:none !important;} }
  body.touch *{cursor:none !important;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--font,"Inter","Roboto","Segoe UI Variable Text",-apple-system,"Segoe UI",system-ui,sans-serif);
    display:grid;place-items:center;-webkit-font-smoothing:antialiased;}
  .screen{
    position:relative;
    width:100vw;height:100vh;max-width:calc(var(--cols,2) * 240px);max-height:480px;
    border-radius:16px;overflow:hidden;background:var(--screen);
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.5);
    transform:translateX(var(--nudge-x,0));
    display:grid;grid-template-rows:1fr auto;}
  /* Scrollbarer Kachelbereich: 2 Spalten, exakt 2 Reihen (=4 Kacheln) sichtbar */
  .grid{--gap:10px;grid-area:1/1;
    display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
    grid-auto-rows:calc((100% - var(--gap)) / 2);gap:var(--gap);padding:10px;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  .grid::-webkit-scrollbar{width:5px;}
  .grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px;}
  /* Seiten-Snapping: Kachelraster rastet hart in Vierer-Seiten ein (4 oben/4
     unten, nie dazwischen), lange Listen rasten nur sanft ein. Snap-Punkte
     setzt render() per .snap auf jede 4. Kachel. */
  .grid.snapy{scroll-snap-type:y mandatory;scroll-padding-top:10px;}
  .grid.list.snapy{scroll-snap-type:y proximity;}
  .tile.snap{scroll-snap-align:start;}
  .tile{background:linear-gradient(180deg,var(--tile),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:16px;padding:16px;
    display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;user-select:none;overflow:hidden;
    transition:background .16s,border-color .16s,transform .07s;}
  .tile:active{transform:scale(.97);}
  /* Aktiv-Overlay: Farbe je Zustand (--*-rgb), Aussehen global via --ov-* (pro Kachel ueberschreibbar) */
  .tile.on{background:rgba(var(--on-rgb,224,162,77),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--on-rgb,224,162,77),var(--ov-bord,.55));}
  .tile .head{display:flex;justify-content:space-between;align-items:flex-start;}
  .tile .ico{color:var(--ico,var(--muted));}
  .tile.on .ico{color:var(--ico-fixed,var(--glow));}
  .tile .ico svg{width:var(--ico-size,38px);height:var(--ico-size,38px);}
  .tile .ico .rawico{width:var(--ico-size,38px);height:var(--ico-size,38px);object-fit:contain;display:block;}
  .favs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;}
  .favs.wrap{flex-wrap:wrap;overflow-x:visible;justify-content:flex-start;gap:12px;}
  .phead{font-weight:650;font-size:15px;margin:10px 2px 2px;padding-bottom:6px;border-bottom:1px solid var(--line);text-align:left;}
  /* Wecker: read-only Liste der Weckzeit-Eintraege */
  .alist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;margin:6px auto 0;}
  .arow{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
    display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:3px;align-items:center;}
  .arow .adot{width:10px;height:10px;border-radius:50%;background:var(--accent);grid-row:1;grid-column:1;}
  .arow .anm{grid-row:1;grid-column:2;font-weight:600;font-size:16px;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arow .atime{grid-row:1;grid-column:3;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}
  .arow .arep{grid-row:2;grid-column:2/4;color:var(--muted);font-size:13px;text-align:left;}
  .arow.off{opacity:.5;}
  .arow.off .adot{background:var(--muted);}
  .fav{flex:0 0 auto;width:88px;cursor:pointer;text-align:center;}
  .favc{width:88px;height:88px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted);}
  .favc img{width:100%;height:100%;object-fit:cover;}
  .favc svg{width:34px;height:34px;}
  .favn{font-size:12px;margin-top:5px;line-height:1.15;max-height:2.4em;overflow:hidden;}
  .tile .ico.img{display:inline-block;width:var(--ico-size,38px);height:var(--ico-size,38px);background-color:currentColor;
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .tile .chev{color:var(--muted);opacity:.55;}
  .tile .chev svg{width:20px;height:20px;}
  .tile .room{font-size:var(--room-size,12px);color:var(--muted);font-weight:500;letter-spacing:.02em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;opacity:.85;}
  .tile .name{font-size:var(--name-size,18px);font-weight:var(--name-weight,450);color:var(--name-color,inherit);line-height:1.15;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .sub{font-size:var(--sub-size,15px);color:var(--muted);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;}
  .tile.on .sub{color:var(--glow);}
  .tile.good{background:rgba(var(--good-rgb,82,184,129),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--good-rgb,82,184,129),var(--ov-bord,.55));}
  .tile.good .ico,.tile.good .sub{color:var(--good);}
  .tile.crit{background:rgba(var(--crit-rgb,226,107,95),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--crit-rgb,226,107,95),var(--ov-bord,.55));}
  .tile.crit .ico,.tile.crit .sub{color:var(--crit);}
  .tctrls{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .tctrls .tb{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.10);
    display:grid;place-items:center;color:var(--ink);flex:0 0 auto;}
  .tctrls .tb:active{transform:scale(.92);background:rgba(255,255,255,.18);}
  .tctrls .tb svg{width:17px;height:17px;}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding-top:40px;font-size:15px;}
  /* Listen-Layout (volle Breite): immer exakt 4 Zeilen sichtbar (fuellt die
     Grid-Hoehe, egal wie hoch die Tab-Leiste ist -> kein 3,75-Zeilen-Rest). */
  .grid.list{grid-template-columns:1fr;grid-auto-rows:calc((100% - 3*var(--gap)) / 4);}
  .grid.list .tile{flex-direction:row;align-items:center;gap:14px;padding:0 18px;}
  .grid.list .tile .head{flex:0 0 auto;}
  .grid.list .tile .body{flex:1;min-width:0;}
  .grid.list .tctrls{margin-top:0;}
  /* Detail-Panel (z.B. Jalousie) */
  .grid.panel{display:flex;flex-direction:column;gap:10px;align-items:stretch;grid-auto-rows:initial;}
  .hero{display:grid;place-items:center;padding:6px 0 2px;}
  .hero .circle{width:84px;height:84px;border-radius:50%;background:var(--tile);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);}
  .hero .circle svg{width:38px;height:38px;}
  .hero .circle .himg{width:38px;height:38px;background-color:currentColor;
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .hero .circle .rawico{width:38px;height:38px;object-fit:contain;}
  .status{text-align:center;color:var(--muted);font-size:14px;padding:2px 6px;}
  /* Wecker-Status: moderat gross (nicht so riesig wie .pbig), Raum als Unterzeile */
  .astat{text-align:center;font-size:30px;font-weight:600;line-height:1.18;letter-spacing:-.01em;padding:0 16px;}
  .astat.crit{color:var(--crit);}
  .astat .astatsub{font-size:15px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0;}
  .pbar{background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:15px;text-align:center;font-weight:650;font-size:15px;}
  .pbig{text-align:center;font-size:clamp(56px,15vw,84px);font-weight:600;letter-spacing:-.02em;line-height:1.06;
    padding:8px 8px;word-break:break-word;}
  .pbig.good{color:var(--good);} .pbig.crit{color:var(--crit);}
  .grid.panel.bigpage{justify-content:center;gap:14px;}
  /* anchor:bottom (IRR/Klima): Anzeige oben zentriert, Bedienung unten fixiert.
     Aufklappende Auswahl steht im .panbot VOR den festen Zeilen -> waechst nach oben. */
  .grid.panel.anchorbot{justify-content:flex-start;gap:0;}
  .grid.panel.anchorbot .pantop{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;align-items:stretch;gap:10px;}
  .grid.panel.anchorbot .panbot{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding-top:8px;}
  .brow{display:flex;gap:10px;}
  .btn{flex:1;background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:17px 10px;text-align:center;font-weight:650;font-size:15px;cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:none;
    transition:background .12s,transform .06s;}
  .btn:active{transform:scale(.97);background:rgba(255,255,255,.09);}
  .btn.on{background:linear-gradient(180deg,rgba(224,162,77,.22),rgba(224,162,77,.05));
    border-color:rgba(224,162,77,.55);color:var(--glow);}
  /* Aufklappbare Auswahl (z.B. Klima Modus/Fan): Zeile per Toggle ein/aus */
  .brow.collapsed{display:none;}
  .brow.wraprow{flex-wrap:wrap;}
  .brow.wraprow .btn{flex:1 1 28%;min-width:82px;}
  .btn.toggler::after{content:'▾';margin-left:7px;opacity:.55;font-size:.82em;vertical-align:middle;}
  /* Auswahl-Popup (Klima Modus/Fan) */
  .menuov{position:absolute;inset:0;z-index:25;}
  .menubox{position:absolute;background:var(--screen);border:1px solid var(--line);
    border-radius:12px;padding:4px;min-width:150px;max-height:82%;overflow-y:auto;
    box-shadow:0 14px 44px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:1px;}
  .menuitem{padding:7px 16px;border-radius:7px;font-size:15px;line-height:1.15;white-space:nowrap;
    cursor:pointer;user-select:none;-webkit-user-select:none;color:var(--ink);}
  .menuitem:active{background:rgba(255,255,255,.13);}
  .menuitem.on{color:var(--glow);background:rgba(224,162,77,.15);}
  /* Musik-Player */
  .cover{position:relative;display:grid;place-items:center;padding:4px 0 2px;}
  .cover .coverph,.cover img{width:60%;max-width:210px;aspect-ratio:1/1;border-radius:12px;}
  .cover .coverph{position:absolute;background:var(--tile);display:grid;place-items:center;color:var(--muted);}
  .cover .coverph svg{width:44px;height:44px;}
  .cover img{position:relative;object-fit:cover;opacity:0;transition:opacity .2s;
    box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .video{width:100%;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;
    display:grid;place-items:center;}
  .video img{width:100%;height:100%;object-fit:contain;}
  .ptitle{text-align:center;font-size:19px;font-weight:550;padding:0 8px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ptitle .psub{font-size:15px;font-weight:400;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brow.transport{justify-content:center;align-items:center;gap:18px;}
  .btn.icon{flex:0 0 auto;width:58px;height:58px;display:grid;place-items:center;padding:0;
    border-radius:50%;color:var(--ink);}
  .btn.icon svg{width:24px;height:24px;}
  .btn.icon.big{width:70px;height:70px;background:var(--glow);border-color:transparent;color:#181008;}
  .btn.icon.big svg{width:30px;height:30px;}
  .srow{display:flex;align-items:center;gap:10px;padding:4px 4px;}
  .srow .sico{color:var(--muted);display:grid;place-items:center;}
  .srow .sico svg{width:20px;height:20px;}
  .srow .sval{font-family:var(--mono);font-size:12px;color:var(--muted);width:28px;text-align:right;}
  .sld{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
    background:rgba(255,255,255,.15);outline:none;}
  .sld::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--glow);cursor:pointer;}
  .sld::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;
    background:var(--glow);cursor:pointer;}
  /* Schwebender Zurück-Pfeil (nur beim Reinnavigieren) */
  .tabback{flex:0 0 auto;align-self:center;width:50px;height:50px;margin:0 14px;
    display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:32px;line-height:1;
    color:var(--muted);border:2px solid var(--line);background:rgba(255,255,255,.04);
    transition:color .15s,border-color .15s,background .15s;}
  .tabback.on{color:#fff;border-color:var(--accent);background:rgba(82,184,129,.14);}
  .tabback:active{transform:scale(.94);}
  .back:active{background:rgba(0,0,0,.65);}
  /* Tabs */
  .tabs{display:flex;border-top:1px solid var(--line);background:rgba(0,0,0,.25);}
  .tab{flex:1;display:grid;place-items:center;padding:13px 0;color:var(--muted);cursor:pointer;}
  .tab svg{width:28px;height:28px;}
  .tab .tico{display:inline-block;width:28px;height:28px;background-color:currentColor;
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .tab.active{color:var(--accent);}
  .tab:active{transform:scale(.92);}
  /* Online-Punkt: nur auf den Haupt-Screens (Tabs), zentriert im 2x2-Raster */
  .conn{grid-row:1;grid-column:1;place-self:center;z-index:6;pointer-events:none;
    width:8px;height:8px;border-radius:50%;background:#c14338;display:none;}
  .conn.ok{background:var(--accent);}
  .conn.vis{display:block;}
  .saver{position:absolute;inset:0;z-index:30;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-user-select:none;}
  .saver.hidden{display:none;}
  .saver .sv-time{font-size:78px;font-weight:300;line-height:1;letter-spacing:1px;
    font-variant-numeric:tabular-nums;color:var(--ink);}
  .saver .sv-date{font-size:20px;color:var(--muted);margin-top:8px;text-transform:capitalize;}
  .saver .sv-hint{margin-top:22px;font-size:13px;color:var(--muted);opacity:.5;}
  /* Anti-Einbrennen: Uhr driftet langsam ueber den Schirm */
  .saver .sv-wrap{display:flex;flex-direction:column;align-items:center;
    animation:svdrift 90s linear infinite;}
  @keyframes svdrift{
    0%{transform:translate(-30px,-20px);}   25%{transform:translate(30px,-20px);}
    50%{transform:translate(30px,20px);}     75%{transform:translate(-30px,20px);}
    100%{transform:translate(-30px,-20px);}
  }
  .moreb{position:absolute;top:6px;right:8px;z-index:6;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;
    background:rgba(255,255,255,.06);}
  .moreb:active{transform:scale(.92);}
  .pinov{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;place-items:center;}
  .pinbox{background:var(--screen);border:1px solid var(--line);border-radius:16px;padding:20px;width:78%;max-width:300px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;}
  .pinttl{font-weight:600;font-size:16px;text-align:center;}
  .pinin{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    padding:12px;font-size:22px;text-align:center;letter-spacing:.3em;outline:none;}
  .pinin:focus{border-color:var(--glow);}
  .pinmsg{color:var(--crit);font-size:13px;text-align:center;min-height:16px;}
  .pinrow{display:flex;gap:10px;}
  .pinbtn{flex:1;text-align:center;padding:12px;border-radius:10px;cursor:pointer;user-select:none;font-weight:600;border:1px solid var(--line);}
  .pinbtn.ok{background:var(--glow);color:#181008;border-color:transparent;}
  .pinbtn:active{transform:scale(.97);}
  .pindisp{font-size:26px;text-align:center;letter-spacing:.35em;min-height:38px;padding:8px 6px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pinkey{padding:15px 0;text-align:center;font-size:22px;border:1px solid var(--line);border-radius:12px;
    cursor:pointer;user-select:none;background:var(--tile);}
  .pinkey:active{background:rgba(255,255,255,.14);transform:scale(.97);}
  .pinkey.ok{background:var(--glow);color:#181008;border-color:transparent;font-weight:700;}
  .pinkey.del{font-size:20px;}
</style>
</head>
<body>
<div class="screen">
  <div class="conn" id="conn"></div>
  <div class="grid" id="grid"></div>
  <div class="tabs" id="tabs"></div>
  <div class="saver hidden" id="saver">
    <div class="sv-wrap">
      <div class="sv-time" id="svTime">--:--</div>
      <div class="sv-date" id="svDate"></div>
      <div class="sv-hint">Zum Öffnen tippen</div>
    </div>
  </div>
</div>

<script>
const ICONS = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bulb:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.4 1 2.5h6c0-1.1.3-1.7 1-2.5A6 6 0 0 0 12 3Z"/>',
  switch:'<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="8" cy="12" r="2.5"/>',
  mood:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  central:'<path d="M3 11 12 4l9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  blind:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h16M4 13h16M4 17h16"/>',
  up:'<path d="m6 15 6-6 6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 0 1 0 8"/>',
  prev:'<path d="M6 6h2v12H6zM20 6v12l-9-6z"/>',
  next:'<path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  pause:'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
  alarm:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  gate:'<path d="M3 10 12 4l9 6v11H3z"/><path d="M6 21v-7h12v7"/><path d="M6 17.5h12"/>',
  thermo:'<path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z"/>',

// ---- Weckton (Loxone-Wecker klingelt) ----
// Synthetischer Piep-Loop per Web Audio API: kein Audio-Asset noetig, laeuft bis
// der Server das Ende meldet ({t:'alarm',on:false}, nach 'dismiss' in Loxone/App
// oder ueber den "Wecker aus"-Button am Panel). Der Kiosk startet Chromium mit
// --autoplay-policy=no-user-gesture-required, darum spielt der Ton ohne vorherige
// Nutzergeste. Zusaetzlich ein Failsafe, der nach 5 Min stoppt, falls das
// Aus-Event mal ausbleibt (sonst piepte das Panel endlos).
let _actx=null, _alarmTimer=null, _alarmFailsafe=null;
function startAlarmTone(){
  if(_alarmTimer) return;               // laeuft schon
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    const beep=()=>{
      const t=_actx.currentTime, o=_actx.createOscillator(), g=_actx.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.connect(g); g.connect(_actx.destination);
      o.start(t); o.stop(t+0.45);
    };
    beep();
    _alarmTimer=setInterval(beep,700);
    clearTimeout(_alarmFailsafe);
    _alarmFailsafe=setTimeout(stopAlarmTone,5*60*1000);
  }catch(e){}
}
function stopAlarmTone(){
  if(_alarmTimer){ clearInterval(_alarmTimer); _alarmTimer=null; }
  clearTimeout(_alarmFailsafe); _alarmFailsafe=null;
}
// Sichtbarer Hinweis oben am Panel — bestaetigt, dass ein Test-Ton-Event
// tatsaechlich ankam, und meldet den AudioContext-Status. So laesst sich
// "Push kommt nicht an" von "Audio-Ausgabe stumm" trennen.
function flashAudioBadge(txt, ok){
  let b=document.getElementById('audiobadge');
  if(!b){
    b=document.createElement('div'); b.id='audiobadge';
    b.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;'+
      'padding:13px 20px;border-radius:12px;font:600 15px system-ui,sans-serif;color:#fff;'+
      'box-shadow:0 8px 28px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;';
    document.body.appendChild(b);
  }
  b.textContent=txt;
  b.style.background = ok ? 'rgba(82,184,129,.96)' : 'rgba(226,107,95,.96)';
  b.style.opacity='1';
  clearTimeout(b._t); b._t=setTimeout(()=>{ b.style.opacity='0'; }, 3500);
}
// Kurzer Test-Ton (3 Pieptoene) von der Einstellungen-Seite ausgeloest. Eigener
// AudioContext (stoert einen evtl. laufenden echten Weckton nicht). resume()
// wird abgewartet, damit der Ton auch bei anfangs suspendiertem Context spielt;
// der Badge meldet, ob der Context wirklich laeuft.
function playTestTone(){
  let actx;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ flashAudioBadge('🔊 Test-Ton empfangen — Web Audio nicht verfügbar', false); return; }
  const boom=()=>{
    try{
      let t=actx.currentTime;
      for(let i=0;i<3;i++){
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.4); t+=0.5;
      }
    }catch(e){}
    const running = actx.state==='running';
    flashAudioBadge(running ? '🔊 Test-Ton — Audio läuft' : '🔊 empfangen, Audio blockiert ('+actx.state+')', running);
    setTimeout(()=>{ try{ actx.close(); }catch(e){} }, 2200);
  };
  if(actx.state==='suspended'){ actx.resume().then(boom, boom); }
  else boom();
}

let pendingSecure=null;
function askPin(cb,msg){
  const s=document.querySelector('.screen'); let ov=s.querySelector('.pinov'); if(ov)ov.remove();
  ov=document.createElement('div'); ov.className='pinov';
  let val='';
  const keys=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  ov.innerHTML='<div class="pinbox"><div class="pinttl">PIN / Passwort</div>'+
    '<div class="pindisp" id="pindisp"></div>'+
    '<div class="pinmsg">'+(msg||'')+'</div>'+
    '<div class="pinpad">'+keys.map(k=>{
      const cls='pinkey'+(k==='ok'?' ok':'')+(k==='del'?' del':'');
      const lbl=k==='del'?'⌫':(k==='ok'?'OK':k);
      return '<div class="'+cls+'" data-k="'+k+'">'+lbl+'</div>';
    }).join('')+'</div>'+
    '<div class="pinbtn cancel">Abbrechen</div></div>';
  s.appendChild(ov);
  const disp=ov.querySelector('#pindisp');
  const draw=()=>{ disp.textContent='•'.repeat(val.length); };
  const done=v=>{ ov.remove(); cb(v); };
  ov.querySelectorAll('.pinkey').forEach(b=>{ b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='ok') done(val);
    else if(k==='del'){ val=val.slice(0,-1); draw(); }
    else if(val.length<12){ val+=k; draw(); }
  };});
  ov.querySelector('.cancel').onclick=()=>done(null);
}
function doSecure(uuid,cmd,msg){
  askPin(pin=>{ if(pin==null){pendingSecure=null;return;} pendingSecure={uuid,cmd}; send({t:'cmd',uuid,cmd,pin}); }, msg);
}
function sendCmd(uuid,cmd,secured){ if(secured) doSecure(uuid,cmd,''); else send({t:'cmd',uuid,cmd}); }

function updatePanel(blocks){

  const cov=blocks.find(b=>b.k==='cover'); if(cov){const img=g.querySelector('#coverimg'); if(img&&img.getAttribute('src')!==cov.src){img.style.opacity='0'; img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=cov.src;}}

  const mid = Math.floor(items.length/2);

    if(ts.weight) nsv.push('font-weight:'+ts.weight);
    if(ts.italic) nsv.push('font-style:italic');
    const nst = nsv.length?' style="'+esc(nsv.join(';'))+'"':'';
    const _pg = (view.layout==='list'?4:gridCols*2);   // Snap-Seite: Liste 4 Zeilen, sonst cols x 2
    html += '<div class="tile'+tone+(_i%_pg===0?' snap':'')+'" data-id="'+esc(it.id)+'"'+st+'>'+
              '<div class="head">'+icoHtml+chev+'</div>'+
              '<div class="body">'+
              (it.room?'<div class="room">'+esc(it.room)+'</div>':'')+
              '<div class="name"'+nst+'>'+esc(it.label)+'</div>'+
              (it.sublabel?'<div class="sub">'+esc(it.sublabel)+'</div>':'')+'</div>'+
              ctrls+
            '</div>';
  }
  g.innerHTML = html;
  g.classList.toggle('snapy', items.length > (view.layout==='list'?4:gridCols*2));   // Snapping erst ab >1 Seite
  g.querySelectorAll('.tile[data-id]').forEach(n=>{
    const it = items.find(x=>String(x.id)===n.dataset.id);
    if(it.controls){
      n.querySelectorAll('.tctrls .tb').forEach(b=>{
        const c = it.controls[+b.dataset.c];
        b.addEventListener('pointerdown', ev=>{ ev.preventDefault();
          if(c.cmd) sendCmd(c.cmd.uuid,c.cmd.cmd,it.secured); });
      });
    }
    n.onclick=(e)=>{ if(e.target.closest('.tctrls')) return;
      if(it.nav) nav(it.nav); else if(it.cmd) sendCmd(it.cmd.uuid,it.cmd.cmd,(view&&view.secured)||it.secured); };
  });
  renderTabs();
}

// Wisch nach rechts = zurueck (vertikales Scrollen bleibt unberuehrt)
let sx=null, sy=null;
const g=el('grid');
g.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
g.addEventListener('touchend',e=>{
  if(sx==null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(dx>60 && Math.abs(dy)<45) back();
});

let booted=false;
const PANEL_ID = new URLSearchParams(location.search).get('panel') || '';
// Horizontaler Feinversatz der ganzen Visu — live einstellbar ohne Redeploy:
//   ?x=-6  -> 6px nach links     ?x=8 -> nach rechts     ?x=0 -> zuruecksetzen
// Der Wert wird gemerkt (localStorage) und gilt dann auch ohne Parameter weiter.
(function(){
  const p=new URLSearchParams(location.search).get('x');
  if(p!==null) localStorage.setItem('lp_nudge_x', p);
  const v=localStorage.getItem('lp_nudge_x');
  if(v!==null && v!=='') document.documentElement.style.setProperty('--nudge-x',(parseFloat(v)||0)+'px');
})();
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'
                   +(PANEL_ID?('?panel='+encodeURIComponent(PANEL_ID)):''));
  // Erststart: Startseite kommt vom Server (erster Tab des Profils). Nach einem
  // Reconnect stattdessen die zuletzt betrachtete Seite wiederherstellen.
  ws.onopen=()=>{ el('conn').classList.add('ok'); if(booted) send({t:'nav',route:stack[stack.length-1]}); };
  ws.onclose=()=>{ el('conn').classList.remove('ok'); setTimeout(connect,1500); };
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.t==='theme'){ const v=msg.vars||{}; for(const k in v){ if(v[k]) document.documentElement.style.setProperty(k,v[k]); }
      gridCols = (v['--cols']?(parseInt(v['--cols'])||2):2);
      if(msg.title) document.title=msg.title;
      if(msg.tabMeta) tabMeta=msg.tabMeta;
      if(Array.isArray(msg.tabs)&&msg.tabs.length) tabsCfg=msg.tabs; renderTabs(); return; }
    if(msg.t==='ring'){ if(msg.id) nav({view:'control',id:msg.id}); return; }
    if(msg.t==='alarm'){ if(msg.on){ startAlarmTone(); if(msg.id) nav({view:'control',id:msg.id}); } else { stopAlarmTone(); } return; }
    if(msg.t==='testtone'){ playTestTone(); return; }
    if(msg.t==='cmdresult'){ if(msg.ok===false && pendingSecure){ const p=pendingSecure; pendingSecure=null; doSecure(p.uuid,p.cmd,'PIN falsch – nochmal'); } else pendingSecure=null; return; }
    if(msg.t!=='view') return;
    if(!booted){ booted=true; if(msg.route&&msg.route.view==='tab') stack=[msg.route]; }
    const same = view && key(view.route)===key(msg.route);
    if(msg.blocks){
      view=msg;
      if(same && el('grid').classList.contains('panel')) updatePanel(msg.blocks);
      else renderPanel(msg.blocks);
    } else {
      const st=same?g.scrollTop:0;
      view=msg; render(); g.scrollTop=st;   // Scrollposition bei Live-Update halten
    }
  };
}
// ---- Screensaver: Uhr als Startseite, Tippen -> Favoriten ----
const SAVER_IDLE_MS = 60000;   // nach 60 s Inaktivitaet zurueck zur Uhr
let idleTimer=null;
function tickClock(){
  const d=new Date();
  const t=el('svTime'), dd=el('svDate');
  if(t) t.textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  if(dd) dd.textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function saverOn(){ return !el('saver').classList.contains('hidden'); }
function showSaver(){ tickClock(); el('saver').classList.remove('hidden'); }
function hideSaver(){ el('saver').classList.add('hidden'); }
function resetIdle(){ clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ goTab(tabsCfg[0]||'favoriten'); showSaver(); }, SAVER_IDLE_MS); }
el('saver').addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); hideSaver(); resetIdle(); });
['pointerdown','keydown','wheel'].forEach(ev=>document.addEventListener(ev, ()=>{ if(!saverOn()) resetIdle(); }, {passive:true}));
setInterval(tickClock, 1000);
showSaver();     // Startseite = Uhr
resetIdle();

connect();
</script>
