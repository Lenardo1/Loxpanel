<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LoxPanel</title>
<style>
  :root{
    --bg:#0d120e; --screen:#0f1512; --line:rgba(var(--wash,255,255,255),.08);
    --ink:#e7ede7; --muted:#9fb0a4; --glow:#e0a24d; --accent:#52b881;
    --good:#52b881; --crit:#e2695f;
    --tile:rgba(var(--wash,255,255,255),.045);
    /* Deckfarbe der Auflagen: Weiss hebt auf dunklem Grund ab, Schwarz auf
       hellem. Ein helles Theme schickt "0,0,0" und dreht damit saemtliche
       Auflagen auf einen Schlag um. */
    --wash:255,255,255;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --nudge-x:0px;    /* Feinversatz der ganzen Visu; live via ?x=-6 (negativ=links) */
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}   /* el.hidden zuverlaessig, trotz eigener display-Regeln */
  /* Touch-Panel (Wandpanel/Tablet): keinen Mauszeiger anzeigen — auch nicht die
     pointer-Hand ueber Kacheln. Am Desktop (echte Maus) bleibt der Cursor.
     Zwei Trigger: Media-Query (Touch-Geraet) + .touch-Klasse (erste Beruehrung). */
  @media (hover:none),(pointer:coarse){ *{cursor:none !important;} }
  body.touch *{cursor:none !important;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--font,"Inter","Roboto","Segoe UI Variable Text",-apple-system,"Segoe UI",system-ui,sans-serif);
    display:grid;place-items:center;-webkit-font-smoothing:antialiased;}
  .screen{
    position:relative;
    width:100vw;height:100vh;
    max-width:calc(var(--cols,2) * 240px);max-height:calc(var(--rows,2) * 240px);
    border-radius:0;overflow:hidden;background:var(--screen);
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.5);
    transform:translateX(var(--nudge-x,0));
    display:grid;grid-template-rows:minmax(0,1fr) auto;}
  /* "Bildschirm fuellen": ganzen Tablet-Schirm nutzen (Voll-Zoom). Die Kacheln
     passen sich der Geraeteform an (koennen leicht rechteckig werden) statt als
     zentrierter cols:rows-Kasten mit Rand zu stehen. Gilt auch fuer Vollbreit. */
  .screen.fill{max-width:none;max-height:none;width:100vw;height:100vh;}
  /* Split-Layout (grosse Tablets): EIN Panel = links navigierbare Visu, rechts
     fester Player, unten EINE gemeinsame Tab-Leiste ueber die volle Breite. */
  /* Denke in einem 4x2-Raster: links 2x2 = Visu, rechts 2x2 = Player. Der Block
     hat Seitenverhaeltnis 4:2 (=2:1) und wird zentriert eingepasst (quadratische
     Kacheln, kein Strecken ueber den ganzen Schirm). */
  /* Split (fill AUS): feste Kachelgroesse wie die uebrigen Tabs -> gleiche Hoehe.
     2 Panes nebeneinander = 2x Visu-Breite, deshalb --cols*480; Hoehe --rows*240
     (identisch zur nicht-geteilten .screen -> kein Hoehensprung beim Tab-Wechsel). */
  .screen.split{max-width:none;max-height:none;
    width:min(100vw, calc(var(--cols,2) * 480px));height:min(100vh, calc(var(--rows,2) * 240px));
    grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;}
  /* "Bildschirm fuellen" im Split: ganzen Tablet-Schirm nutzen (Kacheln passen
     sich an, statt zentriertem 2:1-Kasten mit Rand). */
  .screen.split.fill{width:100vw;height:100vh;}
  #playerpane{display:none;}
  #frontpane{display:none;}
  .screen.split #grid{grid-column:1;grid-row:1;}
  .screen.split #playerpane{display:flex;flex-direction:column;grid-column:2;grid-row:1;
    min-height:0;border-left:1px solid var(--line);overflow:hidden;padding:10px;gap:10px;}
  /* Split-Pane Wetter/Kalender/Energie: rechte Spalte, auf Pane-Hoehe begrenzt
     (min-height:0 + minmax(0,1fr)-Zeile) -> Inhalt scrollt INNEN statt ueber den
     Kachelrahmen hinauszulaufen. Seiten-Snapping wie beim Kachel-Grid:
     jede .fp-page fuellt genau die Pane-Hoehe, Scrollen rastet seitenweise ein. */
  .screen.split #frontpane{display:flex;flex-direction:column;grid-column:2;grid-row:1;
    min-height:0;border-left:1px solid var(--line);overflow-y:auto;padding:10px;gap:10px;
    scroll-snap-type:y mandatory;scroll-padding-top:10px;}
  /* Jede Seite = ein gerahmter 480x480-Block wie der 2x2-Kachelblock links:
     min-height:100% fuellt die Pane-Hoehe, gleiche Rahmung/Innenabstand wie eine
     Kachel -> Inhalt startet auf gleicher Hoehe (nicht mehr "zu hoch"). */
  .screen.split #frontpane .fp-page,
  .screen.split #playerpane .fp-page{flex:0 0 auto;min-height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;gap:10px;padding:16px;
    background:linear-gradient(180deg,var(--tile),rgba(255,255,255,.015));
    border:var(--tile-bw,1px) solid var(--tile-bord,var(--line));border-radius:16px;
    scroll-snap-align:start;scroll-snap-stop:always;}
  /* Einzel-Seite (Energie/Kamera/Audio): genau EINE Pane hoch (480x480), fuellt sie
     exakt statt content-getrieben zu wachsen. Der Inhalt (quadratisches Radial-SVG,
     4:3-Video, Cover) skaliert per object-fit/preserveAspectRatio hinein - sonst
     erzwingt z.B. das 480x480-SVG seine Breite als Hoehe -> Pane ~550 statt 480.
     Wetter/Kalender bleiben mehrseitig (Snap) und duerfen scrollen. */
  .screen.split #frontpane .fp-page.solo,
  .screen.split #playerpane .fp-page.solo{flex:1 1 0;min-height:0;max-height:100%;overflow:hidden;}
  /* Kamera-Pane: MJPEG-Live-Bild fuellt die rechte Spalte (kein Padding/Scroll). */
  /* Kamera-Pane: volle Intercom-Ansicht (Klingel-Banner + Video + Tür-/Ausgang-Buttons). */
  #frontpane.cam{justify-content:flex-start;}
  #frontpane .cambell{margin:0;}
  #frontpane .camwait{display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--muted);padding:24px 0;}
  #frontpane .camwait svg{width:56px;height:56px;opacity:.5;}
  /* Energiefluss-Pane (Radial, Loxone-Standard). Erzeugung=Akzent, Verbrauch=Glow. */
  .epane{flex:1;display:flex;flex-direction:column;min-height:0;}
  .epane .etop{display:flex;justify-content:center;padding:2px 0 2px;}
  .epane .ettl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .epane .ewrap{flex:1;min-height:0;}
  .epane .ewrap svg{width:100%;height:100%;display:block;}
  .epane .ebot{text-align:center;color:var(--muted);font-size:12px;padding-top:2px;}
  .epane .ebot b{color:var(--ink);font-weight:600;}
  .epane .spoke{stroke:var(--line);stroke-width:2;}
  .epane .ehub{fill:var(--screen);stroke:var(--line);stroke-width:1.5;}
  .epane .ering{fill:var(--screen);stroke-width:3;}
  .epane .ering.prod{stroke:var(--accent);} .epane .ering.cons{stroke:var(--glow);} .epane .ering.grid{stroke:var(--crit);}
  .epane .ering.idle{stroke:var(--muted);opacity:.55;}
  .epane .eic{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .epane .eic.prod{stroke:var(--accent);} .epane .eic.cons{stroke:var(--glow);} .epane .eic.grid{stroke:var(--crit);} .epane .eic.idle{stroke:var(--muted);}
  /* echtes Loxone-Icon: monochrome SVG-Maske, in Rollenfarbe eingefaerbt */
  .epane .emask{width:100%;height:100%;background:currentColor;}
  .epane .emask.prod{color:var(--accent);} .epane .emask.cons{color:var(--glow);} .epane .emask.grid{color:var(--crit);} .epane .emask.idle{color:var(--muted);}
  .epane .enval{fill:var(--ink);font-size:16px;font-weight:600;text-anchor:middle;}
  .epane .enval.idle{fill:var(--muted);}
  .epane .enlab{fill:var(--muted);font-size:12px;text-anchor:middle;}
  .epane .edot{opacity:0;}
  .epane .edot.prod{fill:var(--accent);} .epane .edot.cons{fill:var(--glow);} .epane .edot.grid{fill:var(--crit);}
  /* Fluss-Punkte laufen dauerhaft (Bewegung = Flussrichtung, also Info, kein
     Deko-Effekt). Farbe = Rolle (prod/cons/grid), Richtung = Fluss (fin/fout) –
     entkoppelt: z.B. Einspeisung ist gruen UND laeuft nach aussen (fout). Die Pane
     wird nur bei Strukturaenderung neu gezeichnet, sonst laufen die Punkte
     ununterbrochen weiter (siehe paintEnergy/updateEnergyPane). */
  .epane .edot{animation:2.6s linear infinite;}
  .epane .edot.fin{animation-name:eflowin;} .epane .edot.fout{animation-name:eflowout;}
  .epane .edot.idle{animation:none;opacity:0;}
  /* Radial in der Detailansicht (Antippen der Energie-Kachel; auch 4"-Panel ohne Split) */
  .epane-detail{width:min(100%,440px);margin:6px auto 0;}
  .epane-detail .epane{height:clamp(280px,58vh,460px);}
  @keyframes eflowout{0%{transform:translate(0,0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
  @keyframes eflowin{0%{transform:translate(var(--dx),var(--dy));opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(0,0);opacity:0}}
  .screen.split #tabs{grid-column:1 / -1;grid-row:2;}   /* Tab-Leiste ueber volle Breite */
  .screen.split .conn{grid-column:1;grid-row:1;place-self:start start;margin:6px;}
  /* Player-Pane Innenaufbau (Cover gross oben, Titel, Transport, Lautstaerke) */
  /* Cover = zentriertes QUADRAT, passt in die verfuegbare Flaeche (Breite ODER
     Hoehe, je nachdem was kleiner ist) -> kein Abschneiden bei flachem Tablet. */
  #playerpane .ppcover{flex:1;min-height:0;display:grid;place-items:center;color:var(--muted);}
  #playerpane .ppcover>*{grid-area:1/1;}   /* Note-Platzhalter + Cover uebereinander */
  /* Cover als zentriertes Quadrat, das in die Flaeche passt, ABER nach oben
     begrenzt ist: sonst fuellt z.B. ein Senderlogo die halbe Seite. */
  #playerpane .ppcover img{max-width:min(100%,300px);max-height:min(100%,300px);
    aspect-ratio:1;object-fit:cover;
    border-radius:14px;opacity:0;transition:opacity .2s;}
  #playerpane .ppcover .coverph{width:96px;height:96px;display:grid;place-items:center;
    background:rgba(var(--wash,255,255,255),.06);border-radius:14px;}
  #playerpane .ppcover .coverph svg{width:56px;height:56px;}
  #playerpane .pptitle{font-size:18px;font-weight:600;text-align:center;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #playerpane .ppsub{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #playerpane .pptrans{display:flex;gap:14px;justify-content:center;align-items:center;}
  #playerpane .ppvol{display:flex;align-items:center;gap:8px;}
  #playerpane .ppvol .sico{color:var(--muted);} #playerpane .ppvol .sico svg{width:20px;height:20px;}
  #playerpane .ppvol .sld{flex:1;}
  #playerpane .ppvol .sval{min-width:34px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
  /* Scrollbarer Kachelbereich: var(--cols) Spalten x var(--rows) Reihen sichtbar */
  .grid{--gap:10px;grid-area:1/1;
    display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
    grid-auto-rows:calc((100% - (var(--rows,2) - 1) * var(--gap)) / var(--rows,2));gap:var(--gap);padding:10px;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
  /* Schlanke Scrollleiste im Theme fuer JEDEN scrollenden Bereich. Ohne das
     zeichnet der Browser in der Split-Pane seine Standardleiste (16 px, grau)
     direkt neben das 5-px-Band des Kachelrasters - und nimmt der Pane die
     Breite weg. Die Pane scrollt seit dem Seiten-Snapping immer, weil Wetter
     und Kalender zwei Seiten hoch sind. */
  .grid,#frontpane,.frontpage,.menubox{
    scrollbar-width:thin;scrollbar-color:rgba(var(--wash,255,255,255),.18) transparent;}
  .grid::-webkit-scrollbar,#frontpane::-webkit-scrollbar,
  .frontpage::-webkit-scrollbar,.menubox::-webkit-scrollbar{width:5px;}
  .grid::-webkit-scrollbar-thumb,#frontpane::-webkit-scrollbar-thumb,
  .frontpage::-webkit-scrollbar-thumb,.menubox::-webkit-scrollbar-thumb{
    background:rgba(var(--wash,255,255,255),.18);border-radius:3px;}
  /* Seiten-Snapping: Kachelraster rastet hart in Vierer-Seiten ein (4 oben/4
     unten, nie dazwischen), lange Listen rasten nur sanft ein. Snap-Punkte
     setzt render() per .snap auf jede 4. Kachel. */
  .grid.snapy{scroll-snap-type:y mandatory;scroll-padding-top:10px;}
  .grid.list.snapy{scroll-snap-type:y proximity;}
  .tile.snap{scroll-snap-align:start;}
  .tile{background:linear-gradient(180deg,var(--tile),rgba(var(--wash,255,255,255),.015));
    border:var(--tile-bw,1px) solid var(--tile-bord,var(--line));border-radius:16px;padding:16px;
    display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;user-select:none;overflow:hidden;
    transition:background .16s,border-color .16s,transform .07s;}
  .tile:active{transform:scale(.97);}
  /* Aktiv-Overlay: Farbe je Zustand (--*-rgb), Aussehen global via --ov-* (pro Kachel ueberschreibbar) */
  .tile.on{background:rgba(var(--on-rgb,224,162,77),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--on-rgb,224,162,77),var(--ov-bord,.55));}
  .tile .head{display:flex;justify-content:space-between;align-items:flex-start;}
  .tile .ico,.tile .icowrap{color:var(--ico,var(--muted));}
  .tile.on .ico,.tile.on .icowrap{color:var(--ico-fixed,var(--glow));}
  .tile .ico svg{width:var(--ico-size,38px);height:var(--ico-size,38px);}
  .tile .ico .rawico{width:var(--ico-size,38px);height:var(--ico-size,38px);object-fit:contain;display:block;}
  /* Positionsring: Stellung von Rollladen, Tor, Fenster und Dimmer als Bogen
     um das Icon. Der Server schickt "pos" nur fuer diese Bausteine; ohne den
     Wert entsteht gar kein Element und die Kachel sieht aus wie immer.
     Fester viewBox 0..100, Groesse ueber --ico-size - der Ring waechst also
     mit, wenn die Icon-Groesse verstellt wird. Farbe ueber currentColor, damit
     er dem Zustand UND dem Theme folgt, ohne eigene Farbregel. */
  .tile .icowrap{position:relative;display:inline-grid;place-items:center;}
  .tile .posring{position:absolute;left:50%;top:50%;pointer-events:none;
    width:calc(var(--ico-size,38px) + 18px);height:calc(var(--ico-size,38px) + 18px);
    transform:translate(-50%,-50%);}
  .tile .posring circle{fill:none;stroke:currentColor;stroke-width:var(--posring-w,6);}
  .tile .posring .trk{opacity:var(--posring-trk,.18);}
  /* Der Uebergang laesst den Bogen der Fahrt FOLGEN statt in 1-%-Stufen zu
     springen - keine Dauer-Animation: im Stand steht er absolut still. */
  .tile .posring .val{stroke-linecap:round;opacity:var(--posring-op,1);
    transition:stroke-dasharray .4s linear;}
  @media (prefers-reduced-motion:reduce){ .tile .posring .val{transition:none;} }
  .favs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;}
  .favs.wrap{flex-wrap:wrap;overflow-x:visible;justify-content:flex-start;gap:12px;}
  .phead{font-weight:650;font-size:15px;margin:10px 2px 2px;padding-bottom:6px;border-bottom:1px solid var(--line);text-align:left;}
  /* Wecker: read-only Liste der Weckzeit-Eintraege */
  .alist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;margin:6px auto 0;}
  .arow{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
    display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:3px;align-items:center;}
  .arow .adot{width:10px;height:10px;border-radius:50%;background:var(--accent);grid-row:1;grid-column:1;}
  .arow .anm{grid-row:1;grid-column:2;font-weight:600;font-size:16px;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arow .atime{grid-row:1;grid-column:3;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}
  .arow .arep{grid-row:2;grid-column:2/4;color:var(--muted);font-size:13px;text-align:left;}
  .arow.off{opacity:.5;}
  .arow.off .adot{background:var(--muted);}
  .fav{flex:0 0 auto;width:88px;cursor:pointer;text-align:center;}
  .favc{width:88px;height:88px;border-radius:12px;overflow:hidden;background:rgba(var(--wash,255,255,255),.06);display:grid;place-items:center;color:var(--muted);}
  .favc img{width:100%;height:100%;object-fit:cover;}
  .favc svg{width:34px;height:34px;}
  .favn{font-size:12px;margin-top:5px;line-height:1.15;max-height:2.4em;overflow:hidden;}
  /* Maskiertes Kachel-Icon: Fuellfarbe DIREKT aus der Icon-/Theme-Variable statt
     ueber currentColor. Sonst bricht die eingeschraenkte Panel-WebView, sobald
     eine eigene Icon-Farbe (--ico inline) gesetzt ist -> Icon bleibt leer.
     Die Zustaende spiegeln die Farbregeln von .tile .ico (on/good/crit). */
  .tile .ico.img{display:inline-block;width:var(--ico-size,38px);height:var(--ico-size,38px);background-color:var(--ico,var(--muted));
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .tile.on .ico.img{background-color:var(--ico-fixed,var(--glow));}
  .tile.good .ico.img{background-color:var(--good);}
  .tile.crit .ico.img{background-color:var(--crit-ink,var(--crit));}
  .tile .chev{color:var(--muted);opacity:.55;}
  .tile .chev svg{width:20px;height:20px;}
  .tile .room{font-size:var(--room-size,12px);color:var(--muted);font-weight:500;letter-spacing:.02em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;opacity:.85;}
  .tile .name{font-size:var(--name-size,18px);font-weight:var(--name-weight,450);color:var(--name-color,inherit);line-height:1.15;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .sub{font-size:var(--sub-size,15px);color:var(--muted);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;}
  .tile.on .sub{color:var(--glow);}
  .tile.good{background:rgba(var(--good-rgb,82,184,129),var(--ov-fill,.16));
    border:var(--ov-bw,1px) solid rgba(var(--good-rgb,82,184,129),var(--ov-bord,.55));}
  .tile.good .ico,.tile.good .icowrap,.tile.good .sub{color:var(--good);}
  .tile.crit{background:var(--crit-fill,rgba(var(--crit-rgb,226,107,95),var(--ov-fill,.16)));
    border:var(--ov-bw,1px) solid rgba(var(--crit-rgb,226,107,95),var(--ov-bord,.55));}
  .tile.crit .ico,.tile.crit .icowrap,.tile.crit .sub{color:var(--crit-ink,var(--crit));}
  /* Gefuellte Stoerungskachel: dann tragen Name, Raumzeile und Pfeil die
     Gegenfarbe. Ohne --crit-ink/--crit-muted aendert sich nichts. */
  .tile.crit .name{color:var(--crit-ink,var(--name-color,inherit));}
  .tile.crit .room,.tile.crit .chev{color:var(--crit-muted,var(--muted));}
  .tctrls{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .tctrls .tb{width:34px;height:34px;border-radius:50%;background:rgba(var(--wash,255,255,255),.10);
    display:grid;place-items:center;color:var(--ink);flex:0 0 auto;}
  .tctrls .tb:active{transform:scale(.92);background:rgba(var(--wash,255,255,255),.18);}
  .tctrls .tb svg{width:17px;height:17px;}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding-top:40px;font-size:15px;}
  /* Listen-Layout (volle Breite): immer exakt 4 Zeilen sichtbar (fuellt die
     Grid-Hoehe, egal wie hoch die Tab-Leiste ist -> kein 3,75-Zeilen-Rest). */
  .grid.list{grid-template-columns:1fr;grid-auto-rows:calc((100% - 3*var(--gap)) / 4);}
  .grid.list .tile{flex-direction:row;align-items:center;gap:14px;padding:0 18px;}
  .grid.list .tile .head{flex:0 0 auto;}
  .grid.list .tile .body{flex:1;min-width:0;}
  .grid.list .tctrls{margin-top:0;}
  /* Detail-Panel (z.B. Jalousie) */
  .grid.panel{display:flex;flex-direction:column;gap:10px;align-items:stretch;grid-auto-rows:initial;}
  /* Anlagenschema (SystemScheme): Titel oben, darunter ein Zoom-/Pan-Viewport.
     .schemestage ist das Original-Koordinatensystem (schemeSize), per transform
     skaliert/verschoben. Die Werte liegen absolut an ihren pos-Koordinaten. */
  .grid.scheme{display:flex;flex-direction:column;gap:0;padding:0;grid-auto-rows:initial;overflow:hidden;}
  .schemetitle{flex:0 0 auto;text-align:center;font-weight:600;font-size:16px;
    padding:10px 12px 8px;border-bottom:1px solid var(--line);}
  .schemeview{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;
    background:var(--screen);}
  .schemestage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
  .schemeimg{position:absolute;top:0;left:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;}
  .schemeval{position:absolute;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
    /* Bewusst KEINE --wash-Auflage: das Wertschild liegt ueber dem Schemabild,
       nicht ueber dem Panelgrund. Es bringt seinen Hintergrund selbst mit und
       muss hell bleiben, sonst steht die dunkle Schrift auf Schwarz. */
    color:#12140f;background:rgba(255,255,255,.82);border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);padding:0 4px;overflow:hidden;white-space:nowrap;}
  .schemeval span{overflow:hidden;text-overflow:ellipsis;}
  .schemeval.on{background:rgba(var(--accent-rgb,82,184,129),.9);color:var(--on-accent,#08130c);}
  .schemeval.crit{background:var(--crit-fill,rgba(226,105,95,.92));color:var(--crit-ink,#fff);}
  .schemeval.tap{cursor:pointer;box-shadow:0 0 0 2px var(--accent),0 1px 3px rgba(0,0,0,.25);}
  .schemehint{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--muted);
    background:rgba(0,0,0,.35);border-radius:6px;padding:2px 7px;pointer-events:none;}
  .hero{display:grid;place-items:center;padding:6px 0 2px;}
  .hero .circle{width:84px;height:84px;border-radius:50%;background:var(--tile);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);}
  .hero .circle svg{width:38px;height:38px;}
  .hero .circle .himg{width:38px;height:38px;background-color:currentColor;
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .hero .circle .rawico{width:38px;height:38px;object-fit:contain;}
  .status{text-align:center;color:var(--muted);font-size:14px;padding:2px 6px;}
  /* Wecker-Status: moderat gross (nicht so riesig wie .pbig), Raum als Unterzeile */
  .astat{text-align:center;font-size:30px;font-weight:600;line-height:1.18;letter-spacing:-.01em;padding:0 16px;}
  .astat.crit{color:var(--crit);}
  .astat .astatsub{font-size:15px;font-weight:400;color:var(--muted);margin-top:8px;letter-spacing:0;}
  .pbar{background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:15px;text-align:center;font-weight:650;font-size:15px;}
  .pbig{text-align:center;font-size:clamp(56px,15vw,84px);font-weight:600;letter-spacing:-.02em;line-height:1.06;
    padding:8px 8px;word-break:break-word;}
  .pbig.good{color:var(--good);} .pbig.crit{color:var(--crit);}
  .grid.panel.bigpage{justify-content:center;gap:14px;}
  /* anchor:bottom (IRR/Klima): Anzeige oben zentriert, Bedienung unten fixiert.
     Aufklappende Auswahl steht im .panbot VOR den festen Zeilen -> waechst nach oben. */
  .grid.panel.anchorbot{justify-content:flex-start;gap:0;}
  .grid.panel.anchorbot .pantop{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:center;align-items:stretch;gap:10px;}
  .grid.panel.anchorbot .panbot{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding-top:8px;}
  .brow{display:flex;gap:10px;}
  .btn{flex:1;background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:17px 10px;text-align:center;font-weight:650;font-size:15px;cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:none;
    transition:background .12s,transform .06s;}
  .btn:active{transform:scale(.97);background:rgba(var(--wash,255,255,255),.09);}
  .btn.on{background:linear-gradient(180deg,rgba(var(--on-rgb,224,162,77),.22),rgba(var(--on-rgb,224,162,77),.05));
    border-color:rgba(var(--on-rgb,224,162,77),.55);color:var(--glow);}
  /* Aufklappbare Auswahl (z.B. Klima Modus/Fan): Zeile per Toggle ein/aus */
  .brow.collapsed{display:none;}
  .brow.wraprow{flex-wrap:wrap;}
  .brow.wraprow .btn{flex:1 1 28%;min-width:82px;}
  .btn.toggler::after{content:'▾';margin-left:7px;opacity:.55;font-size:.82em;vertical-align:middle;}
  /* Auswahl-Popup (Klima Modus/Fan) */
  .menuov{position:absolute;inset:0;z-index:25;}
  .menubox{position:absolute;background:var(--screen);border:1px solid var(--line);
    border-radius:12px;padding:4px;min-width:150px;max-height:82%;overflow-y:auto;
    box-shadow:0 14px 44px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:1px;}
  .menuitem{padding:7px 16px;border-radius:7px;font-size:15px;line-height:1.15;white-space:nowrap;
    cursor:pointer;user-select:none;-webkit-user-select:none;color:var(--ink);}
  .menuitem:active{background:rgba(var(--wash,255,255,255),.13);}
  .menuitem.on{color:var(--glow);background:rgba(var(--on-rgb,224,162,77),.15);}
  /* Musik-Player */
  /* Cover = zentriertes Quadrat, das in Breite UND Hoehe der Flaeche passt.
     Ohne Hoehen-Cap ueberdeckt/verdraengt es auf flachen bzw. quadratischen
     Displays (4-Zoll 480x480, Shelly X2) Titel/Interpret. */
  .cover{position:relative;display:grid;place-items:center;padding:4px 0 2px;min-height:0;}
  .cover .coverph,.cover img{width:auto;height:auto;
    max-width:min(60%,210px);max-height:min(44vh,210px);aspect-ratio:1/1;border-radius:12px;}
  .cover .coverph{position:absolute;width:120px;height:120px;
    background:var(--tile);display:grid;place-items:center;color:var(--muted);}
  .cover .coverph svg{width:44px;height:44px;}
  .cover img{position:relative;object-fit:cover;opacity:0;transition:opacity .2s;
    box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .webframe{width:100%;height:74vh;border-radius:12px;overflow:hidden;background:#000;}
  .webframe iframe{width:100%;height:100%;border:0;display:block;}
  .video{width:100%;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;
    display:grid;place-items:center;}
  .video img{width:100%;height:100%;object-fit:contain;}
  .ptitle{text-align:center;font-size:19px;font-weight:550;padding:0 8px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ptitle .psub{font-size:15px;font-weight:400;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brow.transport{justify-content:center;align-items:center;gap:18px;}
  .btn.icon{flex:0 0 auto;width:58px;height:58px;display:grid;place-items:center;padding:0;
    border-radius:50%;color:var(--ink);}
  .btn.icon svg{width:24px;height:24px;}
  .btn.icon.big{width:70px;height:70px;background:var(--glow);border-color:transparent;color:var(--on-glow,#181008);}
  .btn.icon.big svg{width:30px;height:30px;}
  .srow{display:flex;align-items:center;gap:10px;padding:4px 4px;}
  .srow .sico{color:var(--muted);display:grid;place-items:center;}
  .srow .sico svg{width:20px;height:20px;}
  .srow .sval{font-family:var(--mono);font-size:12px;color:var(--muted);width:28px;text-align:right;}
  .sbtn{flex:0 0 auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--fg);font-size:20px;line-height:1;display:grid;
    place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;}
  .sbtn:active{background:var(--glow);color:var(--on-glow,#04121f);}
  #playerpane .ppvol .sbtn{width:30px;height:30px;font-size:18px;}
  /* Einheitliche Lautstaerke-/Wert-Leiste fuer BEIDE Player (Vollseite + Pane).
     Fuellung ueber --p (Prozent, per JS gesetzt) statt natives accent-color,
     damit sie auf jedem WebView gleich aussieht und der Track nie verschwindet.
     Track ueber --wash getoent, damit er auf hellen Themes sichtbar bleibt. */
  .sld{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;cursor:pointer;
    outline:none;background:linear-gradient(to right,
      var(--glow) var(--p,0%),rgba(var(--wash,255,255,255),.22) var(--p,0%));}
  .sld::-webkit-slider-runnable-track{-webkit-appearance:none;height:6px;border-radius:4px;background:transparent;}
  .sld::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--glow);border:2px solid var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer;}
  .sld::-moz-range-track{height:6px;border-radius:4px;background:rgba(var(--wash,255,255,255),.22);}
  .sld::-moz-range-progress{height:6px;border-radius:4px;background:var(--glow);}
  .sld::-moz-range-thumb{width:16px;height:16px;border:2px solid var(--bg);border-radius:50%;
    background:var(--glow);cursor:pointer;}
  /* Schwebender Zurück-Pfeil (nur beim Reinnavigieren) */
  .tabback{flex:0 0 auto;align-self:center;width:50px;height:50px;margin:0 14px;
    display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:32px;line-height:1;
    color:var(--muted);border:2px solid var(--line);background:rgba(var(--wash,255,255,255),.04);
    transition:color .15s,border-color .15s,background .15s;}
  .tabback.on{color:var(--on-accent,#fff);border-color:var(--accent);background:rgba(var(--accent-rgb,82,184,129),.14);}
  .tabback:active{transform:scale(.94);}
  .back:active{background:rgba(0,0,0,.65);}
  /* Tabs */
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--tabbar,rgba(0,0,0,.25));}
  .tab{flex:1;display:grid;place-items:center;padding:13px 0;color:var(--muted);cursor:pointer;}
  .tab svg{width:28px;height:28px;}
  /* Kategorie-Tab-Icon: Maskenfarbe DIREKT an die Theme-Variable haengen (nicht
     an currentColor). Sonst loest die eingeschraenkte WebView (Shelly) currentColor
     beim Farbschema-Wechsel nicht neu auf und das Icon bleibt an der Standardfarbe
     haengen -> auf getoentem Theme kaum sichtbar. */
  .tab .tico{display:inline-block;width:28px;height:28px;background-color:var(--muted);
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .tab.active{color:var(--accent);}
  .tab.active .tico{background-color:var(--accent);}
  .tab:active{transform:scale(.92);}
  /* Online-Punkt: nur auf den Haupt-Screens (Tabs), zentriert im 2x2-Raster */
  .conn{grid-row:1;grid-column:1;place-self:center;z-index:6;pointer-events:none;
    width:8px;height:8px;border-radius:50%;background:var(--crit-dot,#c14338);display:none;}
  .conn.ok{background:var(--accent);}
  .conn.vis{display:block;}
  .saver{position:absolute;inset:0;z-index:30;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-user-select:none;}
  .saver.hidden{display:none;}
  .saver .sv-time{font-size:78px;font-weight:300;line-height:1;letter-spacing:1px;
    font-variant-numeric:tabular-nums;color:var(--ink);}
  .saver .sv-date{font-size:20px;color:var(--muted);margin-top:8px;text-transform:capitalize;}
  .saver .sv-hint{margin-top:6px;font-size:13px;color:var(--muted);opacity:.5;}
  /* Anti-Einbrennen: Inhalt driftet langsam ueber den Schirm. Kleinere Amplitude
     als bei der reinen Uhr, damit Wetter/Termine nicht ueber den Rand wandern. */
  .saver .sv-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;
    width:min(92%,440px);animation:svdrift 90s linear infinite;}
  @keyframes svdrift{
    0%{transform:translate(-14px,-5px);}   25%{transform:translate(14px,-5px);}
    50%{transform:translate(14px,5px);}     75%{transform:translate(-14px,5px);}
    100%{transform:translate(-14px,-5px);}
  }
  .sv-clock{display:flex;flex-direction:column;align-items:center;gap:4px;}
  /* Kompakte Front, sobald Wetter/Termine dazukommen (sonst passt es nicht aufs
     480x480-Panel). Die reine Uhr (ohne Front-Daten) bleibt gross. */
  .sv-wrap.rich{gap:9px;}
  /* Mit Wetter/Terminen keine Anti-Einbrenn-Drift — der Inhalt soll ruhig stehen
     (die reine Uhr weiter unten driftet weiterhin als Einbrennschutz). */
  .saver .sv-wrap.rich{animation:none;transform:none;}
  .sv-wrap.rich .sv-time{font-size:44px;}
  .sv-wrap.rich .sv-date{font-size:15px;}
  .sv-wrap.rich .sv-clock{margin:20px 0 6px;}   /* Uhr klar von der Wettervorschau darueber absetzen */
  .sv-wrap.rich .sv-hint{display:none;}   /* bei voller Front kein Platz; nur-Uhr behaelt ihn */
  /* Split-Panel: doppelte Breite nutzen. Uhr oben mittig ueber beide Spalten,
     darunter Wetter links und Kalender rechts. Festes 2-Spalten-Grid (bricht
     nicht um). Nur mit Front-Daten (rich); die reine Uhr bleibt zentriert. */
  .saver.split .sv-wrap.rich{width:min(94%,820px);display:grid;
    grid-template-columns:1fr 1fr;grid-template-areas:"clock clock" "wx cal";
    column-gap:44px;row-gap:16px;align-items:start;}
  .saver.split .sv-wrap.rich .sv-clock{grid-area:clock;justify-self:center;margin:0 0 4px;}
  .saver.split .sv-wrap.rich .sv-wx{grid-area:wx;}
  .saver.split .sv-wrap.rich .sv-cal{grid-area:cal;}
  .saver.split .sv-wrap.rich .sv-time{font-size:60px;}
  .saver.split .sv-wrap.rich .sv-date{font-size:18px;}
  /* Wetter oben: aktuelle Lage + Vorschau-Streifen (je Tag Icon + Max/Min). */
  .saver .sv-wx{display:flex;flex-direction:column;gap:10px;align-self:stretch;}
  .sv-wx .now{display:flex;align-items:center;gap:12px;}
  .sv-wx .now .ico{width:34px;height:34px;flex:none;}
  .sv-wx .now .t{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;
    font-variant-numeric:tabular-nums;}
  .sv-wx .now .meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .sv-wx .now .cond{font-size:15px;font-weight:500;}
  .sv-wx .now .hl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .sv-wx .fore{display:grid;grid-template-columns:repeat(var(--fc,4),1fr);gap:8px;}
  .sv-wx .fc{background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .sv-wx .fc .d{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .sv-wx .fc .ico{width:22px;height:22px;}
  .sv-wx .fc .tt{font-size:12.5px;font-variant-numeric:tabular-nums;}
  .sv-wx .fc .tt .mx{font-weight:600;} .sv-wx .fc .tt .mn{color:var(--muted);}
  .sv-wx .ico{display:grid;place-items:center;color:var(--ink);}
  .sv-wx .ico svg{width:100%;height:100%;}
  .sv-wx .ico.sun{color:var(--glow);}
  .sv-wx .ico.rain,.sv-wx .ico.drizzle,.sv-wx .ico.snow,.sv-wx .ico.storm{color:var(--cool,#7fb2e6);}
  /* Termine unten: die naechsten Eintraege aus dem iCal-Abo. */
  .saver .sv-cal{display:flex;flex-direction:column;gap:8px;align-self:stretch;}
  .sv-cal .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:8px;}
  .sv-cal .lbl::after{content:"";flex:1;height:1px;background:var(--line);}
  .sv-ev{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
    background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:7px 11px;}
  .sv-ev .when{display:flex;flex-direction:column;gap:1px;min-width:52px;}
  .sv-ev .when .day{font-size:12px;color:var(--muted);}
  .sv-ev .when .tm{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;}
  .sv-ev .ttl{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sv-ev .tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    border:1px solid rgba(var(--accent-rgb,82,184,129),.4);background:rgba(var(--accent-rgb,82,184,129),.10);
    border-radius:999px;padding:2px 8px;white-space:nowrap;}
  /* Groessere Panels/Tablets/Browser: die Front nutzt den Platz statt als kleine
     440px-Saeule in der Mitte zu haengen. Nur der Screensaver (.saver) skaliert
     hoch — die reine 480x480-Ansicht bleibt unveraendert kompakt. */
  @media (min-width:640px) and (min-height:560px){
    .saver .sv-wrap{width:min(90%,680px);gap:24px;}
    .sv-wrap.rich{gap:20px;}
    .sv-wrap.rich .sv-time{font-size:76px;}
    .sv-wrap.rich .sv-date{font-size:21px;}
    .saver .sv-wx{gap:16px;}
    .sv-wx .now{gap:16px;}
    .sv-wx .now .ico{width:56px;height:56px;}
    .sv-wx .now .t{font-size:42px;}
    .sv-wx .now .cond{font-size:20px;}
    .sv-wx .now .hl{font-size:15px;}
    .sv-wx .fore{gap:12px;}
    .sv-wx .fc{padding:13px 8px 14px;gap:6px;border-radius:14px;}
    .sv-wx .fc .d{font-size:13px;}
    .sv-wx .fc .ico{width:32px;height:32px;}
    .sv-wx .fc .tt{font-size:16px;}
    .saver .sv-cal{gap:11px;}
    .sv-cal .lbl{font-size:12px;}
    .sv-ev{padding:12px 18px;gap:18px;border-radius:14px;}
    .sv-ev .when{min-width:70px;}
    .sv-ev .when .day{font-size:14px;}
    .sv-ev .when .tm{font-size:19px;}
    .sv-ev .ttl{font-size:18px;}
    .sv-ev .tag{font-size:12px;padding:3px 11px;}
  }
  /* ---- Ausfuehrliche "Wetter & Kalender"-Ansicht (eigene Seite / Split-Pane) ---- */
  .frontpage.hidden{display:none;}
  .frontpage{position:absolute;inset:0;z-index:5;background:var(--screen);
    display:flex;flex-direction:column;gap:14px;padding:16px;overflow-y:auto;}
  .fp-h{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:8px;}
  .fp-h::after{content:"";flex:1;height:1px;background:var(--line);}
  .fp-now{display:flex;align-items:center;gap:18px;padding:2px 4px 6px;}
  .fp-now .ico{width:72px;height:72px;flex:none;display:grid;place-items:center;color:var(--ink);}
  .fp-now .ico svg{width:100%;height:100%;}
  .fp-now .ico.sun{color:var(--glow);}
  .fp-now .ico.rain,.fp-now .ico.drizzle,.fp-now .ico.snow,.fp-now .ico.storm{color:var(--cool,#7fb2e6);}
  .fp-now .t{font-size:58px;font-weight:600;letter-spacing:-.02em;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--ink);}
  .fp-now .meta{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .fp-now .cond{font-size:19px;font-weight:600;color:var(--ink);}
  .fp-now .sub{font-size:13px;color:var(--muted);}
  .fp-curve{width:100%;color:var(--accent);}
  .fp-curve svg{width:100%;height:auto;display:block;}
  .fp-curve .fpx{fill:var(--muted);font-size:11px;}
  .fp-curve .fpt{fill:var(--ink);font-size:11px;font-weight:600;}
  .fp-fore{display:grid;grid-template-columns:repeat(var(--fc,5),1fr);gap:8px;}
  .fp-fc{background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .fp-fc .d{font-size:12px;color:var(--muted);}
  .fp-fc .ico{width:26px;height:26px;display:grid;place-items:center;color:var(--ink);}
  .fp-fc .ico svg{width:100%;height:100%;}
  .fp-fc .ico.sun{color:var(--glow);}
  .fp-fc .ico.rain,.fp-fc .ico.drizzle,.fp-fc .ico.snow,.fp-fc .ico.storm{color:var(--cool,#7fb2e6);}
  .fp-fc .tt{font-size:13px;font-variant-numeric:tabular-nums;}
  .fp-fc .tt .mx{font-weight:600;} .fp-fc .tt .mn{color:var(--muted);}
  .fp-fc .pop{font-size:11px;color:var(--cool,#7fb2e6);}
  .fp-cal{display:flex;flex-direction:column;gap:6px;}
  .fp-day{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px;}
  .fp-ev{display:grid;grid-template-columns:70px 1fr;align-items:baseline;gap:12px;
    background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .fp-ev .tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
  .fp-ev .tm.all{color:var(--muted);font-weight:500;font-size:12px;}
  .fp-ev .ttl{font-size:15px;overflow:hidden;text-overflow:ellipsis;}
  .fp-empty{color:var(--muted);font-size:14px;padding:6px 0;}
  /* Wetter-Detailkacheln (Luftfeuchte, Wind, Sonne, UV, ...) */
  .fp-det{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fp-det>div{background:var(--tile);border:1px solid var(--line);border-radius:10px;
    padding:8px 11px;display:flex;flex-direction:column;gap:2px;}
  .fp-det>div span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

  .pinbtn{flex:1;text-align:center;padding:12px;border-radius:10px;cursor:pointer;user-select:none;font-weight:600;border:1px solid var(--line);}
  .pinbtn.ok{background:var(--glow);color:var(--on-glow,#181008);border-color:transparent;}
  .pinbtn:active{transform:scale(.97);}
  .pindisp{font-size:26px;text-align:center;letter-spacing:.35em;min-height:38px;padding:8px 6px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pinkey{padding:15px 0;text-align:center;font-size:22px;border:1px solid var(--line);border-radius:12px;
    cursor:pointer;user-select:none;background:var(--tile);}
  .pinkey:active{background:rgba(var(--wash,255,255,255),.14);transform:scale(.97);}
  .pinkey.ok{background:var(--glow);color:var(--on-glow,#181008);border-color:transparent;font-weight:700;}
  .pinkey.del{font-size:20px;}
</style>
</head>

<script>
const ICONS = {

  down:'<path d="m6 9 6 6 6-6"/>',

  alarm:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',

  thermo:'<path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z"/>',
  fan:'<path d="M10.83 16.38a6.08 6.08 0 0 1-8.62-7l5.41 1.45a6.08 6.08 0 0 1 7-8.62l-1.45 5.41a6.08 6.08 0 0 1 8.62 7l-5.41-1.45a6.08 6.08 0 0 1-7 8.62l1.45-5.41Z"/><path d="M12 12v.01"/>',
  cam:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
};
const TABS = [
  {tab:'favoriten', label:'Favoriten', icon:'<path d="m12 3 2.9 5.9 6.1.9-4.5 4.4 1 6.1L12 17.8 6.5 20.3l1-6.1L3 9.8l6.1-.9z"/>'},
  {tab:'zentral',   label:'Zentral',   icon:'<path d="M3 11 12 4l9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>'},
  {tab:'raeume',    label:'Räume',     icon:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/>'},
  {tab:'kategorien',label:'Kategorien',icon:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/>'},
];

const el = id => document.getElementById(id);
let ws, stack = [{view:'tab',tab:'favoriten'}], view = null;
// Touch-Panel: nach der ersten Beruehrung den Mauszeiger ausblenden (Desktop-Maus bleibt)
addEventListener('touchstart', ()=>document.body.classList.add('touch'), {once:true, passive:true});
let tabsCfg = ['favoriten','zentral','raeume','kategorien'];
let tabMeta = {};   // Label/Icon fuer dynamische Tabs (Kategorien), vom Server
let gridCols = 2;   // effektive Spalten der aktuellen Ansicht (Vollbreit-Pane -> 4)
let gridRows = 2;   // effektive sichtbare Zeilen pro Seite
let profCols = 2, profRows = 2;   // Profil-Standard (aus dem Theme); Vollbreit ueberschreibt auf 4x2
let _lastWide = null;   // zuletzt gerenderte Quer/Hoch-Entscheidung (fuer resize-Nachzug, s. render())
let _playerBuilt = false, _playerVolDrag = false;   // fester Player (Split-Layout)
// Split-Pane pro Tab: panesCfg = {tabKennung -> "weather"|"calendar"|"wide"|"player:<zone>"|"energy:<uuid>"|"camera:<uuid>"}
// (vom Server). themeFill = "Bildschirm fuellen" (gilt jetzt auch im Split).
// curPlayerZone = zuletzt an den Server gemeldete Player-Zone (setplayer).
let panesCfg = {}, themeFill = false, curPlayerZone = '', curEnergyUuid = '', curCameraUuid = '';
let cameraData = null;   // letzter {t:'camera'}-Push (Intercom-Bloecke) fuer die Kamera-Pane
let energyData = null;   // letzter {t:'energy'}-Push fuer die Energiefluss-Pane
let themeSplit = true;   // Split-Screen an/aus (aus = 4"-Panel: nur die Visu, keine Pane 2)

function svg(inner){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';}
function svgF(inner){return '<svg viewBox="0 0 24 24" fill="currentColor">'+inner+'</svg>';}
let sldDragging=false;
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function key(r){return JSON.stringify(r||{});}

// ---- Weckton (Loxone-Wecker klingelt) ----
// Synthetischer Piep-Loop per Web Audio API: kein Audio-Asset noetig, laeuft bis
// der Server das Ende meldet ({t:'alarm',on:false}, nach 'dismiss' in Loxone/App
// oder ueber den "Wecker aus"-Button am Panel). Der Kiosk startet Chromium mit
// --autoplay-policy=no-user-gesture-required, darum spielt der Ton ohne vorherige
// Nutzergeste. Zusaetzlich ein Failsafe, der nach 5 Min stoppt, falls das
// Aus-Event mal ausbleibt (sonst piepte das Panel endlos).
let _actx=null, _alarmTimer=null, _alarmFailsafe=null;
function startAlarmTone(){
  if(_alarmTimer) return;               // laeuft schon
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    const beep=()=>{
      const t=_actx.currentTime, o=_actx.createOscillator(), g=_actx.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.connect(g); g.connect(_actx.destination);
      o.start(t); o.stop(t+0.45);
    };
    beep();
    _alarmTimer=setInterval(beep,700);
    clearTimeout(_alarmFailsafe);
    _alarmFailsafe=setTimeout(stopAlarmTone,5*60*1000);
  }catch(e){}
}
function stopAlarmTone(){
  if(_alarmTimer){ clearInterval(_alarmTimer); _alarmTimer=null; }
  clearTimeout(_alarmFailsafe); _alarmFailsafe=null;
}
// Sichtbarer Hinweis oben am Panel — bestaetigt, dass ein Test-Ton-Event
// tatsaechlich ankam, und meldet den AudioContext-Status. So laesst sich
// "Push kommt nicht an" von "Audio-Ausgabe stumm" trennen.
function flashAudioBadge(txt, ok){
  let b=document.getElementById('audiobadge');
  if(!b){
    b=document.createElement('div'); b.id='audiobadge';
    b.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;'+
      'padding:13px 20px;border-radius:12px;font:600 15px system-ui,sans-serif;color:#fff;'+
      'box-shadow:0 8px 28px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;';
    document.body.appendChild(b);
  }
  b.textContent=txt;
  b.style.background = ok ? 'rgba(82,184,129,.96)' : 'rgba(226,107,95,.96)';
  b.style.opacity='1';
  clearTimeout(b._t); b._t=setTimeout(()=>{ b.style.opacity='0'; }, 3500);
}
// Kurzer Test-Ton (3 Pieptoene) von der Einstellungen-Seite ausgeloest. Eigener
// AudioContext (stoert einen evtl. laufenden echten Weckton nicht). resume()
// wird abgewartet, damit der Ton auch bei anfangs suspendiertem Context spielt;
// der Badge meldet, ob der Context wirklich laeuft.
function playTestTone(){
  let actx;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ flashAudioBadge('🔊 Test-Ton empfangen — Web Audio nicht verfügbar', false); return; }
  const boom=()=>{
    try{
      let t=actx.currentTime;
      for(let i=0;i<3;i++){
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.4); t+=0.5;
      }
    }catch(e){}
    const running = actx.state==='running';
    flashAudioBadge(running ? '🔊 Test-Ton — Audio läuft' : '🔊 empfangen, Audio blockiert ('+actx.state+')', running);
    setTimeout(()=>{ try{ actx.close(); }catch(e){} }, 2200);
  };
  if(actx.state==='suspended'){ actx.resume().then(boom, boom); }
  else boom();
}

function send(o){ ws && ws.readyState===1 && ws.send(JSON.stringify(o)); }
function nav(route){ stack.push(route); send({t:'nav',route}); }
function goTab(tab){ stack=[{view:'tab',tab}]; send({t:'nav',route:stack[0]}); }
function back(){ if(stack.length>1){ stack.pop(); send({t:'nav',route:stack[stack.length-1]}); } }

let pendingSecure=null;
function askPin(cb,msg){
  const s=document.querySelector('.screen'); let ov=s.querySelector('.pinov'); if(ov)ov.remove();
  ov=document.createElement('div'); ov.className='pinov';
  let val='';
  const keys=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  ov.innerHTML='<div class="pinbox"><div class="pinttl">PIN / Passwort</div>'+
    '<div class="pindisp" id="pindisp"></div>'+
    '<div class="pinmsg">'+(msg||'')+'</div>'+
    '<div class="pinpad">'+keys.map(k=>{
      const cls='pinkey'+(k==='ok'?' ok':'')+(k==='del'?' del':'');
      const lbl=k==='del'?'⌫':(k==='ok'?'OK':k);
      return '<div class="'+cls+'" data-k="'+k+'">'+lbl+'</div>';
    }).join('')+'</div>'+
    '<div class="pinbtn cancel">Abbrechen</div></div>';
  s.appendChild(ov);
  const disp=ov.querySelector('#pindisp');
  const draw=()=>{ disp.textContent='•'.repeat(val.length); };
  const done=v=>{ ov.remove(); cb(v); };
  ov.querySelectorAll('.pinkey').forEach(b=>{ b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='ok') done(val);
    else if(k==='del'){ val=val.slice(0,-1); draw(); }
    else if(val.length<12){ val+=k; draw(); }
  };});
  ov.querySelector('.cancel').onclick=()=>done(null);
}
function doSecure(uuid,cmd,msg){
  askPin(pin=>{ if(pin==null){pendingSecure=null;return;} pendingSecure={uuid,cmd}; send({t:'cmd',uuid,cmd,pin}); }, msg);
}
function sendCmd(uuid,cmd,secured){ if(secured) doSecure(uuid,cmd,''); else send({t:'cmd',uuid,cmd}); }
const SLD_STEP=5;   // Schrittweite der -/+ Tasten am Schieberegler (Lautstaerke etc.)
// Fuellstand der Leiste als CSS-Var --p (Prozent) setzen -> gefuellte Anzeige
// unabhaengig vom nativen accent-color-Rendering des jeweiligen WebViews.
function sldFill(sld){ if(!sld)return;
  const min=+sld.min||0, max=(sld.max!==''?+sld.max:100);
  const p=max>min?((+sld.value-min)/(max-min))*100:0;
  sld.style.setProperty('--p', Math.max(0,Math.min(100,p))+'%'); }
function nudgeSld(sld,delta,valEl){ if(!sld)return;
  const min=+sld.min||0, max=(sld.max!==''?+sld.max:100);
  let v=Math.round((+sld.value||0)+delta); v=Math.max(min,Math.min(max,v));
  if(v===(+sld.value)) return;
  sld.value=v; sldFill(sld); if(valEl) valEl.textContent=v;
  if(sld._uuid&&sld._tmpl) send({t:'cmd',uuid:sld._uuid,cmd:sld._tmpl.replace('{v}',v)}); }

let holdRelease=null;
let videoTimer=null;
function stopVideo(){ if(videoTimer){ clearInterval(videoTimer); videoTimer=null; } }
function setMore(route){ const s=document.querySelector('.screen'); if(!s)return; let mb=s.querySelector('.moreb');
  if(route){ if(!mb){ mb=document.createElement('div'); mb.className='moreb'; mb.textContent='⋮'; s.appendChild(mb);} mb.onclick=()=>nav(route); }
  else if(mb){ mb.remove(); } }
function endHold(){ if(holdRelease){ send({t:'cmd',uuid:holdRelease.uuid,cmd:holdRelease.cmd}); holdRelease=null; } }
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);

function bindCell(btn,c){ btn._cmd=c.cmd||null; btn._release=c.release||null; btn._hold=!!c.hold; btn._menu=c.menu||null; }
function cellHtml(c,i){
  const inner=c.icon?svgF(ICONS[c.icon]||ICONS.info):esc(c.label);
  const cls='btn'+(c.icon?' icon':'')+(c.big?' big':'')+(c.menu?' toggler':'')+(c.on?' on':'');
  return '<div class="'+cls+'" data-c="'+i+'">'+inner+'</div>';
}
function closeMenu(){ const m=document.querySelector('.menuov'); if(m)m.remove(); }
// Auswahl-Popup ueber einem Button (Klima Modus/Fan): oeffnet nach oben, Tipp
// daneben schliesst. Auswahl sendet den Befehl und schliesst.
function openMenu(btn, items){
  const s=document.querySelector('.screen'); if(!s)return;
  closeMenu();
  const ov=document.createElement('div'); ov.className='menuov';
  const box=document.createElement('div'); box.className='menubox';
  box.innerHTML=items.map((it,i)=>'<div class="menuitem'+(it.on?' on':'')+'" data-m="'+i+'">'+esc(it.label)+'</div>').join('');
  ov.appendChild(box); s.appendChild(ov);
  const br=btn.getBoundingClientRect(), sr=s.getBoundingClientRect();
  let left=br.left-sr.left;
  left=Math.max(8, Math.min(left, sr.width-box.offsetWidth-8));
  box.style.left=left+'px';
  box.style.bottom=(sr.height-(br.top-sr.top)+6)+'px';   // ueber dem Button
  box.querySelectorAll('.menuitem').forEach(n=>{
    n.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation();
      const it=items[+n.dataset.m]; closeMenu();
      if(it&&it.cmd) sendCmd(it.cmd.uuid,it.cmd.cmd,view&&view.secured); });
  });
  ov.addEventListener('pointerdown',()=>closeMenu());
}
// Struktur-Signatur der Bloecke: Art und Reihenfolge, dazu die Zaehlungen, die
// die Anzeige formen. Weicht sie vom zuletzt Gerenderten ab, muss komplett neu
// aufgebaut werden — in-place patchen wuerde neu dazugekommene Zeilen nie
// erzeugen (z.B. "Wasser nachfuellen" in der Sauna) und weggefallene stehen
// lassen.
function blockSig(blocks){
  return blocks.filter(b=>b.k!=='more').map(b=>
    b.k==='row' ? 'row'+b.cells.length+(b.hidden?'h':'')
    : b.k==='favs' ? 'favs'+(b.items?b.items.length:0)
    : b.k==='alarmlist' ? 'alarm'+((b.entries&&b.entries.length)?1:0)
    : b.k==='astat' ? 'astat'+(b.sub?1:0)
    : b.k).join('|');
}
function renderPanel(blocks){
  stopVideo();
  closeMenu();
  setMore((blocks.find(b=>b.k==='more')||{}).route||null);
  el('conn').classList.remove('vis');
  el('grid').classList.add('panel');
  el('grid').classList.remove('list','snapy','scheme');
  el('grid').classList.toggle('bigpage', blocks.some(b=>b.k==='big'));
  const g=el('grid');
  // anchor:bottom -> Anzeige (big/status) oben zentriert, Bedienung unten
  // verankert; aufklappende Auswahl waechst dann nach oben ueber die festen Zeilen.
  const anchorBot = !!(view && view.anchor==='bottom');
  g.classList.toggle('anchorbot', anchorBot);
  const TOPK = {hero:1,cover:1,video:1,status:1,title:1,value:1,big:1,astat:1,eflow:1};
  const bh = b => {
    if(b.k==='eflow') return '<div class="epane-detail" data-eflow></div>';   // Radial; wird nach dem Einfuegen von paintEnergy gefuellt
    if(b.k==='hero'){ const hic = b.iconImg

function updatePanel(blocks){
  const g=el('grid');
  // Struktur anders als zuletzt gerendert (Zeile/Status/Favorit dazu oder weg,
  // Favoriten per roomfav/get nachgeliefert)? Dann komplett neu aufbauen.
  if(g.dataset.bsig!==blockSig(blocks)){ renderPanel(blocks); return; }
  const rowBlocks=blocks.filter(b=>b.k==='row');
  const rows=[...g.querySelectorAll('.brow')];
  // Ab hier ist die Struktur nachweislich identisch -> jeden Block an SEINER
  // Position patchen, nicht nur den ersten seiner Art: Detailseiten wie die
  // Sauna haben mehrere Status-Zeilen (Tuer, Wasser, Stoerung ...), die sonst
  // auf dem Stand des ersten Renderns einfrieren.
  const nth=(k,sel,fn)=>{ const es=[...g.querySelectorAll(sel)];
    blocks.filter(b=>b.k===k).forEach((b,i)=>{ if(es[i]) fn(es[i],b); }); };
  nth('status','.status:not(.alist-empty)',(e,b)=>{ e.textContent=b.text||''; });
  nth('value','.pbar',(e,b)=>{ e.textContent=b.text||''; });
  nth('big','.pbig',(e,b)=>{ e.textContent=b.text||''; e.className='pbig'+(b.tone==='good'?' good':(b.tone==='crit'?' crit':'')); });
  nth('title','.ptitle',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; const su=e.querySelector('.psub'); if(su)su.textContent=b.sub||''; });
  nth('astat','.astat',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; e.className='astat'+(b.tone==='crit'?' crit':''); const su=e.querySelector('.astatsub'); if(su)su.textContent=b.sub||''; });
  const cov=blocks.find(b=>b.k==='cover'); if(cov){const img=g.querySelector('#coverimg'); if(img&&img.getAttribute('src')!==cov.src){img.style.opacity='0'; img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=cov.src;}}
  const sb=blocks.find(b=>b.k==='slider'); if(sb){const sld=g.querySelector('.sld'); if(sld&&!sldDragging){ sld.value=sb.value; sldFill(sld); const sv=g.querySelector('.sval'); if(sv)sv.textContent=sb.value; }}
  const efb=blocks.find(b=>b.k==='eflow'); if(efb){ const d=g.querySelector('[data-eflow]'); if(d) paintEnergy(d, efb.e); }   // Radial live aktualisieren (in-place)
  rowBlocks.forEach((b,ri)=>{ const rowEl=rows[ri]; if(!rowEl)return;
    b.cells.forEach((c,ci)=>{ const btn=rowEl.querySelector('[data-c="'+ci+'"]'); if(!btn)return;
      if(c.icon){ btn.innerHTML=svgF(ICONS[c.icon]||ICONS.info); btn.className='btn icon'+(c.big?' big':'')+(c.on?' on':''); }
      else { btn.textContent=c.label; btn.className='btn'+(c.menu?' toggler':'')+(c.on?' on':''); }
      bindCell(btn,c);
    });
  });
}

function activeTab(){ const b=stack[0]; return b && b.view==='tab' ? b.tab : null; }

function renderTabs(){
  const at = activeTab();
  const items = tabsCfg.map(tk => {
    const cls = 'tab'+(tk===at?' active':'');
    const t = TABS.find(x => x.tab===tk);
    if(t) return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(t.label)+'">'+svg(t.icon)+'</div>';
    const m = tabMeta[tk]; if(!m) return '';   // dynamischer Tab (Kategorie/Raum)
    // Ohne Bild aus Loxone: Raum bekommt das Raum-Symbol, Kategorie den Wuerfel -
    // sonst sehen ein Raum- und ein Kategorie-Tab identisch aus.
    const fallback = tk.indexOf('room:')===0
      ? '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/>'
      : '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/>';
    const ico = m.iconUrl
      ? '<span class="tico" style="--u:url(\''+esc(m.iconUrl)+'\')"></span>'
      : svg(fallback);
    return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(m.label||'')+'">'+ico+'</div>';
  }).filter(Boolean);
  const mid = Math.floor(items.length/2);
  items.splice(mid, 0, '<div class="tabback'+(stack.length>1?' on':'')+'" id="tabback">‹</div>');
  el('tabs').innerHTML = items.join('');
  el('tabs').querySelectorAll('.tab').forEach(n => n.onclick=()=>goTab(n.dataset.tab));
  const tb = el('tabs').querySelector('#tabback'); if(tb) tb.onclick = back;
  applyPane();
}
// ---- Split-Pane pro Tab: entscheidet je aktuellem Tab, was rechts steht ----
// Wert je Tab: "weather" | "calendar" | "wide" | "player:<zone-uuid>" | "energy:<uuid>" | "camera:<uuid>".
function paneForTab(tk){ return tk ? (panesCfg[tk]||null) : null; }
function paneKind(v){ return v ? (v.indexOf('player:')===0 ? 'player' : (v.indexOf('energy:')===0 ? 'energy' : (v.indexOf('camera:')===0 ? 'camera' : v))) : null; }
function applyPane(){
  const sc=document.querySelector('.screen'); if(!sc) return;
  const raw=themeSplit?paneForTab(activeTab()):null;   // Split aus (4"-Panel) -> keine Pane 2
  const kind=paneKind(raw);
  const isPane=(kind==='player'||kind==='weather'||kind==='calendar'||kind==='energy'||kind==='camera');   // Widget in Pane 2
  sc.classList.toggle('split', isPane);   // Widget -> zweigeteilt, sonst "Screen fuellen"
  sc.classList.toggle('fill', themeFill);  // "Bildschirm fuellen" fuellt Split UND Screen-fuellen
  const pp=el('playerpane'), fp=el('frontpane');
  if(pp) pp.hidden=(kind!=='player');
  if(fp){
    fp.hidden=!(kind==='weather'||kind==='calendar'||kind==='energy'||kind==='camera');
    fp.classList.toggle('cam', kind==='camera');
    // Kamera verlassen -> Video-Stream stoppen (Inhalt leeren), keine Hintergrund-Verbindung.
    if(kind!=='camera' && fp.dataset.cam!==undefined){ fp.innerHTML=''; delete fp.dataset.cam; delete fp.dataset.camsig; }
  }
  if(kind==='weather') renderWeatherPane(fp);
  else if(kind==='calendar') renderCalendarPane(fp);
  else if(kind==='energy') renderEnergyPane(fp);
  else if(kind==='camera') renderCameraPane(fp);
  // Player-Zone dieses Tabs dem Server melden (nur bei Aenderung -> er pusht die Blocks).
  const zone=(kind==='player')?raw.slice(7):'';
  if(zone!==curPlayerZone){ curPlayerZone=zone; _playerBuilt=false; try{ send({t:'setplayer',zone:zone}); }catch(e){} }
  // Energiefluss-Kachel dieses Tabs dem Server melden (er pusht dann {t:'energy'}).
  const euid=(kind==='energy')?raw.slice(7):'';
  if(euid!==curEnergyUuid){ curEnergyUuid=euid; try{ send({t:'setenergy',uuid:euid}); }catch(e){} }
  // Kamera (Intercom) dieses Tabs dem Server melden (er pusht dann {t:'camera'} mit Video+Buttons).
  const cuid=(kind==='camera')?raw.slice(7):'';
  if(cuid!==curCameraUuid){ curCameraUuid=cuid; cameraData=null;
    if(fp){ delete fp.dataset.cam; delete fp.dataset.camsig; }
    try{ send({t:'setcamera',uuid:cuid}); }catch(e){}
    if(cuid&&kind==='camera') renderCameraPane(fp);   // sofort Platzhalter zeigen, bis der Push kommt
  }
}

// Inline-Style (CSS-Variablen + Farben) einer Kachel — von render() und
// updateGrid() gemeinsam genutzt, liefert den ROHEN Style (ohne HTML-Escape).
function tileVarStyle(it){
  const sv=[]; const ts=it.style||{};
  if(it.colorFixed){ sv.push('--ico:'+it.colorFixed); sv.push('--ico-fixed:'+it.colorFixed); }
  else if(it.color) sv.push('--ico:'+it.color);
  if(ts.bg) sv.push('background:'+ts.bg);
  if(ts.border) sv.push('border-color:'+ts.border);
  if(ts.txt) sv.push('color:'+ts.txt);
  if(ts.font) sv.push('font-family:'+ts.font);
  if(ts.ovFill!=null) sv.push('--ov-fill:'+ts.ovFill);
  if(ts.ovBord!=null) sv.push('--ov-bord:'+ts.ovBord);
  if(ts.ovBw!=null) sv.push('--ov-bw:'+ts.ovBw+'px');
  if(ts.tileBord!=null) sv.push('--tile-bord:'+ts.tileBord);
  if(ts.tileBw!=null) sv.push('--tile-bw:'+ts.tileBw+'px');
  if(ts.ringOp!=null) sv.push('--posring-op:'+ts.ringOp);
  if(ts.ringTrk!=null) sv.push('--posring-trk:'+ts.ringTrk);
  if(ts.ringW!=null) sv.push('--posring-w:'+ts.ringW);
  return sv.join(';');
}
function tileTone(it){ return it.tone==='good'?' good':(it.tone==='crit'?' crit':(it.on?' on':'')); }
// Positionsring: EINE Quelle fuer Vollrender und In-place-Patch. Vorher stand
// der Umfang zweimal als Zahl im Render-Zweig; sobald der Patch dazukam, waere
// er die dritte Stelle gewesen, an der sich derselbe Wert aendern muss.
const RING_U = 289.03;                      // Umfang bei r=46 im viewBox 0..100
function ringPos(it){
  return (typeof it.pos === 'number' && isFinite(it.pos))
    ? Math.max(0, Math.min(100, it.pos)) : null;
}
function ringDash(posv){ return (posv/100*RING_U).toFixed(2)+' '+RING_U; }
// Live-Update der Kachel-Ansicht OHNE Neuaufbau: aktualisiert nur die
// veraenderlichen Teile (Zustand/Farben/Sublabel/Steuer-Icons) der bestehenden
// Kacheln. Verhindert das Flackern (Icons/Cover werden nicht neu geladen).
// Gibt false zurueck, wenn sich die Struktur geaendert hat -> voller render().
// Positionsring live nachziehen (Rollladen/Tor/Fenster/Dimmer): updateGrid()
// baute den Ring frueher NICHT mit -> der Bogen fror auf dem Stand vom letzten
// vollen Render ein (Text sagte 95 %, Ring zeigte noch 20 %). Gibt false zurueck,
// wenn sich die Ring-STRUKTUR aendert (Ring kommt/geht) -> voller render().
function updateTileRing(n,it){
  const posv=ringPos(it);
  const ring=n.querySelector('.posring');
  if(posv===null) return !ring;          // Ring war da, ist aber weg -> Struktur
  if(!ring) return false;                // Ring soll da sein, ist aber nicht -> Struktur
  const grp=ring.querySelector('g'); let val=ring.querySelector('.val');
  if(posv>0){
    if(!val){ val=document.createElementNS('http://www.w3.org/2000/svg','circle');
      val.setAttribute('class','val'); val.setAttribute('cx','50'); val.setAttribute('cy','50'); val.setAttribute('r','46');
      if(grp) grp.appendChild(val); }
    const d=ringDash(posv); if(val.getAttribute('stroke-dasharray')!==d) val.setAttribute('stroke-dasharray',d);
  } else if(val){ val.remove(); }        // 0 %: nur die Spur bleibt
  return true;
}
function updateGrid(items){
  const g=el('grid');
  if(g.classList.contains('panel')) return false;
  const nodes=g.querySelectorAll('.tile[data-id]');
  if(nodes.length!==items.length || !nodes.length) return false;
  for(let i=0;i<items.length;i++){ if(String(items[i].id)!==nodes[i].dataset.id) return false; }
  const _pg=(view.layout==='list'?4:gridCols*gridRows);
  let ok=true;
  items.forEach((it,i)=>{
    const n=nodes[i];
    n._it=it;
    const cls='tile'+tileTone(it)+(i%_pg===0?' snap':'');
    if(n.className!==cls) n.className=cls;
    const stStr=tileVarStyle(it);
    if((n.getAttribute('style')||'')!==stStr) n.setAttribute('style',stStr);
    const body=n.querySelector('.body');
    if(body){ let subEl=body.querySelector('.sub');
      if(it.sublabel){ if(!subEl){ subEl=document.createElement('div'); subEl.className='sub'; body.appendChild(subEl); }
        if(subEl.textContent!==it.sublabel) subEl.textContent=it.sublabel; }
      else if(subEl){ subEl.remove(); } }
    if(it.controls){ const tbs=n.querySelectorAll('.tctrls .tb');
      if(tbs.length===it.controls.length) it.controls.forEach((c,ci)=>{ const b=tbs[ci]; if(!b) return;
        b._cmd=c.cmd; b._secured=it.secured;
        const nh=svgF(ICONS[c.icon]||ICONS.info); if(b.innerHTML!==nh) b.innerHTML=nh; }); }
    if(!updateTileRing(n,it)) ok=false;   // Positionsring live nachziehen
  });
  return ok;
}
function render(){
  if(!view) return;
  // "Screen fuellen" (kein Widget in Pane 2): die KACHELZAHL wird nach rechts
  // verdoppelt -> aus 2x2 wird 2x2|2x2 = 4x2 (GLEICHE Kachelgroesse, nur mehr
  // Kacheln). Nur im Querformat (2-Pane-Tablet); das quadratische 4"-Panel
  // bleibt einspaltig. Unabhaengig vom Zoom ("Bildschirm fuellen").
  const _k = themeSplit ? paneKind(paneForTab(activeTab())) : null;   // Split aus -> nie Pane/Verdopplung
  const _widget = (_k==='player'||_k==='weather'||_k==='calendar'||_k==='energy'||_k==='camera');
  // Querformat-Entscheidung merken: beim Kiosk-Start / Auto-Reload meldet das
  // Fenster kurz eine quere Groesse, bevor die echte Flaeche steht. Der
  // resize-Handler rendert neu, sobald sie kippt (sonst bliebe das 4"-Panel in
  // der Startmessung 4x2 statt 2x2 haengen - dasselbe Muster wie beim Screensaver).
  _lastWide = window.innerWidth > window.innerHeight;
  if(themeSplit && !_widget && _lastWide){ gridCols = profCols*2; gridRows = profRows; }
  else { gridCols = profCols; gridRows = profRows; }
  document.documentElement.style.setProperty('--cols', gridCols);
  document.documentElement.style.setProperty('--rows', gridRows);
  stopVideo();
  closeMenu();
  setMore(null);
  el('conn').classList.toggle('vis', !!(view.route && view.route.view==='tab'));
  el('grid').classList.remove('panel','bigpage','anchorbot','scheme');
  el('grid').classList.toggle('list', view.layout==='list');
  const items = view.items || [];
  const g = el('grid');
  if(!items.length){ g.innerHTML='<div class="empty">nichts hier</div>'; renderTabs(); return; }
  let html='';
  let _i=-1;
  for(const it of items){
    _i++;
    const icoHtml = it.iconImg
      ? '<span class="ico"><img class="rawico" src="'+esc(it.iconImg)+'" alt=""></span>'
      : it.iconUrl
      ? '<span class="ico img" style="--u:url(\''+esc(it.iconUrl)+'\')"></span>'
      : '<span class="ico">'+svg(ICONS[it.icon]||ICONS.info)+'</span>';
    // Positionsring: nur fuer Bausteine, die eine Stellung haben. Bei 0 %
    // bleibt allein die Spur stehen - ein runder Abschluss auf der Laenge null
    // wuerde sonst als Punkt erscheinen und wie ein Fehler aussehen.
    const posv = ringPos(it);
    const icoCell = posv===null ? icoHtml
      : '<span class="icowrap"><svg class="posring" viewBox="0 0 100 100" aria-hidden="true">'+
          '<g transform="rotate(-90 50 50)">'+
            '<circle class="trk" cx="50" cy="50" r="46"/>'+
            (posv>0 ? '<circle class="val" cx="50" cy="50" r="46" stroke-dasharray="'+
              ringDash(posv)+'"/>' : '')+
          '</g></svg>'+icoHtml+'</span>';
    const chev = (it.nav && !it.controls) ? '<span class="chev">'+svg('<path d="m9 6 6 6-6 6"/>')+'</span>' : '';
    const ctrls = it.controls ? '<div class="tctrls">'+it.controls.map((c,i)=>'<span class="tb" data-c="'+i+'">'+svgF(ICONS[c.icon]||ICONS.info)+'</span>').join('')+'</div>' : '';
    const tone = tileTone(it);
    const ts=it.style||{};
    const stStr = tileVarStyle(it);
    const st = stStr?' style="'+esc(stStr)+'"':'';
    const nsv=[];
    if(ts.txt) nsv.push('color:'+ts.txt);
    if(ts.font) nsv.push('font-family:'+ts.font);
    if(ts.weight) nsv.push('font-weight:'+ts.weight);
    if(ts.italic) nsv.push('font-style:italic');
    const nst = nsv.length?' style="'+esc(nsv.join(';'))+'"':'';
    const _pg = (view.layout==='list'?4:gridCols*gridRows);   // Snap-Seite: Liste 4 Zeilen, sonst cols x rows
    html += '<div class="tile'+tone+(_i%_pg===0?' snap':'')+'" data-id="'+esc(it.id)+'"'+st+'>'+
              '<div class="head">'+icoCell+chev+'</div>'+
              '<div class="body">'+
              (it.room?'<div class="room">'+esc(it.room)+'</div>':'')+
              '<div class="name"'+nst+'>'+esc(it.label)+'</div>'+
              (it.sublabel?'<div class="sub">'+esc(it.sublabel)+'</div>':'')+'</div>'+
              ctrls+
            '</div>';
  }
  g.innerHTML = html;
  g.classList.toggle('snapy', items.length > (view.layout==='list'?4:gridCols*gridRows));   // Snapping erst ab >1 Seite
  g.querySelectorAll('.tile[data-id]').forEach(n=>{
    const it = items.find(x=>String(x.id)===n.dataset.id);
    n._it = it;   // aktuelle Daten am Knoten -> updateGrid kann sie in-place ersetzen
    if(it.controls){

let schemeFit=null;
function schemeValHtml(it,i){

function renderScheme(v){

  });

function updateScheme(v){
  const stage=el('schemeStage'); if(!stage) return false;
  const nodes=stage.querySelectorAll('.schemeval');
  const items=v.items||[];
  if(nodes.length!==items.length) return false;   // Struktur anders -> voller Neuaufbau
  items.forEach((it,i)=>{

    if(sp && sp.textContent!==(it.text||'')) sp.textContent=it.text||'';

    if(n.className!==cls){ n.className=cls;
      n.onclick=it.nav?(()=>{ if(it.nav) nav(it.nav); }):null; }
  });

function setupSchemeZoom(viewEl, stage, sw, sh){
  let scale=1, tx=0, ty=0, minScale=0.05;
  const apply=()=>{ stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; };
  const clamp=()=>{ const vw=viewEl.clientWidth, vh=viewEl.clientHeight, cw=sw*scale, ch=sh*scale;
    if(cw<=vw) tx=(vw-cw)/2; else tx=Math.min(0,Math.max(vw-cw,tx));
    if(ch<=vh) ty=(vh-ch)/2; else ty=Math.min(0,Math.max(vh-ch,ty)); };
  const fit=()=>{ const vw=viewEl.clientWidth, vh=viewEl.clientHeight; if(!vw||!vh) return;
    minScale=Math.min(vw/sw, vh/sh);              // "contain": ganzes Schema sichtbar
    scale=minScale;                               // Start: komplett eingepasst (Hoehe & Breite)
    tx=(vw-sw*scale)/2; ty=(vh-sh*scale)/2; clamp(); apply(); };
  const pts=new Map(); let lastDist=0;
  viewEl.onpointerdown=e=>{ viewEl.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastDist=0; };
  viewEl.onpointermove=e=>{ if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ tx+=e.clientX-prev.x; ty+=e.clientY-prev.y; clamp(); apply(); }
    else if(pts.size>=2){ const a=[...pts.values()], dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const rect=viewEl.getBoundingClientRect(), cx=(a[0].x+a[1].x)/2-rect.left, cy=(a[0].y+a[1].y)/2-rect.top;
      if(lastDist){ const ns=Math.max(minScale,Math.min(6,scale*(dist/lastDist)));
        tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale); scale=ns; clamp(); apply(); }
      lastDist=dist; } };
  const up=e=>{ pts.delete(e.pointerId); lastDist=0; };
  viewEl.onpointerup=up; viewEl.onpointercancel=up;
  // Doppeltipp: zwischen fit-to-width und 2.5x umschalten
  let lastTap=0;
  viewEl.addEventListener('click',e=>{ if(e.target.closest('.schemeval.tap')) return;
    const now=Date.now(); if(now-lastTap<300){ const vw=viewEl.clientWidth;
      // Doppeltipp: von "ganz sichtbar" auf fit-to-width (lesbar) zoomen, sonst zurueck
      if(scale>minScale*1.15){ fit(); } else { const rect=viewEl.getBoundingClientRect();
        const cx=e.clientX-rect.left, cy=e.clientY-rect.top, ns=Math.min(6,Math.max(vw/sw,minScale*2.5));
        tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale); scale=ns; clamp(); apply(); } }
    lastTap=now; });
  schemeFit=fit;
  // Bild kann nach dem Layout erst die richtige Groesse liefern -> nach Frame fitten
  requestAnimationFrame(fit); const img=stage.querySelector('.schemeimg'); if(img) img.onload=fit;
}

let booted=false;
const PANEL_ID = new URLSearchParams(location.search).get('panel') || '';
// Geraete-Kennung (physisches Panel). Darueber adressiert der Server dieses

// Einstellungen -> Panels. Quelle: ?device=<name> in der Kiosk-URL, sonst ein
// unter Einstellungen -> Panels vergebener Name (t:'setdevice', localStorage).

// Der Wert wird gemerkt (localStorage) und gilt dann auch ohne Parameter weiter.
(function(){

// Der gemerkte Geraetewert muss NACH den Theme-Variablen erneut gesetzt werden:
// seit die Strichstaerke auch aus der Konfiguration kommt, schickt der Server
// --posring-w mit, und der Theme-Push wuerde den Live-Test sonst ueberschreiben.
// Der Wert am Geraet gewinnt - genau das ist der Zweck des Reglers.
function posringOverride(){

function connect(){
  const q=[];
  if(PANEL_ID) q.push('panel='+encodeURIComponent(PANEL_ID));
  if(DEVICE_ID) q.push('device='+encodeURIComponent(DEVICE_ID));
  if(kiosk()) q.push('kiosk=fully');   // Kiosk-App melden -> Typ in der Geraeteliste
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'
                   +(q.length?('?'+q.join('&')):''));
  // Erststart: Startseite kommt vom Server (erster Tab des Profils). Nach einem
  // Reconnect stattdessen die zuletzt betrachtete Seite wiederherstellen.
  ws.onopen=()=>{ el('conn').classList.add('ok'); if(booted) send({t:'nav',route:stack[stack.length-1]}); };
  ws.onclose=()=>{ el('conn').classList.remove('ok'); setTimeout(connect,1500); };
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.t==='theme'){ const v=msg.vars||{}; for(const k in v){ if(v[k]) document.documentElement.style.setProperty(k,v[k]); }
      posringOverride();      // ?ring= am Geraet schlaegt die Konfiguration
      profCols = (v['--cols']?(parseInt(v['--cols'])||2):2);
      profRows = (v['--rows']?(parseInt(v['--rows'])||2):2);
      gridCols = profCols; gridRows = profRows;
      panesCfg = (msg.panes && typeof msg.panes==='object') ? msg.panes : {};
      themeFill = !!msg.fill;
      themeSplit = (msg.split !== false);   // Default an; nur explizit aus (4"-Panel)
      if(saverOn()) applySaverSplit();      // Split-Erlaubnis kann sich geaendert haben -> Screensaver-Spaltigkeit nachziehen
      if(msg.lang){ LANG=msg.lang; tickClock(); }   // Panel-Sprache -> Datum/Uhr sofort aktualisieren
      if(msg.title) document.title=msg.title;
      if(msg.tabMeta) tabMeta=msg.tabMeta;
      if(msg.night){ NIGHT.dim=+msg.night.dim||0; NIGHT.wake=+msg.night.wake||0; setNight(msg.night.on); }
      if(Array.isArray(msg.tabs)&&msg.tabs.length) tabsCfg=msg.tabs;
      applyDisplayCfg(msg);   // Display aus / Auto-Neustart ohne Agent (Kiosk-App)
      renderTabs(); return; }
    if(msg.t==='ring'){ if(msg.id){ wake(); nav({view:'control',id:msg.id}); } return; }   // Klingel: Display an, Uhr weg
    if(msg.t==='alarm'){ if(msg.on){ wake(); startAlarmTone(); if(msg.id) nav({view:'control',id:msg.id}); } else { stopAlarmTone(); } return; }
    if(msg.t==='testtone'){ playTestTone(); return; }
    if(msg.t==='front'){ frontData=msg; renderFront(); if(FRONT_TEST) renderFrontRich(el('frontPage')); applyPane(); return; }   // Kalender/Wetter fuer die Uhr-Seite
    if(msg.t==='player'){ renderPlayer(msg.blocks); return; }   // fester Player im Split-Layout
    if(msg.t==='energy'){ energyData=msg; const fp=el('frontpane'); if(fp && paneKind(paneForTab(activeTab()))==='energy') renderEnergyPane(fp); return; }   // Energiefluss-Pane
    if(msg.t==='camera'){ cameraData=msg; const fp=el('frontpane'); if(fp && paneKind(paneForTab(activeTab()))==='camera') renderCameraPane(fp); return; }   // Kamera-Pane (Intercom-Vollansicht)
    if(msg.t==='switch'){ if(msg.panel!==undefined){ const u=new URL(location.href);
        if(msg.panel) u.searchParams.set('panel',msg.panel); else u.searchParams.delete('panel');
        location.replace(u.toString()); } return; }   // Betriebsmodus -> Profil live wechseln
    if(msg.t==='reload'){ location.reload(); return; }                       // Server -> Panel neu laden
    if(msg.t==='night'){ setNight(msg.on); return; }                         // Tag/Nacht gewechselt
    if(msg.t==='goto'){ if(msg.route){ wake(); nav(msg.route); } return; }  // auf Seite springen
    if(msg.t==='notify'){ wake(); showNotify(msg.text, msg.level, msg.secs); return; }  // Nachricht einblenden
    if(msg.t==='display'){ if(msg.on) wake(); else screenOff(); return; }   // Server schaltet Display (Kiosk-App)
    if(msg.t==='setdevice'){ if(msg.name){ try{ localStorage.setItem('lp_device', msg.name); }catch(e){}
        DEVICE_ID=msg.name; ws.close(); } return; }   // in den Einstellungen benannt -> mit Kennung neu verbinden
    if(msg.t==='cmdresult'){ if(msg.ok===false && pendingSecure){ const p=pendingSecure; pendingSecure=null; doSecure(p.uuid,p.cmd,'PIN falsch – nochmal'); } else pendingSecure=null; return; }
    if(msg.t!=='view') return;
    if(!booted){ booted=true; if(msg.route&&msg.route.view==='tab') stack=[msg.route]; }
    if(msg.layout==='scheme'){
      const sameS = view && key(view.route)===key(msg.route) && el('grid').classList.contains('scheme');
      view=msg;
      if(!(sameS && updateScheme(msg))) renderScheme(msg);   // gleiche Seite: nur Werte patchen (Zoom bleibt)
      return;
    }
    const same = view && key(view.route)===key(msg.route);
    if(msg.blocks){
      view=msg;
      if(same && el('grid').classList.contains('panel')) updatePanel(msg.blocks);
      else renderPanel(msg.blocks);
    } else {
      const st=same?g.scrollTop:0;
      view=msg;
      // Gleiche Kachel-Seite: nur die veraenderlichen Teile patchen (kein
      // innerHTML-Neuaufbau -> kein Flackern/Neuladen der Icons, z.B. Fully Kiosk).
      // Struktur geaendert (andere/mehr Kacheln) -> voller Neuaufbau.
      if(!(same && updateGrid(view.items||[]))){ render(); g.scrollTop=st; }
    }
  };
}

// Zeichnet den Stunden-Temperaturverlauf als Inline-SVG (Regenband + Kurve),
// Vorschaukarten mit Regenwahrscheinlichkeit und die Termine als Tages-Agenda.
function fpCurve(hourly){
  const pts=hourly.filter(h=>h && h.temp!=null);
  if(pts.length<2) return '';
  const W=700,H=150,padT=24,padB=32,padX=12,n=pts.length;
  const temps=pts.map(p=>p.temp);
  let mn=Math.min(...temps), mx=Math.max(...temps);
  if(mx-mn<4){ const c=(mx+mn)/2; mn=c-2; mx=c+2; }
  const X=i=> padX + i*(W-2*padX)/(n-1);
  const Y=t=> padT + (mx-t)*(H-padT-padB)/(mx-mn);
  const barW=Math.max(3,(W-2*padX)/n*0.55);
  const bars=pts.map((p,i)=>{ if(p.pop==null||p.pop<=0) return '';
    const bh=(p.pop/100)*(H-padB-padT)*0.55;
    return '<rect x="'+(X(i)-barW/2).toFixed(1)+'" y="'+(H-padB-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="#7fb2e6" opacity=".2"/>'; }).join('');
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.temp).toFixed(1)).join(' ');
  const area=X(0).toFixed(1)+','+(H-padB)+' '+line+' '+X(n-1).toFixed(1)+','+(H-padB);
  let lbl='';
  pts.forEach((p,i)=>{ if(i%3===0||i===n-1){
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="fpx">'+p.h+'</text>';
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.temp)-9).toFixed(1)+'" text-anchor="middle" class="fpt">'+p.temp+'°</text>'; }});
  return '<svg viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="fpgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
    bars+
    '<polygon points="'+area+'" fill="url(#fpgrad)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(0).toFixed(1)+'" cy="'+Y(pts[0].temp).toFixed(1)+'" r="4" fill="currentColor"/>'+
    lbl+'</svg>';
}

function energyInner(d){

    const ang=-Math.PI/2 + i*2*Math.PI/N, nx=C+R*Math.cos(ang), ny=C+R*Math.sin(ang);

function fpMonthHTML(events, holidays){
