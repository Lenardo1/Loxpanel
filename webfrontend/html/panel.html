<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iOS/iPadOS: als Web-App vom Home-Bildschirm im Vollbild starten (Safari-
     Lesezeichen "Als Web-App oeffnen"). Ohne diese Angaben laeuft die Seite
     dort in einem Fenster mit Browser-Leisten und meldet zunaechst eine
     falsche Flaeche. viewport-fit=cover zieht die Visu unter die Geraete-
     Raender; die Tab-Leiste weicht dem Home-Balken (safe-area unten). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoxPanel">
<meta name="theme-color" content="#0d120e">
<title>LoxPanel</title>
<link rel="stylesheet" href="/panel/grund.css">
<link rel="stylesheet" href="/panel/seiten.css">
</head>
<body>
<div class="screen">
  <div class="verbindung" id="verbindung" role="status" hidden><div class="vb-flaeche"><span class="vb-titel"></span><span class="vb-stand"></span></div></div>
  <div class="playerpane" id="playerpane"></div>
  <div class="frontpane" id="frontpane"></div>
  <div class="kopfzeile" id="kopfzeile" hidden></div>
  <div class="werteleiste" id="werteleiste" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="tabs" id="tabs"></div>
  <div class="saver hidden" id="saver">
    <div class="sv-wrap">
      <div class="sv-wx" id="svWx" hidden></div>
      <div class="sv-clock">
        <div class="sv-time" id="svTime">--:--</div>
        <div class="sv-date" id="svDate"></div>
      </div>
      <div class="sv-cal" id="svCal" hidden></div>
      <div class="sv-box" id="svBox" hidden></div>
      <div class="sv-hint">Zum Öffnen tippen</div>
    </div>
    <div class="sv-nacht" id="svNacht" hidden><div class="nu-zonen" id="nuZonen"></div><div class="nu-zeit" id="nuZeit">--:--</div></div>
  </div>
  <div class="frontpage hidden" id="frontPage"></div>
  <div class="einrichtung hidden" id="einrichtung"></div>
  <div class="einrichtung kopplung hidden" id="kopplung"></div>
</div>
<div class="entwurfmarke hidden" id="entwurfMarke"></div>

<script src="/raster.js"></script>
<script src="/panel/kern.js"></script>
<script src="/panel/bedienung.js"></script>
<script src="/panel/kacheln.js"></script>
<script src="/panel/seiten.js"></script>
<script src="/panel/kachelfeld.js"></script>
<script src="/panel/gesten.js"></script>
<script src="/panel/verbindung.js"></script>
<script src="/panel/front.js"></script>
<script src="/panel/haus.js"></script>
<script src="/panel/startseite.js"></script>
<script src="/panel/display.js"></script>
<script src="/panel/start.js"></script>
</body>
</html>
