// ---- Befehle und Visu-PIN (gesicherte Bausteine, isSecured) ----
// Jeder Befehl geht ueber sendCmd(); nur cmdSchicken() baut {t:'cmd'}. Bei
// einem gesicherten Baustein fragt die Visu die PIN ab und schickt sie mit,
// der Server rechnet daraus den Hash fuer sps/ios. Bestaetigt der Miniserver
// sie (cmdresult ok), gilt sie pinMerkenS Sekunden weiter (Panel-Einstellung
// "PIN merken", 0 = jedes Mal fragen) - nur im Speicher und nur auf der Seite,
// auf der sie eingegeben wurde. Uhr-Seite, Display aus und Seitenwechsel
// vergessen sie sofort (pinVergessen).
let pinMerkenS=0;        // kommt mit dem theme; bis dahin jedes Mal fragen
let pinMerk=null, pinMerkT=null;   // bestaetigte PIN {pin, seite, bis}
let pinWarten=[];        // gesicherte Befehle, deren cmdresult aussteht
let pinJobs=null;        // Befehle, die auf die offene PIN-Abfrage warten
function cmdSchicken(uuid,cmd,pin){ const m={t:'cmd',uuid,cmd}; if(pin!=null) m.pin=pin; send(m); }
// Seite = oberster Eintrag von stack, nicht view.route: nav() legt ihn sofort
// ab, die neue Ansicht schickt der Server aber erst nach dem cmdresult eines
// laufenden Befehls (er arbeitet die Nachrichten eines Panels der Reihe nach ab)
function pinSeite(){ return key(stack[stack.length-1]); }
function pinGemerkt(){
  if(pinMerk && (Date.now()>=pinMerk.bis || pinMerk.seite!==pinSeite())) pinMerk=null;
  return pinMerk ? pinMerk.pin : null; }
function pinVergessen(){ pinMerk=null; clearTimeout(pinMerkT);
  // eine offene Abfrage gehoert zur alten Seite: zu, ihre Befehle gelten als abgebrochen
  const s=document.querySelector('.screen'), ov=s&&s.querySelector('.pinov'); if(ov) ov.remove();
  const jobs=pinJobs; pinJobs=null; if(jobs) jobs.forEach(j=>{ if(j.abbruch) j.abbruch(); }); }
function askPin(cb,msg){
  const s=document.querySelector('.screen'); let ov=s.querySelector('.pinov'); if(ov)ov.remove();
  ov=document.createElement('div'); ov.className='pinov';
  let val='';
  const keys=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  ov.innerHTML='<div class="pinbox"><div class="pinttl">PIN / Passwort</div>'+
    '<div class="pindisp" id="pindisp"></div>'+
    '<div class="pinmsg">'+(msg||'')+'</div>'+
    '<div class="pinpad">'+keys.map(k=>{
      const cls='pinkey'+(k==='ok'?' ok':'')+(k==='del'?' del':'');
      const lbl=k==='del'?'⌫':(k==='ok'?'OK':k);
      return '<div class="'+cls+'" data-k="'+k+'">'+lbl+'</div>';
    }).join('')+'</div>'+
    '<div class="pinbtn cancel">Abbrechen</div></div>';
  s.appendChild(ov);
  const disp=ov.querySelector('#pindisp');
  const draw=()=>{ disp.textContent='•'.repeat(val.length); };
  const done=v=>{ ov.remove(); cb(v); };
  ov.querySelectorAll('.pinkey').forEach(b=>{ b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='ok') done(val);
    else if(k==='del'){ val=val.slice(0,-1); draw(); }
    else if(val.length<12){ val+=k; draw(); }
  };});
  ov.querySelector('.cancel').onclick=()=>done(null);
}
// Ist die Abfrage schon offen, gilt die eine PIN fuer alle wartenden Befehle.
function pinAbfragen(job,msg){
  if(pinJobs){ pinJobs.push(job); const m=document.querySelector('.screen .pinov .pinmsg'); if(m&&msg) m.textContent=msg; return; }
  pinJobs=[job];
  askPin(pin=>{ const jobs=pinJobs||[]; pinJobs=null;
    if(pin==null){ jobs.forEach(j=>{ if(j.abbruch) j.abbruch(); }); return; }
    jobs.forEach(j=>pinSenden(j,pin,true,false)); }, msg);
}
// Mit PIN schicken. neu: eben eingegeben (gemerkt, sobald bestaetigt). Eine
// Halten-Taste (job.los): mit gemerkter PIN echtes Halten, das Loslassen
// schickt endHold mit derselben PIN; nach der Abfrage ist der Finger laengst
// oben, dann folgt es sofort (wirkt wie ein Tipp). Nie Druecken ohne Loslassen.
// seite: die des Tipps (job.seite), nicht die der Eingabe - job.ok und das
// Merken gelten nur dort, auch fuer die Wiederholung nach abgelehnter PIN.
function pinSenden(job,pin,neu,halten){
  const w={job,pin,neu,seite:job.seite};
  pinWarten.push(w); cmdSchicken(job.uuid,job.cmd,pin);
  if(!job.los) return;
  const los={job:job.los,pin,seite:w.seite,zu:w};
  if(halten) holdRelease=los; else { pinWarten.push(los); cmdSchicken(los.job.uuid,los.job.cmd,pin); }
}
function pinErgebnis(msg){
  const i=pinWarten.findIndex(w=>w.job.uuid===msg.uuid && w.job.cmd===msg.cmd); if(i<0) return;
  const w=pinWarten.splice(i,1)[0];
  if(msg.ok){
    if(w.neu && pinMerkenS>0 && w.seite===pinSeite()){
      pinMerk={pin:w.pin, seite:w.seite, bis:Date.now()+pinMerkenS*1000};
      clearTimeout(pinMerkT); pinMerkT=setTimeout(()=>{ pinMerk=null; }, pinMerkenS*1000); }
    if(w.job.ok && w.seite===pinSeite()) w.job.ok();
    return; }
  w.fehl=true; pinMerk=null;      // abgelehnt: auch eine gemerkte PIN gilt nicht mehr
  if(w.zu && w.zu.fehl) return;   // Loslassen zu abgelehntem Druecken: die neue Abfrage schickt beide
  // Seite inzwischen gewechselt: keine Abfrage fuer einen fremden Befehl, abgebrochen
  if(w.seite!==pinSeite()){ if(w.job.abbruch) w.job.abbruch(); return; }
  pinAbfragen(w.job, msg.code==null ? 'Miniserver antwortet nicht – nochmal' : 'PIN falsch – nochmal');
}
// opt.los: Loslassen einer Halten-Taste; opt.ok: danach (etwa zurueck), bei
// PIN erst nach der Bestaetigung und nur noch auf derselben Seite;
// opt.abbruch: PIN abgebrochen oder Verbindung gesperrt (Anzeige zurueck).
function sendCmd(uuid,cmd,secured,opt){ opt=opt||{};
  // Ohne bestaetigte Verbindung nichts schicken: Anzeige zurueck, Leiste sofort
  if(verbindungGesperrt()){ if(opt.abbruch) opt.abbruch(); verbindungZeigen(true); return; }
  const job={uuid,cmd,los:opt.los||null,ok:opt.ok||null,abbruch:opt.abbruch||null,seite:pinSeite()};
  if(!secured){ cmdSchicken(uuid,cmd,null); if(job.los) holdRelease={job:job.los,pin:null}; if(job.ok) job.ok(); return; }
  const pin=pinGemerkt();
  if(pin==null) pinAbfragen(job,''); else pinSenden(job,pin,false,true);
}
const SLD_STEP=5;   // Schrittweite der -/+ Tasten am Schieberegler (Lautstaerke etc.)
// Fuellstand der Leiste als CSS-Var --p (Prozent) setzen -> gefuellte Anzeige
// unabhaengig vom nativen accent-color-Rendering des jeweiligen WebViews.
function sldFill(sld){ if(!sld)return;
  const min=+sld.min||0, max=(sld.max!==''?+sld.max:100);
  const p=max>min?((+sld.value-min)/(max-min))*100:0;
  sld.style.setProperty('--p', Math.max(0,Math.min(100,p))+'%'); }
// Nachkommastellen einer Zahl (0.5 -> 1, 5 -> 0)
function stellen(x){ const s=String(Math.abs(+x)), i=s.indexOf('.'); return i<0?0:s.length-i-1; }
// Auf die Stellen der Schrittweite runden: 0,5er-Schritte bleiben 0,5er-Schritte
// (frueher Math.round: 20 + 0,5 ergab 21), Rechenreste wie 20.000000000000004
// fallen weg.
function nudgeSld(sld,delta,valEl,secured,abbruch){ if(!sld)return;
  const min=+sld.min||0, max=(sld.max!==''?+sld.max:100);
  let v=+((+sld.value||0)+delta).toFixed(stellen(delta)); v=Math.max(min,Math.min(max,v));
  if(v===(+sld.value)) return;
  sld.value=v; sldFill(sld); if(valEl) valEl.textContent=v;
  if(sld._uuid&&sld._tmpl) sendCmd(sld._uuid,sld._tmpl.replace('{v}',v),secured,{abbruch}); }

const ZELLE_BESTAETIGEN_MS = 4000;
function zelleTippen(g,btn){
  if(btn._nav){ nav(btn._nav); return; }
  if(btn._confirm && !btn._armed){
    btn._armed=true; btn._label=btn.textContent; btn.textContent=btn._confirm; btn.classList.add('arm');

// ---- Formular (Weckzeit bearbeiten) ----
// Felder tragen data-f (Name in der Befehlsvorlage). "Speichern" (form) setzt
// ihre Werte ein: Text URL-kodiert, Uhrzeit in Sekunden ab Mitternacht,
// Auswahl als Liste mit Komma. Ein leeres Feld oder keine Auswahl sperrt den
// Knopf. Die Werte gehoeren der Visu, bis gespeichert ist: Ein Update vom
// Server aendert sie nicht (blockSig ohne Werte).
function formWerte(g){ const w={};
  g.querySelectorAll('[data-f]').forEach(e=>{ const n=e.dataset.f;
    if(e.tagName==='INPUT') w[n]=encodeURIComponent(e.value.trim());
    else if(e.classList.contains('tpk')) w[n]=String(+e.dataset.v||0);
    else if(e.classList.contains('chipset')) w[n]=[...e.querySelectorAll('.chp.on')].map(c=>c.dataset.v).join(',');
  });

function formBefehl(g,form){ const w=formWerte(g); let cmd=form.tmpl;

// Taste mit Wiederholung: ein Schritt sofort, nach TASTE_HALTEN_MS gedrueckt
// alle TASTE_TAKT_MS einer.
const TASTE_HALTEN_MS = 450, TASTE_TAKT_MS = 110;
function wiederholen(btn,fn){
  let t1=null, t2=null;
  const stop=()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; };
  btn.addEventListener('pointerdown',ev=>{ ev.preventDefault(); stop(); fn();
    t1=setTimeout(()=>{ t2=setInterval(()=>{ if(btn.isConnected) fn(); else stop(); },TASTE_TAKT_MS); },TASTE_HALTEN_MS); });

function zeitSchritt(t,u,d){
  const s=+t.dataset.v||0; let h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  if(u==='h') h=(h+d+24)%24; else m=(m+d+60)%60;
  t.dataset.v=h*3600+m*60;
  const p=n=>String(n).padStart(2,'0'), v=t.querySelectorAll('.tpv'); v[0].textContent=p(h); v[1].textContent=p(m); }

// ---- Wert mit -/+ (Laufzeit einer Zone, Dauern des Weckers) ----
// Die Visu zaehlt selbst weiter und schickt den Wert erst, wenn STP_SENDEN_MS
// lang niemand tippt: Beim Durchtippen kommt so ein Befehl an statt zehn, und
// kein Tipp geht verloren, weil die Antwort des Miniservers noch aussteht.
// Bis STP_HALTEN_MS nach dem letzten Tipp zeigt sie ihren eigenen Wert.
const STP_SENDEN_MS = 900, STP_HALTEN_MS = 3000;
function dauerText(s){ s=Math.max(0,Math.round(+s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  if(!s) return '0 min'; if(h) return h+' h'+(m?' '+m+' min':''); if(m) return m+' min'+(r?' '+r+' s':''); return r+' s'; }
function stpText(b,v){ return b.fmt==='dauer' ? dauerText(v) : b.fmt==='prozent' ? v+' %' : String(v); }
function stepperBind(e,b){ e._b=b; e._v=+b.value||0;
  e.querySelectorAll('.sbtn[data-st]').forEach(btn=>wiederholen(btn,()=>{
    const bb=e._b, d=+btn.dataset.st, st=+bb.step||1;
    const mn=bb.min!=null?+bb.min:-Infinity, mx=bb.max!=null?+bb.max:Infinity;
    // Liegt der Wert schon ausserhalb der Grenzen, fuehrt ein Schritt nie weiter hinaus
    let v=e._v+d*st;
    v=d<0 ? Math.max(v,Math.min(mn,e._v)) : Math.min(v,Math.max(mx,e._v));
    if(v===e._v) return;
    e._v=v; e._lokal=Date.now(); e.querySelector('.stpv').textContent=stpText(bb,v);
    clearTimeout(e._senden);
    e._senden=setTimeout(()=>{ e._senden=null; const c=e._b.cmd;
      if(c) sendCmd(c.uuid,c.tmpl.split('{v}').join(String(e._v)),view&&view.secured,
                    {abbruch:()=>{ e._lokal=0; stepperUpdate(e,e._b); }}); },STP_SENDEN_MS);
  }));
}
function stepperUpdate(e,b){ e._b=b;
  if(e._senden || (e._lokal && Date.now()-e._lokal<STP_HALTEN_MS)) return;
  e._v=+b.value||0; e.querySelector('.stpv').textContent=stpText(b,e._v); }

function bildZeigen(it){ const s=document.querySelector('.screen'); if(!s) return;

// Auswahl-Popup ueber einem Button (Klima Modus/Fan): oeffnet nach oben, Tipp
// daneben schliesst. Auswahl sendet den Befehl und schliesst.
// Verhaeltnis sichtbare Groesse / Layout-Groesse eines Elements. Ist die Visu
// skaliert (transform am .screen), liefern getBoundingClientRect und Pointer-
// Koordinaten SICHTBARE Pixel, offsetWidth/clientWidth und CSS-Werte aber
// LAYOUT-Pixel. Wer beides verrechnet, teilt Sichtbares hierdurch. Am Element
// selbst gemessen statt aus einer Variablen gelesen: stimmt so fuer jede Art
// der Skalierung, auch fuer kuenftige.
function visScale(e){ const w=e&&e.offsetWidth; return w ? (e.getBoundingClientRect().width/w)||1 : 1; }
function openMenu(btn, items){
  const s=document.querySelector('.screen'); if(!s)return;
  closeMenu();
  const ov=document.createElement('div'); ov.className='menuov';
  const box=document.createElement('div'); box.className='menubox';
  box.innerHTML=items.map((it,i)=>'<div class="menuitem'+(it.on?' on':'')+'" data-m="'+i+'">'+esc(it.label)+'</div>').join('');
  ov.appendChild(box); s.appendChild(ov);
  // Rects sind SICHTBARE Pixel, style.left/bottom LAYOUT-Pixel: bei skalierter
  // Visu erst umrechnen, sonst sitzt das Menue neben seinem Button.
  const br=btn.getBoundingClientRect(), sr=s.getBoundingClientRect(), k=visScale(s);
  let left=(br.left-sr.left)/k;
  left=Math.max(8, Math.min(left, s.offsetWidth-box.offsetWidth-8));
  box.style.left=left+'px';
  box.style.bottom=((sr.height-(br.top-sr.top))/k+6)+'px';   // ueber dem Button
  box.querySelectorAll('.menuitem').forEach(n=>{
    n.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation();
      const it=items[+n.dataset.m]; closeMenu();
      if(it&&it.cmd) sendCmd(it.cmd.uuid,it.cmd.cmd,view&&view.secured); });
  });
  ov.addEventListener('pointerdown',()=>closeMenu());
}
// Struktur-Signatur der Bloecke: Art und Reihenfolge, dazu die Zaehlungen, die
// die Anzeige formen. Weicht sie vom zuletzt Gerenderten ab, muss komplett neu
// aufgebaut werden — in-place patchen wuerde neu dazugekommene Zeilen nie
// erzeugen (z.B. "Wasser nachfuellen" in der Sauna) und weggefallene stehen
// lassen. Bei den Favoriten zaehlt der Inhalt (Name, Cover, Befehl): updatePanel
// patcht sie nicht, und der Tipp haelt den Favoriten vom Aufbau fest.
function blockSig(blocks){
  return intercomBlocks(blocks).filter(b=>b.k!=='more').map(b=>
    b.k==='row' ? 'row'+b.cells.length+(b.hidden?'h':'')
    : b.k==='favs' ? 'favs'+JSON.stringify((b.items||[]).map(f=>[f.label,f.cover,f.cmd]))
    : b.k==='alarmlist' ? 'alarm'+JSON.stringify(b.entries||[])
    : b.k==='astat' ? 'astat'+(b.sub?1:0)
    : b.k==='stepper' ? 'stp'+(b.cmd?1:0)+(b.sub?1:0)
    : b.k==='chips' ? 'chips'+(b.multi?'m':'')+(b.items?b.items.length:0)
    : b.k==='gallery' ? 'gal'+(b.items||[]).map(i=>i.src).join(',')
    : b.k==='intercom-talk' ? 'intercom-talk'+b.uuid
    : b.k).join('|');
}
// ---- Verlaufs-Diagramme (Block k:'chart'). Die Daten stammen aus den
// Statistik-Dateien des Miniservers und kommen fertig aufbereitet vom Server.
// Zeitstempel sind Wanduhr-Sekunden der Anlage, als UTC gefuehrt: mit getUTC*
// formatiert zeigt jedes Panel dieselbe Uhrzeit wie der Miniserver, egal in
// welcher Zeitzone der Browser laeuft. Farben per style, weil var() in
// SVG-Praesentationsattributen nicht ueberall greift.
const CH_COLORS=['var(--accent)','var(--glow)','var(--crit)','var(--muted)'];
function chNum(v,dec){ return (+v).toFixed(dec).replace('.',','); }
function chTime(t,span){ const d=new Date(t*1000), p=n=>String(n).padStart(2,'0');
  return span<=129600 ? p(d.getUTCHours())+':'+p(d.getUTCMinutes()) : p(d.getUTCDate())+'.'+p(d.getUTCMonth()+1)+'.'; }
function chDur(sec){ const h=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return h ? h+' h'+(m?' '+m+' min':'') : m+' min'; }
// Runde Zeitpunkte fuer die Zeitachse: der kleinste Abstand aus der Liste, der
// hoechstens 5 Beschriftungen ergibt (24 h -> alle 6 h, 7 Tage -> jeden 2. Tag,
// 30 Tage -> woechentlich). Die Sekunden sind Wanduhrzeit, t % Tag = 0 ist also
// Mitternacht; Wochen beginnen am Montag (der 1.1.1970 war ein Donnerstag).
function chTicks(t0,t1){
  const H=3600, D=86400;
  for(const st of [H,3*H,6*H,12*H,D,2*D,7*D]){
    const off=st===7*D?4*D:0, first=Math.ceil((t0-off)/st)*st+off;
    if(Math.floor((t1-first)/st)+1<=5){ const out=[]; for(let t=first;t<=t1;t+=st) out.push(t); return {ticks:out, day:st>=D}; }
  }
  return {ticks:[t0,t1], day:true};
}
let chSeq=0;
function paintChart(box,b){
  box.querySelectorAll('[data-rng]').forEach(c=>c.classList.toggle('on',c.dataset.rng===b.range));
  const body=box.querySelector('.chbody'); if(!body) return;
  if(b.state!=='ok'){
    body.innerHTML='<div class="chmsg">'+(b.state==='loading'?'Verlauf wird geladen …'
      :b.state==='error'?'Verlauf nicht abrufbar':'Keine Aufzeichnung in diesem Zeitraum')+'</div>';
    return; }
  const W=440,H=150,pL=36,pR=10,pT=10,pB=22, t0=b.t0, t1=b.t1, span=Math.max(1,t1-t0);
  const unit=b.unit?(' '+b.unit):'', dec=Math.max(0,...b.series.map(s=>s.dec||0));
  const vals=b.series.flatMap(s=>s.pts.map(p=>p[1]));
  let lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):1, mn, mx;
  if(b.kind==='digital'){ mn=-0.08; mx=1.08; }
  else if(b.kind==='counter'){ lo=0; if(hi<=0) hi=1; mn=0; mx=hi*1.08; }
  else { if(hi-lo<1e-9){ lo-=1; hi+=1; } const pd=(hi-lo)*0.1; mn=lo-pd; mx=hi+pd; }
  const X=t=>pL+(t-t0)*(W-pL-pR)/span, Y=v=>pT+(mx-v)*(H-pT-pB)/(mx-mn), f=n=>n.toFixed(1);
  const id='chg'+(++chSeq), c0=CH_COLORS[0];
  let s='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+c0+';stop-opacity:.28"/>'+
        '<stop offset="1" style="stop-color:'+c0+';stop-opacity:0"/></linearGradient></defs>';
  const yt=b.kind==='digital'?[[0,'Aus'],[1,'Ein']]:[lo,(lo+hi)/2,hi].map(v=>[v,chNum(v,dec)]);
  yt.forEach(([v,l])=>{ s+='<line class="chgrid" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+f(Y(v))+'" y2="'+f(Y(v))+'"/>'+
    '<text class="chax" x="2" y="'+f(Y(v)+4)+'" text-anchor="start">'+esc(l)+'</text>'; });
  const tk=chTicks(t0,t1);
  tk.ticks.forEach(t=>{ const x=X(t), a=x<pL+18?'start':(x>W-pR-18?'end':'middle');
    s+='<line class="chvgrid" x1="'+f(x)+'" x2="'+f(x)+'" y1="'+pT+'" y2="'+(H-pB)+'"/>'+
       '<text class="chax" x="'+f(x)+'" y="'+(H-6)+'" text-anchor="'+a+'">'+chTime(t,tk.day?Infinity:0)+'</text>'; });
  const leg=[];
  b.series.forEach((se,si)=>{
    const col=CH_COLORS[si%CH_COLORS.length], p=se.pts; if(!p.length) return;
    let info='';
    if(b.kind==='counter'){           // Verbrauch je Stunde/Tag als Balken, mehrere Reihen nebeneinander
      const nS=b.series.length;
      p.forEach(([t,v],i)=>{ const x0=X(t), x1=i+1<p.length?X(p[i+1][0]):W-pR, g=Math.min(3,(x1-x0)*0.15),
          bw=Math.max(1,(x1-x0-2*g)/nS), y=Y(v);
        s+='<rect x="'+f(x0+g+si*bw)+'" y="'+f(y)+'" width="'+f(bw)+'" height="'+f(Math.max(0,Y(0)-y))+
           '" rx="2" style="fill:'+col+'"/>'; });
      info='Summe <b>'+chNum(p.reduce((a,q)=>a+q[1],0),se.dec)+unit+'</b>';
    } else if(b.kind==='digital'){    // Stufen, dazu die Ein-Dauer im Zeitraum
      let d='M'+f(X(p[0][0]))+' '+f(Y(p[0][1])), on=0;
      p.forEach(([t,v],i)=>{ const tn=i+1<p.length?p[i+1][0]:t1;
        if(v>=0.5) on+=Math.max(0,tn-t);
        d+=' H'+f(X(tn))+(i+1<p.length?' V'+f(Y(p[i+1][1])):''); });
      s+='<path d="'+d+' V'+f(Y(0))+' H'+f(X(p[0][0]))+' Z" style="fill:'+col+';opacity:.22"/>'+
         '<path d="'+d+'" style="fill:none;stroke:'+col+';stroke-width:2;stroke-linejoin:round"/>';
      info='Ein <b>'+chDur(on)+'</b>';
    } else {                          // Linie, erste Reihe mit Verlaufsflaeche
      const line=p.map(([t,v])=>f(X(t))+','+f(Y(v))).join(' ');
      if(si===0) s+='<polygon points="'+f(X(p[0][0]))+','+f(Y(mn))+' '+line+' '+f(X(p[p.length-1][0]))+','+f(Y(mn))+'" fill="url(#'+id+')"/>';
      s+='<polyline points="'+line+'" style="fill:none;stroke:'+col+';stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>';
      const q=p[p.length-1]; s+='<circle cx="'+f(X(q[0]))+'" cy="'+f(Y(q[1]))+'" r="3.5" style="fill:'+col+'"/>';
      const vs=p.map(q=>q[1]);
      info='min <b>'+chNum(Math.min(...vs),se.dec)+'</b> · max <b>'+chNum(Math.max(...vs),se.dec)+unit+'</b>';
    }
    leg.push('<span><span class="chdot" style="background:'+col+'"></span>'+esc(se.name)+' · '+info+'</span>');
  });
  body.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+s+'</svg><div class="chleg">'+leg.join('')+'</div>';
}
// Rahmen eines Diagramms (Detailseite und Verlaufs-Pane); die Zeitraum-Knoepfe
// traegt nur das erste Diagramm einer Seite (b.ranges).
function chartBoxHtml(b,withRange){
  if(withRange===undefined) withRange=true;   // Stapel-Pane zeigt die Knoepfe nur einmal oben
  return '<div class="chart" data-chart>'+((withRange&&b.ranges)?'<div class="chrng">'+
    b.ranges.map(r=>'<button type="button" class="chip" data-rng="'+esc(r[0])+'">'+esc(r[1])+'</button>').join('')+
    '</div>':'')+'<div class="chbody"></div></div>';
}
// Verlaufs-Pane im Split-Layout: Name und aktueller Wert, darunter die Diagramme
// wie auf der Detailseite. Neu aufgebaut nur, wenn sich Baustein oder Aufbau
// aendern, sonst nur neu gezeichnet. Die Zeitraum-Knoepfe melden den Zeitraum
// dem Server neu (setchart), statt wie auf der Detailseite die Route zu ersetzen:
// links bleibt die Kachelseite stehen.
function renderChartPane(elc){ if(!elc) return;
  // Verlaufs-Pane zeigt einen oder mehrere Bausteine gestapelt (Server:
  // {t:'chart', charts:[{control,name,value,blocks}], range, ranges}). Welche
  // Bausteine, meldet applyPane() dem Server per setchart; der Push landet in
  // chartData. Ab zwei Bausteinen scrollt die Pane (.stack), sonst "fit" wie bisher.
  const d=(chartData && Array.isArray(chartData.charts)) ? chartData : null;
  const charts=d ? d.charts : [];
  const multi=charts.length>1;
  const sig=(d?d.controls.join(','):'-')+'|'+(d?d.range:'')+'|'+
            charts.map(c=>(c.blocks||[]).length).join('.');
  let page=elc.querySelector('.fp-page.cpage');
  if(!page || page.dataset.sig!==sig){
    const rngRow=(d && d.ranges && d.ranges.length)
      ? '<div class="chrng cpr">'+d.ranges.map(r=>'<button type="button" class="chip'+
          (r[0]===d.range?' on':'')+'" data-rng="'+esc(r[0])+'">'+esc(r[1])+'</button>').join('')+'</div>'
      : '';
    const body=!d
      ? '<div class="chmsg">Verlauf wird geladen …</div>'
      : (charts.length
        ? charts.map(c=>'<div class="cpsec"><div class="cphead"><div class="cpname"></div>'+
            '<div class="cpval"></div></div>'+
            (c.blocks||[]).map(b=>chartBoxHtml(b,false)).join('')+'</div>').join('')
        : '<div class="chmsg">Kein Baustein mit Aufzeichnung gewählt.</div>');
    elc.innerHTML='<div class="fp-page cpage solo'+(multi?' stack':'')+'">'+rngRow+'<div class="cpbody">'+body+'</div></div>';
    page=elc.querySelector('.fp-page.cpage'); page.dataset.sig=sig;
    page.querySelectorAll('.cpr [data-rng]').forEach(btn=>btn.addEventListener('pointerdown',ev=>{ ev.preventDefault();
      chartRange=btn.dataset.rng; applyPane(); }));
  }
  if(d){
    const secs=page.querySelectorAll('.cpsec');
    charts.forEach((c,i)=>{ const s=secs[i]; if(!s) return;
      const nm=s.querySelector('.cpname'), vl=s.querySelector('.cpval');
      if(nm) nm.textContent=c.name||''; if(vl) vl.textContent=c.value||''; });
    paintChartStack(page,charts);
  }
}
// Alle Diagramme des Stapels in DOM-Reihenfolge zeichnen (ein [data-chart]-Kasten
// je Block, Bloecke je Baustein hintereinander - wie chartBoxHtml sie ausgibt).
function paintChartStack(page,charts){
  const els=[...page.querySelectorAll('[data-chart]')]; let i=0;
  charts.forEach(c=>(c.blocks||[]).forEach(b=>{ if(b.k==='chart'&&els[i]) paintChart(els[i],b); i++; }));
}
// Mini-Verlauf in einer Kachel (it.spark, je Kachel im Konfigurator gewaehlt). Drei
// Stile, gezeichnet in der echten Pixelgroesse der freien Kachelmitte (paintSpark),
// damit Beschriftungen scharf und unverzerrt bleiben:
//   trend    Verlauf: Linie mit Tiefst-/Hoechstwert und Jetzt-Punkt, Digitalwert
//            als Stufen, Zaehlerstand als Verbrauchsbalken
//   pattern  Tagesmuster: 7 Tage (Zeilen, heute unten) x 24 Stunden, Deckkraft = Wert
//   span     Tagesspanne: je Tag ein Balken Tiefst- bis Hoechstwert, Strich = Mittel
// Ein Farbton (Akzent) fuer alle Werte, Beschriftung in der Textfarbe (--muted).
function sparkSvg(sp,W,H){
  if(!sp || sp.state!=='ok' || W<SPARK_MIN_W || H<18) return '';
  const f=n=>n.toFixed(1), dec=sp.dec||0, acc='var(--accent)';
  const txt=(x,y,t,anc,extra)=>'<text class="mm" x="'+f(x)+'" y="'+f(y)+'" text-anchor="'+(anc||'middle')+'"'+(extra||'')+'>'+esc(t)+'</text>';
  let s='';
  if(sp.style==='pattern'){
    const c=sp.cells||[], vs=c.filter(v=>v!=null); if(!vs.length) return '';
    let mn=sp.kind==='line'?Math.min(...vs):0, mx=Math.max(...vs); if(mx-mn<1e-9) mx=mn+1;
    const lab=H>=58?11:0, gap=W<150?.75:1.5, cw=(W-23*gap)/24, ch=Math.max(2,(H-lab-6*gap)/7);
    c.forEach((v,i)=>{ const d=Math.floor(i/24), h=i%24, x=h*(cw+gap), y=d*(ch+gap);
      s+= v==null
        ? '<rect x="'+f(x+.5)+'" y="'+f(y+.5)+'" width="'+f(cw-1)+'" height="'+f(ch-1)+'" rx="1.5" style="fill:none;stroke:var(--line)"/>'
        : '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(cw)+'" height="'+f(ch)+'" rx="1.5" style="fill:'+acc+';opacity:'+(0.08+0.92*(v-mn)/(mx-mn)).toFixed(3)+'"/>'; });
    if(lab){ const y=H-1; s+=txt(0,y,'0 h','start')+txt(12*(cw+gap)-gap/2,y,'12 h')+txt(W,y,'24 h','end'); }
  } else if(sp.style==='span'){
    const sp7=sp.spans||[], ok=sp7.filter(Boolean); if(!ok.length) return '';
    let mn=Math.min(...ok.map(r=>r[0])), mx=Math.max(...ok.map(r=>r[1])); if(mx-mn<1e-9){ mn-=1; mx+=1; }
    const n=sp7.length, col=W/n, lab=(H>=48 && col>=16)?11:0, bw=Math.min(16,col*0.58), top=2, bot=H-lab-2;
    const Y=v=>bot-(v-mn)*(bot-top)/(mx-mn);
    sp7.forEach((r,i)=>{ const x=i*col+(col-bw)/2, today=i===n-1;
      if(r){ const y1=Y(r[1]), y0=Y(r[0]);
        s+='<rect x="'+f(x)+'" y="'+f(y1)+'" width="'+f(bw)+'" height="'+f(Math.max(3,y0-y1))+'" rx="'+f(Math.min(4,bw/2))+'" style="fill:'+acc+';opacity:'+(today?1:.3)+'"/>';
        if(r[2]!=null) s+='<line x1="'+f(x+2)+'" x2="'+f(x+bw-2)+'" y1="'+f(Y(r[2]))+'" y2="'+f(Y(r[2]))+'" style="stroke:'+(today?'var(--tile)':'var(--ink)')+';stroke-width:1.5;opacity:.75"/>'; }
      if(lab) s+=txt(i*col+col/2,H-1,(sp.days||[])[i]||'','middle',today?' style="fill:var(--ink);font-weight:600"':''); });
  } else {
    const p=sp.pts||[]; if(!p.length) return '';
    const t0=sp.t0, t1=sp.t1, span=Math.max(1,t1-t0), ln=sp.kind==='line';
    const vs=p.map(q=>q[1]); let mn=Math.min(...vs), mx=Math.max(...vs);
    if(sp.lo) mn=Math.min(mn,sp.lo[1]); if(sp.hi) mx=Math.max(mx,sp.hi[1]);
    if(!ln) mn=Math.min(0,mn); if(mx-mn<1e-9) mx=mn+1;
    const labs=ln&&H>=48, pt=labs?13:6, pb=labs?13:6, pl=ln?4:0, pr=ln?6:0;
    const X=t=>pl+(t-t0)*(W-pl-pr)/span, Y=v=>H-pb-(v-mn)*(H-pt-pb)/(mx-mn);
    if(sp.kind==='counter'){
      p.forEach(([t,v],i)=>{ const x=X(t), w=Math.max(1,(i+1<p.length?X(p[i+1][0]):W)-x-1.5), y=Y(v);
        s+='<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(Math.max(0,Y(0)-y))+'" rx="1.5" style="fill:'+acc+';opacity:.85"/>'; });
    } else if(sp.kind==='digital'){
      let d='M'+f(X(p[0][0]))+' '+f(Y(p[0][1]));
      p.forEach(([t,v],i)=>{ const tn=i+1<p.length?p[i+1][0]:t1; d+=' H'+f(X(tn))+(i+1<p.length?' V'+f(Y(p[i+1][1])):''); });
      s='<path d="'+d+' V'+f(Y(0))+' H'+f(X(p[0][0]))+' Z" style="fill:'+acc+';opacity:.22"/>'+
        '<path d="'+d+'" style="fill:none;stroke:'+acc+';stroke-width:2"/>';
    } else {
      const line=p.map(([t,v])=>f(X(t))+','+f(Y(v))).join(' ');
      s='<polygon points="'+f(X(p[0][0]))+','+f(H)+' '+line+' '+f(X(p[p.length-1][0]))+','+f(H)+'" style="fill:'+acc+';opacity:.12"/>'+
        '<polyline points="'+line+'" style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>';
      const mark=(q,above)=>{ const x=X(q[0]), y=Y(q[1]), a=x<18?'start':(x>W-18?'end':'middle');
        return '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="3" style="fill:var(--tile);stroke:var(--ink);stroke-width:1.4"/>'+
               (labs?txt(x,above?y-5.5:y+12,chNum(q[1],dec),a):''); };
      if(sp.hi) s+=mark(sp.hi,true);
      if(sp.lo && (!sp.hi || sp.lo[0]!==sp.hi[0])) s+=mark(sp.lo,false);
      const q=p[p.length-1];
      s+='<circle cx="'+f(X(q[0]))+'" cy="'+f(Y(q[1]))+'" r="4.5" style="fill:'+acc+';stroke:var(--tile);stroke-width:2"/>';
    }
  }
  return '<svg viewBox="0 0 '+f(W)+' '+f(H)+'" width="'+f(W)+'" height="'+f(H)+'" aria-hidden="true">'+s+'</svg>';
}
// Mini-Verlauf in seinen Platz zeichnen; nur neu, wenn sich Daten oder Groesse aendern.
const SPARK_MIN_H=36;   // px: niedrigere Mitte -> Verlauf in die Kopfzeile (enge Kachel)
// Schmaler zeichnet sparkSvg() keinen Verlauf: sieben Tagesbalken auf 27 px
// waeren Rauschen (so breit blieb der Kopf einer 120-px-Kachel bei Faktor 0,85,
// vorher unter 24 px -> keiner). Absolute Pixel wie SPARK_MIN_H.
const SPARK_MIN_W=40;
// ---- Kachelfaktor ----
// Der Inhalt einer Kachel waechst mit ihrer Breite: Faktor = Breite / KACHEL_REF,
// begrenzt auf KS_MIN..KS_MAX, als --ks am .screen (CSS multipliziert damit
// Symbol, Schrift, Tasten, Innenabstand, Ring, Mini-Verlauf und Kopfzeile).
// Vorher standen 16-px-Schrift und 38-px-Symbol auf jeder Kachel, ob 122 oder
// 628 px breit. Im automatischen Raster kommt die Breite aus autoRaster(),
// beim festen Raster aus der ersten Kachel nach dem Aufbau (kachelBreiteGemessen).
const {KACHEL_REF, KACHEL_REF_H, KS_MIN, KS_MAX, KOPF_H, LEISTE_H}=LoxRaster;   // raster.js, gemeinsam mit dem Konfigurator
// Standardgroessen je Kachel-Aufbau, wie GROESSEN_STANDARD im Server (gelten,
// wenn der Kasten keine --ico-size usw. traegt)
const GROESSEN_STANDARD = {neu: {iconSize: 38, nameSize: 16, subSize: 14, roomSize: 13},
                           classic: {iconSize: 38, nameSize: 18, subSize: 15, roomSize: 12}};
let kachelFaktor=1;
// Breite UND Hoehe zaehlen (Rechnung in raster.js): eine flache Kachel (2x3 auf
// dem 4"-Panel: 225 x 128) traegt sonst die Schrift ihrer Breite und laeuft unten ueber.
function kachelFaktorFuer(breite, hoehe){ return LoxRaster.kachelFaktorFuer(breite, hoehe); }
function setzeFaktor(ks){
  const sc=document.querySelector('.screen'); if(!sc) return;
  kachelFaktor=ks;
  sc.style.setProperty('--ks', ks.toFixed(3));
  sc.style.setProperty('--ksg', ks.toFixed(3));   // Faktor der Seite fuer die Tasten, auch wo eine Kachel --ks selbst setzt
  sc.style.setProperty('--kst-min', ks>=1 ? '1' : '0.6');   // Untergrenze der Textstufen (s. fitTile)
  sc.style.setProperty('--kopf-h', Math.round(KOPF_H*ks)+'px');
  sc.style.setProperty('--leiste-h', Math.round(LEISTE_H*ks)+'px');   // Werteleiste waechst mit
  kopfEinpassen();   // Schrift und Hoehe der Kopfzeile haengen am Faktor: neu einpassen
}
function kachelGemessen(){ const g=el('grid');
  const t=g.querySelector('.tile[data-id]:not(.w2)')||g.querySelector('.tile[data-id]');
  if(!t) return kachelFaktor;
  // nur breite Kacheln auf der Seite: eine misst sich als die schmale, die sie ersetzt
  const gap=parseFloat(getComputedStyle(g).getPropertyValue('--gap'))||0;
  return kachelFaktorFuer(t.classList.contains('w2') ? (t.clientWidth-gap)/2 : t.clientWidth, t.clientHeight); }
// Festes Raster: Faktor aus der ersten Kachel. Mit Kopfzeile haengt die
// Kachelhoehe an --kopf-h und die wieder am Faktor (Codex-Befund: einmal
// gemessen hing der Faktor an der Seite davor, deren Faktor die Kopfzeile
// noch hatte). Darum nachmessen, bis er steht: die Kopfzeile wiegt
// KOPF_H * Faktor auf zwei oder drei Zeilen, zwei Durchgaenge reichen.
function faktorEinmessen(){
  for(let i=0;i<4;i++){
    const ks=kachelGemessen();
    if(Math.abs(ks-kachelFaktor)<0.005) return;
    setzeFaktor(ks);
  }
}
// Nach einer Groessenaenderung ohne neues Raster (Fenster, Split an/aus): Faktor
// neu, und die Kacheln messen sich mit den neuen Groessen noch einmal ein.
// Kachelhoehe beim letzten Einpassen: im festen, breitenbegrenzten Raster
// kann sie sich mit dem Fenster aendern, ohne dass der Faktor es tut
// (Codex-Befund an #128) - dann passen Tasten und Text trotzdem neu.
// Mass der ersten Kachel (Breite x Hoehe): aendert es sich, misst faktorNachziehen neu - auch
// bei reiner Breitenaenderung (Tasten der Spieler-Spalte, Textumbruch), wo Faktor und Hoehe bleiben
let _kachelM='';
function kachelMass(){ const t=el('grid').querySelector('.tile[data-id]'); return t ? t.clientWidth+'x'+t.clientHeight : ''; }
function faktorNachziehen(){
  if(!view || view.widget || el('grid').classList.contains('panel')) return;
  const vorher=kachelFaktor;
  if(gridAuto){ const ks=autoRaster(_lastWidget).ks; if(Math.abs(ks-vorher)>=0.01) setzeFaktor(ks); }
  else faktorEinmessen();
  if(Math.abs(kachelFaktor-vorher)>=0.01 || kachelMass()!==_kachelM) kachelnNeuMessen();
}
function kachelnNeuMessen(){
  _kachelM=kachelMass();
  el('grid').querySelectorAll('.tile[data-id]').forEach(n=>{
    n._fitText=null;
    if(n._it && n._it.controls) tastenEinpassen(n);

function paintSpark(el,sp){
  if(!el) return;

  // Ohne Raumzeile kommt die Zeile dabei neu dazu oder faellt weg: dann hat
  // die Mitte eine andere Hoehe, Platz und Zeichnung also neu bestimmen.
  const bd=tile&&tile.querySelector('.tsbadge');
  if(bd){
    const vorher=tile.classList.contains('sparkbadge');
    tile.classList.remove('sparkbadge');
    if(!tile.classList.contains('sparktight') && bd.scrollWidth>bd.clientWidth+1) tile.classList.add('sparkbadge');
    if(vorher!==tile.classList.contains('sparkbadge')) placeSpark(el,sp,tile);

}
// Freie Mitte fuer den Verlauf = Innenhoehe der Kachel minus alles ausser dem
// Verlauf (und seinem Rand). Gleich, ob der Verlauf gerade in der Mitte oder
// im Kopf steht: dort gibt das Symbol die Hoehe vor, er fuellt sie nur.
function sparkFrei(tile,el){
  const cs=getComputedStyle(tile);
  let free=tile.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-10;
  for(const ch of tile.children) if(ch!==el) free-=ch.offsetHeight;
  return free;
}
// Verlauf in die Mitte oder (zu niedrige Mitte) in die Kopfzeile setzen und zeichnen.
function placeSpark(el,sp,tile){
  const head=tile&&tile.querySelector('.head');
  if(head){
    const tight=sparkFrei(tile,el)<SPARK_MIN_H;   // absolute Pixel: eine Kurve braucht Hoehe, nicht den Faktor
    if(tight!==tile.classList.contains('sparktight') || tight!==(el.parentNode===head)){
      tile.classList.toggle('sparktight',tight);
      if(tight) head.insertBefore(el,head.firstElementChild.nextSibling);
      else tile.insertBefore(el,head.nextSibling);
      el.innerHTML=''; el._key=null;
    }
  }
  const W=el.clientWidth, H=el.clientHeight, key=W+'x'+H+JSON.stringify(sp);
  if(el._key!==key){ el._key=key; el.innerHTML=sparkSvg(sp,W,H); }
}
// Tasten der Kachel (it.controls) nur, wenn die Kachel hoch genug ist - aus
// dem Faktor, nicht gemessen: Kopf, zwei Textzeilen, Abstaende und Innenrand
// brauchen TASTEN.text mal Faktor, die Tastenleiste TASTEN.leiste mal
// max(1, Faktor der Seite) - Touch-Ziele schrumpfen nie. Die Kachel nimmt den
// Faktor, bei dem beides in ihre Hoehe passt (hoechstens den der Seite; steht
// als --ks an der Kachel, die Tasten bleiben ueber --ksg in Seitengroesse).
// Liegt er unter KS_MIN, bleiben die Tasten weg, und der Tipp auf die Kachel
// oeffnet die Detailseite (nav). Das loest die flache Kachel (drei Zeilen am
// 4"-Panel) ohne Sonderfaelle: frueher rueckten die Tasten dort in den Kopf
// neben das Symbol (ctrltight) oder an seine Stelle (ctrlnarrow), je Text
// gemessen. Der Platz fuer Kopf und Text kommt aus den EINGESTELLTEN
// Groessen (Symbol, Haupt-, Zweit- und Raumtext: GROESSEN_STANDARD oder
// das Profil, als --ico-size usw. am Kasten, Codex-Befund an #128: ein
// Profil mit 80-px-Symbol braucht mehr), dazu die festen Anteile aus dem CSS
// bei Faktor 1 - neuer Aufbau: Innenrand 2 x 14, Kopf = Symbol (oder die
// Raumzeile daneben), Abstand 10, zwei Zeilen mit Zeilenhoehe 1,15 und 1,3,
// Abstand zur Leiste 10 (mit den Standardgroessen 130 vor 44 Leiste);
// klassisch: 2 x 16, Symbol, Raumzeile, zwei Zeilen, 6 (122 vor 34).
// Listen (Zonen einer Zentrale) haben ihre Tasten neben dem Text: immer.
const TASTEN = {lx: {rand: 55, leiste: 44}, classic: {rand: 30, leiste: 34}};
function tastenTextHoehe(tile){
  const cs=getComputedStyle(tile), px=(n,d)=>parseFloat(cs.getPropertyValue(n))||d;
  const lx=kachelNeu(), g=lx ? GROESSEN_STANDARD.neu : GROESSEN_STANDARD.classic;
  const name=px('--name-size',g.nameSize), sub=px('--sub-size',g.subSize), raum=px('--room-size',g.roomSize);
  // Aufbau "kreis" (Kachel-Set): der Kopf ist so hoch wie der Kreis um das Symbol
  const ico=Math.max(px('--ico-size',g.iconSize), kachelAufbau==='kreis' ? px('--k-kreis',0) : 0);
  return lx ? Math.max(ico, 1.2*raum) + 1.15*name + 1.3*sub + TASTEN.lx.rand
            : ico + 1.2*raum + 1.15*name + 1.3*sub + TASTEN.classic.rand;
}
function tastenFaktor(tile){
  const t = kachelNeu() ? TASTEN.lx : TASTEN.classic;
  return Math.min(kachelFaktor, (tile.clientHeight - t.leiste*Math.max(1, kachelFaktor)) / tastenTextHoehe(tile));
}
// Spieler-Spalte (.spieler): die Tasten stehen neben dem Text, die Kachel
// braucht nur die Hoehe einer Tastenleiste, das Cover darueber mindestens
// SPIELER_COVER_MIN mal Faktor, sonst faellt es weg (.ohnecover). Die Spalte
// ist die halbe Kachel; passen die Tasten dort nicht in ihrer Mindestbreite
// (TASTE_MIN wie .tctrls .tb, mal max(1, Faktor der Seite), dazu die Abstaende
// der Leiste), wird sie so breit wie noetig (.spbreit, --spw) - Touch-Ziele
// schrumpfen nie.
const SPIELER_COVER_MIN = 36, TASTE_MIN = 34;
function spielerEinpassen(tile, tc){
  tile._kt=null; tile.style.removeProperty('--ks');   // gemessen wird mit dem Faktor der Seite
  const cs=getComputedStyle(tile), pad=parseFloat(cs.paddingTop);
  const innen=tile.clientHeight-pad-parseFloat(cs.paddingBottom);
  const n=tc.querySelectorAll('.tb').length, abstand=parseFloat(getComputedStyle(tc).columnGap)||0;
  const noetig=n*TASTE_MIN*Math.max(1, kachelFaktor)+(n-1)*abstand, halb=tile.clientWidth/2-parseFloat(cs.paddingRight);
  tile.classList.toggle('spbreit', noetig>halb+0.5);
  if(noetig>halb+0.5) tile.style.setProperty('--spw', noetig.toFixed(1)+'px'); else tile.style.removeProperty('--spw');
  // Abstand zwischen Cover und Tasten, wie ihn die Spalte tatsaechlich hat: --spgap ist ein
  // calc() (10px mal Faktor), das parseFloat nicht liest - der aufgeloeste row-gap schon
  const sp=tile.querySelector('.tplay'), gap=sp ? (parseFloat(getComputedStyle(sp).rowGap)||0) : 0;
  const leiste=TASTEN.lx.leiste*Math.max(1, kachelFaktor);
  const an=innen>=leiste-0.5;

  tile.classList.toggle('ohnecover', !an || innen-leiste-gap < SPIELER_COVER_MIN*kachelFaktor);
}
function tastenEinpassen(tile){
  const tc=tile&&tile.querySelector('.tctrls'); if(!tc || !tile.clientHeight) return;
  if(view && view.layout==='list'){ tc.hidden=false; tile._kt=null; tile.style.removeProperty('--ks'); return; }
  if(tile.classList.contains('spieler')){ spielerEinpassen(tile, tc); return; }
  const kt=tastenFaktor(tile), an=kt>=KS_MIN-0.005;
  tc.hidden=!an; tile.classList.toggle('ohnetasten', !an);
  tile._kt = (an && kt<kachelFaktor-0.005) ? +kt.toFixed(3) : null;
  if(tile._kt) tile.style.setProperty('--ks', String(tile._kt)); else tile.style.removeProperty('--ks');

// Neuer Aufbau, enge Kachel: laeuft der Text unten aus der Kachel, weicht
// Stufe fuer Stufe das Unwichtigste - erst steht der Text einzeilig (eng1),
// dann faellt die Angabe zum Mini-Verlauf weg (eng2), zuletzt die zweite Zeile
// (eng3). Gemessen bei neuer Kachel, neuem Text, neuer Groesse oder neuem Faktor.
function fitTile(tile){
  if(!tile || !tile.clientHeight) return;
  const text=(tile.querySelector('.body')||{}).textContent, h=tile.clientHeight, w=tile.clientWidth;
  if(tile._fitText===text && tile._fitH===h && tile._fitW===w && tile._fitKs===kachelFaktor && tile._fitKt===tile._kt) return;
  tile._fitText=text; tile._fitH=h; tile._fitW=w; tile._fitKs=kachelFaktor; tile._fitKt=tile._kt;
  tile.classList.remove('eng1','eng2','eng3','kst1','kst2','kst3');
  // Textfaktor: passt eine Textzeile der Kachel (Name oder Zustand) nicht in
  // ihre Zeilen - gekappt durch line-clamp, im klassischen Aufbau mit "..." -,
  // bekommt der Text Stufe fuer Stufe weniger Faktor (kst1..kst3, CSS). Ueber
  // Faktor 1 geht es hoechstens auf 1 zurueck, den Stand ohne Faktor; auf
  // kleiner Kachel (Faktor unter 1) auch darunter: ein kleiner, ganzer Text
  // liest sich besser als ein grosser mit "...". Symbol und Tasten behalten
  // ihre Groesse.
  const texte=[...tile.querySelectorAll('.body .name, .body .sub')];
  const passt=()=>texte.every(e=>e.scrollHeight<=e.clientHeight+1 && e.scrollWidth<=e.clientWidth+1);
  const STUFEN=['kst1','kst2','kst3'];
  const setzeStufe=s=>{ tile.classList.remove(...STUFEN); if(s) tile.classList.add(s); };
  const textStufen=()=>{ if(!texte.length) return;
    setzeStufe(null);
    for(const stufe of STUFEN){
      if(passt()) break;
      setzeStufe(stufe);
    } };
  // Mini-Verlauf: ueber Faktor 1 gibt der Text seinen Zuwachs her (hoechstens
  // bis Faktor 1, s. --kst-min), wenn ein Zustand, der mit dem Faktor auf zwei
  // Zeilen ging ("4,200 kW • 9,1 MWh" auf der 200-px-Kachel), damit wieder in
  // EINE passt und der Verlauf so seine Mindesthoehe in der Mitte bekommt.
  // Eine Stufe, die nur die Schrift verkleinert, ohne eine Zeile zu loesen,
  // zaehlt nicht: sie braechte die Mitte hoechstens knapp ueber die Schwelle
  // und einen gequetschten Verlauf. Bringt keine Stufe eine Zeile zurueck,
  // bleibt der Text gross und placeSpark() setzt den Verlauf in den Kopf.
  const zeilen=()=>texte.reduce((n,e)=>{ const r=document.createRange(); r.selectNodeContents(e); return n+r.getClientRects().length; },0);
  const sparkStufen=()=>{
    const sp=tile.querySelector('.tspark');
    if(!sp || !tile.querySelector('.head') || kachelFaktor<=1 || sparkFrei(tile,sp)>=SPARK_MIN_H) return;
    const vorher=STUFEN.find(s=>tile.classList.contains(s))||null, z0=zeilen();
    for(let i=STUFEN.indexOf(vorher)+1; i<STUFEN.length; i++){
      setzeStufe(STUFEN[i]);
      if(zeilen()<z0 && sparkFrei(tile,sp)>=SPARK_MIN_H) return;
    }
    setzeStufe(vorher);
  };
  textStufen();
  if(kachelNeu()){
    for(const stufe of ['eng1','eng2','eng3']){
      if(tile.scrollHeight<=h+1) break;
      tile.classList.add(stufe);
    }
    textStufen();   // eng1 kappt den Text auf eine Zeile: dann lieber kleiner und ganz
  }
  sparkStufen();
  // Die Stufen aendern die Hoehe der Mitte: der Verlauf findet seinen Platz neu
  // (Mitte oder Kopf); ohne Aenderung zeichnet placeSpark() nichts neu.
  if(tile._it && tile._it.spark) paintSpark(tile.querySelector('.tspark'), tile._it.spark);
}

  const fb=blocks.find(b=>b.k==='favs'); const fe=g.querySelector('.favs');
  if(fb&&fe){ fe.querySelectorAll('.fav').forEach(n=>{ const f=fb.items[+n.dataset.f]; if(!f)return;
    // Wie die Tasten auf der Kachel erst beim Tippen: die Favoriten liegen im
    // scrollenden Raster, ein Wischer darueber startet sonst einen Sender.
    n.addEventListener('click',()=>{ if(f.cmd) sendCmd(f.cmd.uuid,f.cmd.cmd,view&&view.secured,{ok:back}); }); }); }
  g.dataset.bsig=blockSig(blocks);   // Grundlage fuer den In-place-Abgleich in updatePanel
  intercomBind(g);
  renderTabs();
  panelEinpassen();
}
function panelEinpassen(){
  const g=el('grid'); if(!g.classList.contains('panel')) return;
  g.classList.remove('eng');
  if(g.scrollHeight>g.clientHeight+1) g.classList.add('eng');
}
function updatePanel(blocks){
  blocks=intercomBlocks(blocks);
  const g=el('grid');
  // Struktur anders als zuletzt gerendert (Zeile/Status/Favorit dazu oder weg,
  // Favoriten per roomfav/get nachgeliefert)? Dann komplett neu aufbauen.
  if(g.dataset.bsig!==blockSig(blocks)){ renderPanel(blocks); return; }
  const rowBlocks=blocks.filter(b=>b.k==='row');
  const rows=[...g.querySelectorAll('.brow')];
  // Ab hier ist die Struktur nachweislich identisch -> jeden Block an SEINER
  // Position patchen, nicht nur den ersten seiner Art: Detailseiten wie die
  // Sauna haben mehrere Status-Zeilen (Tuer, Wasser, Stoerung ...), die sonst
  // auf dem Stand des ersten Renderns einfrieren.
  const nth=(k,sel,fn)=>{ const es=[...g.querySelectorAll(sel)];
    blocks.filter(b=>b.k===k).forEach((b,i)=>{ if(es[i]) fn(es[i],b); }); };
  nth('status','.status:not(.alist-empty)',(e,b)=>{ e.textContent=b.text||''; });
  nth('value','.pbar',(e,b)=>{ e.textContent=b.text||''; });
  nth('big','.pbig',(e,b)=>{ e.textContent=b.text||''; e.className='pbig'+(b.tone==='good'?' good':(b.tone==='crit'?' crit':'')); });
  nth('title','.ptitle',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; const su=e.querySelector('.psub'); if(su)su.textContent=b.sub||''; });
  nth('astat','.astat',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; e.className='astat'+(b.tone==='crit'?' crit':''); const su=e.querySelector('.astatsub'); if(su)su.textContent=b.sub||''; });
  const cov=blocks.find(b=>b.k==='cover'); if(cov){const img=g.querySelector('#coverimg'); if(img&&img.getAttribute('src')!==cov.src){img.style.opacity='0'; img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=cov.src;}}
  const sb=blocks.find(b=>b.k==='slider'); if(sb){const sld=g.querySelector('.sld'); if(sld&&!sldDragging){ sld.value=sb.value; sldFill(sld); const sv=g.querySelector('.sval'); if(sv)sv.textContent=sb.value; }}
  const efb=blocks.find(b=>b.k==='eflow'); if(efb){ const d=g.querySelector('[data-eflow]'); if(d) paintEnergy(d, efb.e); }   // Radial live aktualisieren (in-place)
  paintCharts(g,blocks);   // Verlauf nachgeladen oder Fenster vorgerueckt: neu zeichnen, Knoepfe bleiben
  rowBlocks.forEach((b,ri)=>{ const rowEl=rows[ri]; if(!rowEl)return;
    b.cells.forEach((c,ci)=>{ const btn=rowEl.querySelector('[data-c="'+ci+'"]'); if(!btn)return;
      if(c.icon) btn.innerHTML=svgF(ICONS[c.icon]||ICONS.info);
      else if(btn._armed) btn._label=c.label;     // Rueckfrage bleibt stehen
      else btn.textContent=c.label;
      btn.className=cellCls(c)+(btn._armed?' arm':'');
      bindCell(btn,c);
    });
  });
  nth('stepper','.stp',(e,b)=>stepperUpdate(e,b));
  formPruefen(g);
  intercomBind(g);
}

function activeTab(){ const b=stack[0]; return b && b.view==='tab' ? b.tab : null; }
// Anker-Kontext: der (einzige) Profil-Tab traegt eine Seite, deren untere
// Leiste Sprungmarken statt Seiten zeigt - ein Raum (Kategorien des Raums) oder
// die freie Auswahl (Raeume der Auswahl). Dann bleiben in ALLEN Ansichten (auch
// Detail) diese Tabs + mittiger Zurueck-Button unten stehen. roomCatTabs merkt
// sie sich fuer Ansichten ohne eigene catTabs. Der Name bleibt roomCatTabs bzw.
// isRoomPanel, damit sich kuenftige Upstream-Merges nicht daran reiben.
function isRoomPanel(){ const t = String(tabsCfg[0]||'');
  return tabsCfg.length===1 && (t.indexOf('room:')===0 || isPick(t)); }
let roomCatTabs=null, pendingCatScroll=null;
// Sprungmarken im Filter-Modus (Profil ui.catFilter): ein Tipp zeigt nur die
// Kacheln dieser Gruppe (Kategorie im Raum-Panel, Raum in der freien Auswahl),
// ein zweiter Tipp wieder alle. katFilter = aktive Gruppe oder null.
let themeCatFilter=false, katFilter=null;

function renderTabs(){
  // Raum-Panel: die untere Leiste zeigt die im Raum vorkommenden Kategorien
  // (vom Server als view.catTabs) als SCROLL-Tabs - ein Tipp scrollt zur Gruppe,
  // statt die Seite zu wechseln. Design bleibt: 4 Tabs + Zurueck-Button mittig.
  // In Detailansichten (kein view.catTabs) die gemerkten Tabs weiterzeigen.
  // Sprungmarken ERSETZEN die ganze Leiste. Das darf nur geschehen, wenn das
  // Panel ueberhaupt nur diese eine Seite hat: sonst waeren die uebrigen Tabs
  // nicht mehr antippbar, und der Zurueck-Knopf hilft nicht, weil die Seite
  // die unterste im Stapel ist. Frueher hing das daran, dass nur die
  // room:-Ansicht catTabs lieferte - steht ein room:-Tab in einer klassischen
  // Leiste, greift dieselbe Falle auch ohne die freie Auswahl.
  const anker = isRoomPanel();
  const ct = !anker ? null
           : (view && Array.isArray(view.catTabs))
             ? (view.catTabs.length ? view.catTabs : null)
             : (roomCatTabs && roomCatTabs.length ? roomCatTabs : null);
  // Seitenleiste (Kachel-Set "links"): Symbol und Name, Zurueck steht unten.
  // Mit Kachel-Set ist Zurueck ein Symbol wie die Tabs, ohne den Kreis.
  const links = kachelLeiste==='links';
  const nm = t => links ? '<span class="tnm">'+esc(t||'')+'</span>' : '';
  const backHtml = '<div class="tabback'+(stack.length>1?' on':'')+'" id="tabback">'+
    (kachelLeiste ? svg('<path d="M15 5l-7 7 7 7"/>')+nm('Zurück') : '‹')+'</div>';
  let items;
  if(ct){
    const tabsHtml = ct.map(c => {
      // Ohne Bild den NAMEN zeigen, nicht den Kategorie-Wuerfel: sonst sehen
      // mehrere Sprungmarken identisch aus und man kann nichts treffen.
      // Kategorien aus Loxone bringen fast immer ein Bild mit, Raeume selten.
      const ico = c.iconUrl
        ? '<span class="tico" style="--u:url(\''+esc(c.iconUrl)+'\')"></span>'
        : '<span class="tlbl">'+esc(c.label||'')+'</span>';
      return '<div class="tab'+(katFilter===c.key?' active':'')+'" data-cat="'+esc(c.key)+'" title="'+esc(c.label||'')+'">'+ico+nm(c.label)+'</div>';
    });
    // Zurueck-Button IMMER mittig: links ceil(N/2), rechts floor(N/2) Tabs; die
    // fehlende Zelle rechts mit einem leeren Spacer auffuellen, damit beide
    // Seiten gleich breit sind (1->links, 2->je einer, 3->2+1, 4->symmetrisch).
    const N=tabsHtml.length, leftN=Math.ceil(N/2), pad=leftN-(N-leftN);
    if(links) items = tabsHtml.concat([backHtml]);
    else {
      items = tabsHtml.slice(0,leftN).concat([backHtml]).concat(tabsHtml.slice(leftN));
      for(let s=0;s<pad;s++) items.push('<div class="tabspacer" aria-hidden="true"></div>');
    }
  } else {
    const at = activeTab();
    items = tabsCfg.map(tk => {
      const cls = 'tab'+(tk===at?' active':'');
      const t = TABS.find(x => x.tab===tk);
      if(t) return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(t.label)+'">'+svg(t.icon)+nm(t.label)+'</div>';
      const m = tabMeta[tk]; if(!m) return '';   // dynamischer Tab (Kategorie/Raum)
      // Ohne Bild aus Loxone: Raum bekommt das Raum-Symbol, Kategorie den Wuerfel -
      // sonst sehen ein Raum- und ein Kategorie-Tab identisch aus.
      const fallback = m.haus
        // freie Seite mit der Hausuebersicht: dasselbe Haus wie der Tab "haus"
        ? TABS.find(x => x.tab==='haus').icon
        : isPick(tk)
        // Checkliste: klar unterscheidbar von Favoriten-Stern, Haus, Raum und
        // Kategorie-Wuerfel. Die freie Auswahl hat kein Bild aus Loxone, weil
        // sie weder Raum noch Kategorie ist - dieses Symbol gilt immer.
        ? '<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>'
          +'<path d="m3 6 1.4 1.4L7 4.9"/><path d="m3 12 1.4 1.4L7 10.9"/>'
          +'<path d="m3 18 1.4 1.4L7 16.9"/>'
        : tk.indexOf('room:')===0
        ? '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/>'
        : '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/>';
      const ico = m.iconUrl
        ? '<span class="tico" style="--u:url(\''+esc(m.iconUrl)+'\')"></span>'
        : svg(fallback);
      return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(m.label||'')+'">'+ico+nm(m.label)+'</div>';
    }).filter(Boolean);
    items.splice(links ? items.length : Math.floor(items.length/2), 0, backHtml);
  }
  el('tabs').innerHTML = items.join('');
  el('tabs').style.setProperty('--tab-n', items.length);   // Pille so breit wie ihre Eintraege (--pille-tab-breite)
  if(ct) el('tabs').querySelectorAll('.tab[data-cat]').forEach(n => n.onclick=()=>katTipp(n.dataset.cat));
  else   el('tabs').querySelectorAll('.tab').forEach(n => n.onclick=()=>goTab(n.dataset.tab));
  const tb = el('tabs').querySelector('#tabback'); if(tb) tb.onclick = back;
  applyPane();
}
// Waagerechte Seiten (Tablet) oder senkrechtes Einrasten (4"-Panel)? Auf
// einem Tablet mit Split wischt man Seiten wie in der Loxone-App zur Seite,
// mit Punkten darunter; das quadratische 4"-Panel und ein Profil mit Split
// "aus" blaettern weiter senkrecht. Listen (layout "list") bleiben immer
// senkrecht. Quadratisch: Breite und Hoehe weniger als ein Zehntel auseinander.
function quadratisch(){ const {w,h}=vpSize(); return LoxRaster.quadratisch(w, h); }
function seitenQuer(v){
  v=v||view;
  return !!(v && themeSplit && !v.widget && !v.front && v.layout!=='list' && !quadratisch());
}
function seiteAktuell(){ const g=el('grid'); return g.clientWidth>0 ? Math.round(g.scrollLeft/g.clientWidth) : 0; }
function seiteZu(k){ const g=el('grid'); g.scrollTo({left:Math.max(0,k)*g.clientWidth, behavior:'smooth'}); }
function punkteNachziehen(){
  const g=el('grid'), s=seiteAktuell();
  g.querySelectorAll('.punkte i').forEach((d,k)=>d.classList.toggle('on', k===s));
}
// Zur SEITE springen, auf der die Kachel steht. Die Kachelflaeche rastet
// seitenweise ein (scroll-snap mandatory, Rastpunkt = erste Kachel jeder
// Seite). Ein Sprung direkt auf eine Kachel im unteren Teil einer Seite
// landete am naechstgelegenen Rastpunkt - oft schon auf der FOLGENDEN Seite,
// und die Zielkachel verschwand oben (gemessen 2x2 und 2x3: 199 bzw. 210 px
// ueber dem sichtbaren Bereich). Waagerechte Seiten: zur Seite der Kachel.
function springeZu(d){
  const g=el('grid'), tiles=[...g.querySelectorAll('.tile[data-id]')];
  if(g.classList.contains('hpages')){
    const p=d.closest('.page'); if(p) seiteZu([...g.querySelectorAll('.page')].indexOf(p));
    return;
  }
  const i=tiles.indexOf(d);
  let ziel=d;
  if(i>=0 && g.classList.contains('snapy')){
    if(view && view.layout==='list') ziel=tiles[Math.floor(i/4)*4];
    else {   // erste Kachel in der ersten Zeile der Seite (Lage aus rasterLage, breite Kacheln mitgerechnet)
      const z=g._zeile||[], start=Math.floor((z[i]||0)/gridRows)*gridRows, j=z.findIndex(r=>r===start);
      if(j>=0) ziel=tiles[j]; }
  }
  ziel.scrollIntoView({behavior:'smooth', block:'start'});
}
// Kacheln der Gruppe kurz hervorheben: auch wenn nichts scrollt (die Gruppe
// steht schon im Bild), sieht man so, welche Bausteine gemeint sind.
let _leuchtTimer=null;
function leuchte(key){
  // Die vorige Gruppe zuerst abraeumen: bei schnellem Tippen loescht der neue
  // Timer den alten, dessen Kacheln behielten sonst die Klasse.
  el('grid').querySelectorAll('.tile.katleucht').forEach(n=>n.classList.remove('katleucht'));
  const ns=[...el('grid').querySelectorAll('.tile[data-id]')].filter(n=>n._it && n._it.grp===key);
  ns.forEach(n=>{ n.classList.remove('katleucht'); void n.offsetWidth; n.classList.add('katleucht'); });
  clearTimeout(_leuchtTimer);
  _leuchtTimer=setTimeout(()=>ns.forEach(n=>n.classList.remove('katleucht')), 1600);
}
// Tipp auf eine Sprungmarke: springen (Standard) oder filtern (ui.catFilter).
function katTipp(key){
  if(!themeCatFilter){ scrollToCat(key); return; }
  katFilter=(katFilter===key) ? null : key;   // zweiter Tipp auf dieselbe Marke: wieder alle
  // Auf der Seite mit den Marken neu zeichnen; aus einer Detailansicht zurueck
  // in den Raum - dort greift der Filter beim Rendern.
  if(view && Array.isArray(view.catTabs)){ render(); el('grid').scrollTop=0; el('grid').scrollLeft=0; }
  else { const rt=tabsCfg[0]; if(rt) goTab(rt); }
}
// Kacheln, die im Filter-Modus sichtbar sind. Nur auf der Seite mit den Marken
// (view.catTabs), nicht in Detailansichten. Gibt es die Gruppe nicht mehr
// (Konfiguration geaendert), faellt der Filter weg, statt eine leere Seite zu zeigen.
function katSichtbar(items){
  if(!katFilter || !view || !Array.isArray(view.catTabs)) return items;
  const f=items.filter(it=>it.grp===katFilter);
  if(!f.length){ katFilter=null; return items; }
  return f;
}
// Raum-Panel: zur ersten Kachel einer Kategorie scrollen. Sind wir in einer
// Detailansicht (die Kachel ist gerade nicht da), erst zurueck in den Raum und
// nach dem Rendern dorthin scrollen (pendingCatScroll, s. render()).
function scrollToCat(key){
  const d = el('grid').querySelector('.tile[data-cat="'+key+'"]');
  if(d){ springeZu(d); leuchte(key); return; }
  pendingCatScroll = key;
  const rt = tabsCfg[0]; if(rt) goTab(rt);
}
// ---- Split-Pane pro Tab: entscheidet je aktuellem Tab, was in Pane 2 steht (quer rechts, hochkant unten) ----
// Wert je Tab: "weather" | "calendar" | "player:<zone>" | "energy:<uuid>" | "camera:<uuid>" | "chart:<uuid>" | "status:<uuid>,...".
function paneForTab(tk){ return tk ? (panesCfg[tk]||null) : null; }
// Split hochkant (Widget unter den Kacheln) oder quer (daneben). Im automatischen Raster
// entscheidet raster.js nach der Flaeche des Rasters, ohne Seitenleiste und Rahmen eines
// Kachel-Sets; das CSS muss dieselbe Achse nehmen (900 x 750 mit Seitenleiste ist ein Raster
// von 692 x 750, also hochkant). Sonst nach dem Fenster, wie festesRaster().
function splitHoch(){
  if(gridAuto) return autoRaster(_lastWidget).hoch;
  const vp=vpSize(); return vp.h > vp.w;
}
// Split im Hochformat: Visu und Pane 2 uebereinander (CSS .screen.split.hoch).
// Eigene Funktion, weil sie auch beim Drehen laufen muss - dort wird nicht in
// jedem Fall neu gerendert (z.B. Anlagenschema, Screensaver oben).
function applyHoch(){
  const sc=document.querySelector('.screen'); if(!sc) return;
  sc.classList.toggle('hoch', sc.classList.contains('split') && splitHoch());
}
// Der aktuell gezeigte Pane-Wert: eine Widget-Seite (Vollbild-Tab, view.widget)
// ODER die Pane 2 des aktiven Tabs (nur im 2-Pane-Betrieb). Damit finden die
// Push-Handler (energy/camera/chart/status) auch das Widget eines Widget-Tabs.
function paneRawNow(){ if(view && view.widget) return view.widget;
  // Die Hausuebersicht bringt Kopf und Spieler selbst mit: keine Pane, keine Kopfzeile
  if(view && view.layout==='haus') return null;
  const v=paneForTab(activeTab());
  // Die Kopfzeile ist keine Pane: sie gilt auch mit Split "Aus" (4"-Panel),
  // ein Widget daneben nur im 2-Pane-Betrieb.
  return (themeSplit || paneKind(v)==='header') ? v : null; }
function paneKind(v){ if(!v) return null;
  for(const k of ['player','energy','camera','chart','status','header']) if(v.indexOf(k+':')===0) return k;
  return v; }
// ---- Kopfzeile (Widget "header") ----
// Uhr, Wetter kurz und bis zu SV_STATUS_MAX Werte in einer Zeile ueber dem
// Kachelraster. Kein Split: der Kasten bekommt nur eine Zeile mehr. Die Werte
// kommen wie bei "status" per {t:'svstatus'} (setsvstatus in applyPane), das
// Wetter aus {t:'front'}, die Uhr tickt mit tickClock().
function kopfAktiv(){ return paneKind(paneRawNow())==='header'; }
function kopfHoehe(ks){ return kopfAktiv() ? Math.round(KOPF_H*(ks||kachelFaktor)) : 0; }
// Ein Wert als Chip (Symbol, Wert, Name) - Kopfzeile und Werteleiste; attrs:
// weitere Attribute (data-i, data-id der Werteleiste). Als Wert der Messwert, den
// die Kachel gross zeigt (big, etwa die Ist-Temperatur der Raumregelung), sonst
// die Zweitzeile: "21,0°" passt in die Zeile, "21,0° → 22,5° · heizt" oft nicht.
function kopfWertHtml(it, attrs){
  const ton=(it.tone==='good')?' good':((it.tone==='crit')?' crit':(it.on?' on':''));
  const ico = it.iconImg ? '<span class="ico"><img src="'+esc(it.iconImg)+'" alt=""></span>'
    : it.iconUrl ? '<span class="ico img" style="--u:url(\''+esc(it.iconUrl)+'\')"></span>'
    : '<span class="ico">'+svg(ICONS[it.icon]||ICONS.info)+'</span>';
  return '<div class="kz-w'+ton+'"'+(attrs||'')+(it.color?' style="--ico:'+esc(it.color)+'"':'')+'>'+ico+
    '<span class="vl">'+esc(it.big||it.sublabel||'')+'</span><span class="nm">'+esc(it.label||'')+'</span></div>';
}
function kopfWerteHtml(items){ return items.map(it=>kopfWertHtml(it)).join(''); }
function renderKopfzeile(){
  const kz=el('kopfzeile'); if(!kz || !kopfAktiv()) return;
  const d=frontData||{}, w=d.weather;
  let html='<div class="kz-uhr"><span class="t" id="kzTime">--:--</span><span class="d" id="kzDate"></span></div>';
  if(w){ html+='<div class="kz-wx"><span class="ico">'+wxSvg(w.icon)+'</span><span class="t">'+tdeg(w.temp)+'</span>'+
    '<span class="m"><span class="c">'+esc(w.cond||'')+'</span>'+
    ((w.hi!=null||w.lo!=null)?'<span>Heute '+tdeg(w.hi)+' / '+tdeg(w.lo)+'</span>':'')+'</span></div>'; }
  // Werte nur, wenn die Kopfzeile welche nennt ("header:<uuid>,…") und der
  // Server sie schon geschickt hat; solange nicht, steht dort nichts.
  const items=(svArg(paneRawNow()||'') && Array.isArray(svStatusData)) ? svStatusData : [];
  if(items.length) html+='<div class="kz-werte">'+kopfWerteHtml(items)+'</div>';
  kz.innerHTML=html; tickClock(); kopfEinpassen();
}
// Was rechts nicht mehr in die Zeile passt, bleibt weg - lieber drei ganze
// Werte als vier angeschnittene. Die gewaehlten Werte gehen dem Wettertext vor
// (Lage, Hoch/Tief): fiele sonst ein Wert weg, bleiben vom Wetter Symbol und
// Temperatur.
function kopfEinpassen(){
  const kz=el('kopfzeile'); if(!kz || kz.hidden) return;
  const box=kz.querySelector('.kz-werte'); if(!box) return;
  const wxText=kz.querySelector('.kz-wx .m');
  const passen=()=>{ const rechts=box.getBoundingClientRect().right;
    [...box.children].forEach(c=>{ c.hidden=false; });
    let weg=false;
    [...box.children].forEach(c=>{ if(c.getBoundingClientRect().right > rechts+1){ c.hidden=true; weg=true; } });
    return weg; };
  if(wxText) wxText.hidden=false;
  if(passen() && wxText){ wxText.hidden=true; passen(); }
}
// ---- Werteleiste (ui.valueBar, view.leiste) ----
// Die Anzeige-Bausteine einer Seite (Messwerte, Zaehler, Texte, Ein/Aus-
// Anzeigen) als Kette von Werten in EINER Zeile ueber dem Raster statt als
// Kacheln; der Server trennt sie (_leiste_trennen), das Raster bleibt dem
// Bedienbaren. Dieselben Chips wie die Werte der Kopfzeile, ein Tipp oeffnet
// wie die Kachel die Wertseite. Was nicht in die Zeile passt, scrollt
// waagerecht - nicht ausblenden wie dort: diese Werte haben keine Kachel mehr.
function leisteAktiv(){ return !!(view && !view.widget && !view.front && Array.isArray(view.leiste) && view.leiste.length); }
function leisteHoehe(ks){ return leisteAktiv() ? Math.round(LEISTE_H*(ks||kachelFaktor)) : 0; }
function leisteChip(it,i){ return kopfWertHtml(it, ' data-i="'+i+'" data-id="'+esc(String(it.id))+'"'); }
function renderLeiste(){
  const lz=el('werteleiste'), sc=document.querySelector('.screen'); if(!lz || !sc) return;
  const an=leisteAktiv();
  sc.classList.toggle('leiste', an); lz.hidden=!an;
  if(!an){ lz.innerHTML=''; return; }
  lz.innerHTML=view.leiste.map(leisteChip).join('');
  lz.querySelectorAll('.kz-w').forEach(n=>{ n.onclick=()=>{ const it=view.leiste[+n.dataset.i]; if(it&&it.nav) nav(it.nav); }; });
}
// Gleiche Seite, neue Werte: nur Zustand, Symbol und Texte der Chips nachziehen,
// die Zeile bleibt stehen (Scroll-Lage, keine neuen Elemente). Andere Werte
// oder eine andere Anzahl -> false, dann baut render() neu.
function updateLeiste(items){
  const lz=el('werteleiste'); if(!lz) return false;
  const neu=Array.isArray(items)?items:[];
  const nodes=lz.hidden?[]:[...lz.querySelectorAll('.kz-w')];
  if(nodes.length!==neu.length) return false;
  for(let i=0;i<neu.length;i++){ if(String(neu[i].id)!==nodes[i].dataset.id) return false; }
  neu.forEach((it,i)=>{
    const n=nodes[i], tmp=document.createElement('div'); tmp.innerHTML=leisteChip(it,i);
    const soll=tmp.firstChild;
    if(n.className!==soll.className) n.className=soll.className;
    if((n.getAttribute('style')||'')!==(soll.getAttribute('style')||'')) n.setAttribute('style', soll.getAttribute('style')||'');
    ['.ico','.vl','.nm'].forEach(q=>{ const a=n.querySelector(q), b=soll.querySelector(q); if(a&&b&&a.outerHTML!==b.outerHTML) a.outerHTML=b.outerHTML; });
  });

// Mausrad ueber der Zeile scrollt sie waagerecht (am Touch-Panel wischt man)
{ const lz=el('werteleiste'); if(lz) lz.addEventListener('wheel', e=>{
